# 라이브지니 집 회선 프록시 (D-LV1-13) — 팀 맥 미니에서만 돌린다. README.md 참고.
# 이 장비 안(127.0.0.1)에서만 받는다. 바깥(EC2)은 SSH 역방향 터널로만 닿는다 — 공유기·방화벽에 8888을 열지 않는다.
# 유튜브 방송 소리에 필요한 곳(HTTPS CONNECT 443)만 통과시키고 나머지는 거절한다.
# 경로는 Homebrew(애플 실리콘, /opt/homebrew) 기준. 인텔 맥이면 /usr/local 로 바꾼다.

Port 8888
Listen 127.0.0.1
# 바깥으로 나가는 연결에 쓰는 주소는 운영체제에 맡긴다(Bind 없음)

Timeout 600
MaxClients 40

# 이 장비 안에서 온 요청만(터널 끝도 127.0.0.1로 들어온다)
Allow 127.0.0.1

# HTTPS 터널만. 평문 http 목적지는 도메인 필터에서 함께 걸러진다
ConnectPort 443

# 받는 쪽에 프록시 흔적·출발지 정보를 붙이지 않는다
DisableViaHeader Yes
XTinyproxy No

# 도메인 허용 목록(그 밖은 거절, 403 "Filtered")
Filter "/opt/homebrew/etc/tinyproxy/livegenie-filter"
FilterType ere
FilterURLs Off
FilterCaseSensitive Off
FilterDefaultDeny Yes

# Connect 수준: 연결한 호스트 이름만 남는다(HTTPS 안의 주소·내용은 프록시도 볼 수 없다). 파일은 README의 newsyslog로 돌린다
LogFile "/opt/homebrew/var/log/tinyproxy/livegenie.log"
LogLevel Connect
