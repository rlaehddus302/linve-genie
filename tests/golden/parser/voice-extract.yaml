# V3 — 숫자 하나가 붙은 토큰 (R-17 5, D-V3-12). 크롬이 '삼광색금'을 '3강색급'·'3강 세금'으로 적는다. 숫자 한 개 + 한글이면 그 숫자를 한자어로 바꾼 모양도 창에서 본다.
# 자모 수: 삼광색금 = 삼(ㅅㅏㅁ 3) 광(ㄱㅘㅇ 3) 색(ㅅㅐㄱ 3) 금(ㄱㅡㅁ 3) = 12. 0.8 이상 = 거리 × 5 ≤ 12 → 거리 2까지.
# (사전 별칭 — 데이터 파일의 삼강세금 등 — 은 이 suite의 입력이 아니다. 별칭 사례는 수용 기준 표 R-표.)
suite: voice-extract
settings:
  dictionary: [삼광색금, 빅뱅금, 백봉]
cases:
  - { in: "180번 3강색급 35만 원", out: { no: 180, name: 삼광색금, price: 350000, confidence: LOW } }   # 3강색급 → 삼강색급: 강/광(ㅏ→ㅘ) 1 + 급/금(ㅂ→ㅁ) 1 = 2 → 0.83
  - { in: "174번 상강 색금 28만 원", out: { no: 174, name: 삼광색금, price: 280000, confidence: LOW } }  # 창 '상강색금': 상/삼(ㅇ→ㅁ) 1 + 강/광 1 = 2 → 0.83 (P2 규칙도 같음)
  - { in: "15번 삼광 색금 만원", out: { no: 15, name: 삼광색금, price: 10000, confidence: HIGH } }      # 띄어 쓴 이름은 창이 붙여 맞춘다(공백만 다름)
  - { in: "15번 3강 세금 만원", out: { no: 15, price: 10000, confidence: LOW } }                     # '삼강세금': 강/광 1 + 세/색(ㅔ→ㅐ, ㄱ 넣기) 2 = 3 → 3×5 > 12 → 맞추지 않음(별칭으로 잡는다)
  - { in: "15번 703강 세금 만원", out: { no: 15, price: 10000, confidence: LOW } }                   # 숫자 셋이 붙은 토큰은 바꾸지 않는다. 703강은 번호도 아니다
