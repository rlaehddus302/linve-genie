# V3 적대 판정(TD-V3-002, D-V3-25·27): 원 가격 줄 앞의 수는 자리가 겹칠 때만 떼어 '번' 없는 번호로 본다.
# 겹침 = 뗀 수 L의 0이 아닌 가장 낮은 자리 ≤ 꼬리 첫 토큰의 계수 C(만·천 앞 수)의 가장 높은 자리. 겹치지 않는데 안 읽히면(백오만 — D-032) 번호·가격 모두 비움.
suite: voice-extract
settings:
  dictionary: [라울]
cases:
  - { in: "100 5만 원", out: { confidence: LOW } }                    # L 100 가장 낮은 자리 백 > C 5 가장 높은 자리 일 → 떼지 않음. '백오만원'은 D-032로 안 읽힘 → 애매, 100도 번호 아님
  - { in: "이백 오만 원", out: { confidence: LOW } }                   # L 200(백) > C 5(일) → 비움
  - { in: "육백 삼만원", out: { confidence: LOW } }                    # 줄 [육백, 삼만원]: L 600(백) > C 3(일) → 비움
  - { in: "자 300 2만 원", out: { confidence: LOW } }                  # L 300(백) > C 2(일) → 비움
  - { in: "174 28만 원", out: { no: 174, price: 280000, confidence: LOW } }   # L 174(일) ≤ C 28(십) → 겹침 → 떼어 174번, 꼬리 280,000
  - { in: "15번 100 5만 원", out: { no: 15, confidence: LOW } }         # 번호 표시가 있어 떼지 않음 → 가격 비움, 번호는 15번
  - { in: "택배는 이 삼 일 걸리고 만 원이에요", out: { price: 10000, confidence: LOW } }   # D-V3-27: 띄어 쓴 한글 한 글자 셋은 '번' 없으면 번호 아님(231번 아님). 줄 [만, 원이에요] 10,000
  - { in: "이 삼 일번 라울 만원", out: { no: 231, name: 라울, price: 10000, confidence: HIGH } }  # '번'이 붙으면 자리 읽기 + 번 = 231번
---
# V3 적대 판정(f3bc723c, D-V3-29): 원 가격 줄의 단위 뒤 띄어 쓴 숫자. R-14는 '2천500'·'1만 500'을 애매로 막지만(줄임말과 글자 그대로가 갈림),
# 원 가격 줄은 한자어로 바꿔 자리를 드러낸 뒤 읽는다. 바꾼 뒤 만·천·백 바로 뒤에 한글 일의 자리 하나가 오면 R-14 D-032로 여전히 안 읽힘 → 비움.
suite: voice-extract
settings:
  dictionary: [라울]
cases:
  - { in: "15번 라울 5천 500원", out: { no: 15, name: 라울, price: 5500, confidence: HIGH } }        # R-14 '5천 500원' null → '오천'+'오백원' = 오천오백원 5,500
  - { in: "15번 라울 1만 500원", out: { no: 15, name: 라울, price: 10500, confidence: HIGH } }       # '일만'+'오백원' = 10,500
  - { in: "15번 라울 2만 5천 500원", out: { no: 15, name: 라울, price: 25500, confidence: HIGH } }   # '이만오천오백원' 25,500
  - { in: "15번 라울 5천 50원", out: { no: 15, name: 라울, price: 5050, confidence: HIGH } }         # '오천오십원' 5,050
  - { in: "15번 라울 1만 5원", out: { no: 15, name: 라울, confidence: LOW } }                        # '일만오원' — 만 바로 뒤 일의 자리(D-032) → 비움
  - { in: "15번 라울 2천 5원", out: { no: 15, name: 라울, confidence: LOW } }                        # '이천오원' — 천 바로 뒤 일의 자리(D-032) → 비움
