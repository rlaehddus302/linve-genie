# I4 — 끊어 말한 번호 (R-17 3·4, TD-P2-002, D-I4-01). 번호 표시의 X 바로 앞 토큰(그대로)을 X 앞에 공백 없이 붙인 글이 R-15로 읽히면
# 번호를 끊어 말했거나 인식이 갈랐을 수 있다 → 그런 표시가 하나라도 있으면 no·price 모두 null(그래서 LOW, 자동 확정 없음). 품종은 평소대로.
# 이 규칙이 없을 때(P2 구현)의 결과를 오른쪽 주석에 적었다 — 대부분 엉뚱한 번호의 HIGH였다.
# 품종 계산: 번호 표시 토큰·가격 묶음 토큰을 뺀 덩어리에서 사전 이름과 정확히 같은 창 하나(앞 조각 '1'·'십'·'이'·'백'은 사전 이름과 맞지 않는다).
suite: voice-extract
settings:
  dictionary: [핑크프릴, 라울, 블루엘프]
cases:
  - { in: "1 5번 핑크프릴 만오천 원", out: { name: 핑크프릴, confidence: LOW } }           # '1'+'5' = '15'(R-15 15). 규칙 없으면 5번·15,000원 HIGH
  - { in: "1, 5번 라울 만원", out: { name: 라울, confidence: LOW } }                      # 토큰 끝 ','를 지우면 '1' — 같다. 규칙 없으면 5번·10,000원 HIGH
  - { in: "1 5 번 라울 만원", out: { name: 라울, confidence: LOW } }                      # 띄어 쓴 '5 번'의 X '5' 앞 '1' → '15'. 규칙 없으면 5번 HIGH
  - { in: "십 오번 라울 오천 원", out: { name: 라울, confidence: LOW } }                  # '십'+'오' = '십오'(15). 규칙 없으면 5번·5,000원 HIGH
  - { in: "이 십 번 블루엘프 칠천 원", out: { name: 블루엘프, confidence: LOW } }          # '십 번'의 X '십' 앞 '이' → '이십'(20). 규칙 없으면 10번 HIGH
  - { in: "이 십오번 핑크프릴 만원", out: { name: 핑크프릴, confidence: LOW } }            # '이'+'십오' = '이십오'(25). 규칙 없으면 15번 HIGH
  - { in: "백 오번 라울", out: { name: 라울, confidence: LOW } }                           # '백'+'오' = '백오'(105). 규칙 없으면 5번·'백'=100원 HIGH (가격도 비우는 이유)
  - { in: "2 15번 핑크프릴 만원", out: { name: 핑크프릴, confidence: LOW } }               # '2'+'15' = '215'. 규칙 없으면 15번 HIGH
  - { in: "백 이십 삼번 라울 만원", out: { name: 라울, confidence: LOW } }                 # '이십'+'삼' = '이십삼'(23). 가격 묶음 '백 이십'(120)·'만원'은 그래도 품종 창에서 빠진다. 규칙 없으면 3번
  - { in: "15번 1 5번 핑크프릴 만원", out: { name: 핑크프릴, confidence: LOW } }           # 끊어 말한 표시가 하나라도 있으면 비운다('15번'이 따로 있어도). 규칙 없으면 가격 10,000원
  # 앞 토큰을 붙인 글이 R-15로 읽히지 않으면 해당 없다 — 흔한 말버릇 뒤의 번호는 그대로
  - { in: "이 15번 핑크프릴 만원", out: { no: 15, name: 핑크프릴, price: 10000, confidence: HIGH } }   # '이15'는 수가 아니다('이 15번' = 이 15번 상품)
  - { in: "네 15번 라울 오천 원", out: { no: 15, name: 라울, price: 5000, confidence: HIGH } }        # '네15'는 수가 아니다
