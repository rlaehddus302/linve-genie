# V3 — '번' 없는 번호 (R-17 3, D-V3-23 사용자 결정 "번호 부를 때 번 없이 부를 때도 있어. 168을 백육십팔, 일육팔 이렇게 부를 때도").
# 문장에 'N번'이 없을 때만: 가격 줄 밖의 따로 선 수(숫자 1~4자리·R-15 한글 수 두 글자 이상·자리 읽기, 끝말 은·는·이·가·요 허용)가 번호 후보.
# 다음 토큰이 단위 낱말(원·만·천·백·cm·센치·개·마리·일·시 …)이면, 수에 다른 글자가 붙었으면(9cm에·3강) 후보 아님. 앞 토큰과 붙여 R-15로 읽히면 끊어 말한 번호 → 비움.
# 후보가 서로 다르면 비움. 가격 줄은 처음 읽히는 꼬리(자리가 내려갈 때만 합침): '170 25만 원' = 170 + 250,000.
suite: voice-extract
settings:
  dictionary: [삼광색금, 라울]
cases:
  - { in: "백육십팔 삼광색금 이십오만 원", out: { no: 168, name: 삼광색금, price: 250000, confidence: HIGH } }  # R-15 백육십팔 = 168(네 글자). 줄 [이십오만, 원]
  - { in: "168 삼광색금 25만 원", out: { no: 168, name: 삼광색금, price: 250000, confidence: HIGH } }      # 숫자 168. '삼광색금'에서 줄이 멈춤
  - { in: "일육팔은 25만 원", out: { no: 168, price: 250000, confidence: LOW } }                         # 끝말 '은' 뗀 '일육팔' = 자리 읽기. '일육팔은'은 금액 글자 토큰이 아니라 줄에 안 듦
  - { in: "자 9cm에 이거 25만 원 170", out: { no: 170, price: 250000, confidence: LOW } }                # '9cm에'는 글자가 붙어 후보 아님. 줄 [25만, 원] 뒤 '170'이 후보
  - { in: "삼광색금 3강 25만 원", out: { name: 삼광색금, price: 250000, confidence: LOW } }                # '3강'은 한글이 붙어 번호 아님 → 번호 없음
  - { in: "170 25만 원", out: { no: 170, price: 250000, confidence: LOW } }                            # 줄 [170, 25만, 원] 통째 '백칠십이십오만원' 안 읽힘 → 꼬리 [25만, 원], 170은 줄 밖 → 번호
  - { in: "168은 라울 만원", out: { no: 168, name: 라울, price: 10000, confidence: HIGH } }
  - { in: "9 라울 만원", out: { no: 9, name: 라울, price: 10000, confidence: HIGH } }                    # 한 자리 숫자도 후보(사용자 결정 — 위험은 사용자 확인 필요 표)
  - { in: "라울 10", out: { no: 10, name: 라울, confidence: LOW } }                                    # 숫자만 있는 말은 가격이 아니고(D-202) '번' 없는 번호다. 원이 없어 바로 등록은 아님
  - { in: "15번 168 라울 만원", out: { no: 15, name: 라울, price: 10000, confidence: HIGH } }            # 'N번'이 있으면 '번' 없는 수는 보지 않는다
  - { in: "1000번 168 라울 만원", out: { name: 라울, price: 10000, confidence: LOW } }                  # 범위 밖이어도 번호 표시가 있으면 '번' 없는 수를 보지 않는다
  - { in: "170 자 이거 25만 원 180", out: { price: 250000, confidence: LOW } }                         # 후보 170·180 서로 다름 → 비움
  - { in: "170 라울 170 이거 만원", out: { no: 170, name: 라울, price: 10000, confidence: HIGH } }       # 같은 후보 되풀이는 애매하지 않다('170 만원'처럼 붙으면 줄 [170, 만원] = 백칠십만원이 되므로 '이거'를 끼움)
  - { in: "백육십팔 이십오만 원", out: { no: 168, price: 250000, confidence: LOW } }                     # 줄 통째 '백육십팔이십오만원' 안 읽힘 → 꼬리 [이십오만, 원], 백육십팔은 줄 밖 → 번호
  - { in: "핑크문 칠백", out: { no: 700, name: null, confidence: LOW } }                                 # 원 없는 한글 수: 번호 표시가 없으면 범위 안(1..999)의 수는 번호 후보가 먼저(가격 묶음에서 뺀다)
  - { in: "핑크문 만팔천", out: { price: 18000, confidence: LOW } }                                      # 만팔천 = 18000은 범위 밖이라 후보가 아니다 → 지금처럼 가격 묶음
  - { in: "백 육십팔 라울 만원", out: { name: 라울, confidence: LOW } }                              # '백'은 한 글자라 후보 아님, '육십팔' 앞 '백'을 붙이면 168 → 끊어 말한 번호 → 번호 비움(68번 아님). 가격: '백'(100)이 가격 묶음이고 '만원'과 달라 비움
  - { in: "1 68 라울 만원", out: { name: 라울, price: 10000, confidence: LOW } }                       # '1'+'68' = 168 → 끊어 말한 번호 → 비움
  - { in: "3 개 라울 만원", out: { name: 라울, price: 10000, confidence: LOW } }                       # 다음 토큰 '개'가 단위 낱말 → 후보 아님
  - { in: "오 예쁘다 라울 만원", out: { name: 라울, price: 10000, confidence: LOW } }                   # '오' 한 글자 → 후보 아님
