  - { in: "네 108번 bts 어 요한이 10만 원까지 안토 일단 색감 안쪽 봐주세요", out: { no: 108, price: 100000, confidence: LOW } }
  # 2: 번호가 끝에. 줄 [10만, 원] 100,000
  - { in: "자 bts는 자 bts 요거 그대로 보냅니다 요 아이 자 10만 원 108번", out: { no: 108, price: 100000, confidence: LOW } }
  # 3: 줄 셋 [35만, 원까지] [35만, 원까지] [30, 5만, 원] = 350,000 셋 다 같음(P2 규칙은 50,000이 섞여 null). '3강색급' → 삼강색급 0.83 → 삼광색금('상관 세금'은 0.67이라 아님)
  - { in: "자 180번 상관 세금 자 요 아이 자 유아이 35만 원까지 네 요 아이는 35만 원까지 그대로 봅니다 색금 이렇게 잘 들었어요 자 3강색급 요 아이는 30 5만 원", out: { no: 180, name: 삼광색금, price: 350000, confidence: LOW } }
  # 4: '174번' 하나(뒤 '174'는 '번' 없음). 줄 [28만, 원] 둘. '28마리까지'는 가격 아님. '상강 색금' 0.83
  - { in: "자 파이텐트까지 나오는 상강색 게임 잘 들었어요 자 상강 색금 자 요 아이 자 28만 원 174번 자 174 자 이거 28만 원 자 3강색은 요 아이 28마리까지", out: { no: 174, name: 삼광색금, price: 280000, confidence: LOW } }
  # 5: 번호 표시는 '3번' 하나('9cm에'·'170'·'3강'·'703강'은 번호 아님 — 사용자 규칙, D-V3-02·D-V3-20). 줄 [25만, 원] [25만, 원] [25만, 원까지]. '3강 세금' 0.75 → name null
  - { in: "자 9cm에 자 9cm에 3번 자 3강 세금 뿌리 다 남았고요 얘는 자 25만 원 170 자 요런 색금 예쁘게 나왔습니다 이거 25만 원 3강 세금 170 자 이 703강 세금이 자 25만 원까지", out: { no: 3, price: 250000, confidence: LOW } }
  # 6: '189번인데'(끝말 인데) · '139번' 서로 다른 번호 → no null(가까운 번호를 고르지 않는다, D-V3-05). '빅뱅 금' → 빅뱅금
