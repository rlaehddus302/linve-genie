# 한글 수사 → 정수 (음성의 상품 번호용)
suite: korean-number
cases:
  - { in: "십오", out: 15 }
  - { in: "십오번", out: 15 }
  - { in: "15번", out: 15 }
  - { in: "이십일", out: 21 }
  - { in: "백이", out: 102 }
  - { in: "백이십삼번", out: 123 }
  - { in: "구십구", out: 99 }
  - { in: "열다섯", out: 15 }             # 고유어 수사도 허용
  - { in: "스무", out: 20 }
  - { in: "핑크프릴", out: null }
---
# S01 보강 — 금액 해석 세부 (DOMAIN_RULES R-14, D-029). WON 단위.
# 판단 기준: 애매한 금액은 추측하지 않고 null(가격 다시 입력) — 잘못된 가격 등록보다 다시 묻는 편이 안전하다.
suite: amount
settings: { unit: WON }
cases:
  # 숫자 형식
  - { in: "1,000,000", out: 1000000 }
  - { in: "0", out: 0 }
  - { in: "0원", out: 0 }
  - { in: " 2만원 ", out: 20000 }          # 앞뒤 공백
  - { in: "１만", out: 10000 }              # 전각 숫자
  - { in: "10,00", out: null }              # 쉼표 묶음이 세 자리가 아님
  - { in: "1,0000", out: null }
  - { in: "10 000", out: null }             # 숫자 사이 공백은 잇지 않는다
  - { in: "0500", out: null }               # 0으로 시작하는 정수(0 자체 제외)
  - { in: "1.5", out: null }                # 1.5원 → 원 단위 소수
  - { in: "9007199254740993", out: null }   # 안전한 정수 범위(2^53-1) 밖
  # 한글 단위 — 계수 생략은 1, 큰 단위부터 한 번씩
  - { in: "천원", out: 1000 }
  - { in: "백원", out: 100 }
  - { in: "오백원", out: 500 }
  - { in: "일만", out: 10000 }
  - { in: "십만원", out: 100000 }           # 만의 계수 = 십(10) → 10×10000
  - { in: "오십만", out: 500000 }
  - { in: "천만원", out: 10000000 }         # 만의 계수 = 천(1000)
  - { in: "1천만", out: 10000000 }
  - { in: "2만 오천", out: 25000 }          # 20000 + 5000
  - { in: "2만5천5백원", out: 25500 }       # 20000 + 5000 + 500
  - { in: "1.5천", out: 1500 }              # 소수 계수는 단위 하나뿐일 때만
  - { in: "0.5만", out: 5000 }
  # 만 뒤 숫자 나머지는 정확히 네 자리만
  - { in: "1만 2500원", out: 12500 }        # 10000 + 2500
  - { in: "1만 2,500원", out: 12500 }
  - { in: "1만5", out: null }               # '만오(천)'=15000 줄임말인지 10005인지 애매 → 거부
  - { in: "1만 500", out: null }
  - { in: "2천500", out: null }             # 만 말고 다른 단위 뒤 숫자 나머지는 거부
  # 거부 — 순서·반복·지원하지 않는 단위·다른 글자
  - { in: "5천 1만", out: null }            # 단위 순서 거꾸로
  - { in: "1만 1만", out: null }            # 같은 단위 두 번
  - { in: "1.5만5천", out: null }           # 소수 계수 뒤에 다른 단위
  - { in: "1억", out: null }                # 억 이상은 지원하지 않는다
  - { in: "+5000", out: null }
  - { in: "5000원원", out: null }           # '원'은 맨 끝에 한 번만
  - { in: "원5000", out: null }
  - { in: "원", out: null }
  - { in: "만원이요", out: null }           # 금액 뒤 다른 글자
  - { in: "", out: null }
---
# S01 보강 — 천원 단위 (D-007, R-14)
suite: amount
settings: { unit: THOUSAND }
cases:
  - { in: "0", out: 0 }                     # 0 × 1000
  - { in: "1.5", out: 1500 }                # 1.5 < 1000 → × 1000
  - { in: "7.25", out: 7250 }
  - { in: "7.2555", out: null }             # 7255.5원 → 원 단위 소수
  - { in: "1,000", out: 1000 }              # 1000 이상은 원 그대로
  - { in: "1,500", out: 1500 }
  - { in: "1000.5", out: null }             # 1000 이상 → 원 → 1000.5원
  - { in: "10원", out: 10 }                 # '원'이 붙으면 단위 설정 무시 → 10원
  - { in: "8000원", out: 8000 }
  - { in: "5백", out: 500 }                 # 한글 단위가 있으면 단위 설정 무시
---
# S01 보강 — 한글 수사 세부 (DOMAIN_RULES R-15, D-029). 결과 1..9999
suite: korean-number
cases:
  - { in: "일", out: 1 }
  - { in: "십", out: 10 }
  - { in: "백", out: 100 }
  - { in: "천이백", out: 1200 }
  - { in: "구천구백구십구", out: 9999 }
  - { in: "십오 번", out: 15 }             # '번' 앞 공백 허용
  - { in: "015번", out: 15 }
  - { in: "하나", out: 1 }
  - { in: "스물다섯", out: 25 }
  - { in: "아흔아홉", out: 99 }
  - { in: "영", out: null }                # 0은 번호가 아니다
  - { in: "0", out: null }
  - { in: "만", out: null }                # 9999 초과
  - { in: "10000", out: null }
  - { in: "일오", out: null }              # 숫자 하나씩 읽기는 받지 않는다(15인지 1·5인지 애매)
  - { in: "오오", out: null }
  - { in: "십십", out: null }              # 같은 단위 두 번
  - { in: "백열다섯", out: null }          # 한자어·고유어 섞기
  - { in: "십오번 핑크프릴", out: null }   # 입력 전체가 수 하나여야 한다
  - { in: "", out: null }
---
# S01 분쟁 판정 — 단위 바로 뒤 한글 일의 자리 (DOMAIN_RULES R-14 4, D-032, RA-S01-002). WON 단위.
# 한글 일의 자리(일~구)는 앞에 단위가 없거나 바로 앞 단위가 '십'일 때만. 바로 앞이 만·천·백이면 줄임말(만오=15,000)인지 글자 그대로(10,005)인지 애매 → null.
suite: amount
settings: { unit: WON }
cases:
  # 실패 — 일의 자리 바로 앞이 만·천·백
  - { in: "만오", out: null }               # 만 뒤 '오' (15,000? 10,005?)
  - { in: "만오원", out: null }
  - { in: "만 오", out: null }              # 공백을 사이에 둬도 바로 앞 단위는 만
  - { in: "이만오", out: null }             # 25,000? 20,005?
  - { in: "천오", out: null }               # 1,500? 1,005?
  - { in: "삼천오", out: null }             # 3,500? 3,005?
  - { in: "오천오 원", out: null }          # 5,500? 5,005?
  - { in: "백오", out: null }               # 150? 105?
  - { in: "1천오", out: null }              # 숫자 계수여도 '오'의 바로 앞 단위는 천
  - { in: "1만 오", out: null }
  - { in: "만오천오", out: null }           # 끝의 '오' 바로 앞이 천 (15,500? 15,005?)
  - { in: "백만오", out: null }             # 만의 계수 '백' 다음 만, 그 뒤 '오' → 바로 앞 단위 만
  - { in: "백오만", out: null }             # 만의 계수 '백오' 안에서 '오' 바로 앞이 백 (150만? 105만?)
  # 받음 — 앞에 단위가 없거나 바로 앞 단위가 십, 또는 '오'가 단위의 계수
  - { in: "오", out: 5 }                    # 앞에 단위 없음 → 5
  - { in: "오십오", out: 55 }               # 50 + 5 ('오' 바로 앞 단위 십)
  - { in: "백오십", out: 150 }              # 100 + 5×10 ('오'는 십의 계수)
  - { in: "천오백원", out: 1500 }           # 1000 + 5×100
  - { in: "만십오", out: 10015 }            # 10000 + 10 + 5 ('오' 바로 앞 단위 십)
  - { in: "만오백", out: 10500 }            # 10000 + 5×100 ('오'는 백의 계수)
  - { in: "만 오백 원", out: 10500 }
  - { in: "오만", out: 50000 }              # 만의 계수 '오' (앞에 단위 없음)
  - { in: "오만오천", out: 55000 }          # 5×10000 + 5×1000
  - { in: "십오만", out: 150000 }           # 만의 계수 '십오' = 15 ('오' 바로 앞 단위 십) → 15×10000
  - { in: "105만", out: 1050000 }           # 숫자 계수는 이 규칙과 무관 → 105×10000
---
# S01 분쟁 판정 — 단위 바로 뒤 한글 일의 자리, 천원 단위에서도 같다 (D-032)
suite: amount
settings: { unit: THOUSAND }
cases:
  - { in: "만오", out: null }
  - { in: "삼천오", out: null }
  - { in: "천오백", out: 1500 }             # 한글 단위가 있으면 단위 설정 무시 → 1000 + 500
---
# S01 분쟁 판정 — 한글 수사(번호)는 글자 그대로 읽는다. R-14의 D-032 규칙은 적용하지 않는다 (R-15)
suite: korean-number
cases:
  - { in: "백오", out: 105 }                # 100 + 5 (번호 '백오번' = 105번)
  - { in: "천오번", out: 1005 }             # 1000 + 5
