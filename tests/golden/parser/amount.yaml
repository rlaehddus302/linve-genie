# 금액 파서 — 빠른 입력·음성 공용. 결과는 정수 원. 실패는 out: null
suite: amount
settings: { unit: WON }
cases:
  - { in: "10000", out: 10000 }
  - { in: "10,000", out: 10000 }
  - { in: "10000원", out: 10000 }
  - { in: "1만", out: 10000 }
  - { in: "만원", out: 10000 }
  - { in: "만 원", out: 10000 }
  - { in: "1만5천", out: 15000 }
  - { in: "1만 5천원", out: 15000 }
  - { in: "만오천원", out: 15000 }
  - { in: "1.5만", out: 15000 }
  - { in: "8천", out: 8000 }
  - { in: "팔천원", out: 8000 }
  - { in: "오천", out: 5000 }
  - { in: "칠천오백원", out: 7500 }
  - { in: "삼만원", out: 30000 }
  - { in: "이만 오천 원", out: 25000 }
  - { in: "12만", out: 120000 }
  - { in: "십이만원", out: 120000 }
  - { in: "백만원", out: 1000000 }
  - { in: "만 이천 오백 원", out: 12500 }
  - { in: "10", out: 10 }                 # WON 단위면 그대로 (유효성 검사는 별도)
  - { in: "공짜", out: null }
  - { in: "1.25만", out: 12500 }
  - { in: "1.23456만", out: null }        # 12345.6원 → 원 단위 소수 발생 → 거부
  - { in: "-5000", out: null }
---
suite: amount
settings: { unit: THOUSAND }
cases:
  - { in: "10", out: 10000 }              # 1000 미만 정수 = 천원 단위
  - { in: "8", out: 8000 }
  - { in: "15", out: 15000 }
  - { in: "500", out: 500000 }
  - { in: "999", out: 999000 }
  - { in: "1000", out: 1000 }             # 1000 이상은 원 그대로
  - { in: "10000", out: 10000 }
  - { in: "1만", out: 10000 }             # 한글 단위가 있으면 단위 설정 무시
  - { in: "8천", out: 8000 }
  - { in: "7.5", out: 7500 }
---
# 한글 수사 → 정수 (음성의 상품 번호용)
suite: korean-number
cases:
  - { in: "십오", out: 15 }
  - { in: "십오번", out: 15 }
  - { in: "15번", out: 15 }
  - { in: "이십일", out: 21 }
  - { in: "백이", out: 102 }
  - { in: "백이십삼번", out: 123 }
  - { in: "구십구", out: 99 }
  - { in: "열다섯", out: 15 }             # 고유어 수사도 허용
  - { in: "스무", out: 20 }
  - { in: "핑크프릴", out: null }
