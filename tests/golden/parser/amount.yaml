# 금액 파서 — 빠른 입력·음성 공용. 결과는 정수 원. 실패는 out: null
suite: amount
settings: { unit: WON }
cases:
  - { in: "10000", out: 10000 }
  - { in: "10,000", out: 10000 }
  - { in: "10000원", out: 10000 }
  - { in: "1만", out: 10000 }
  - { in: "만원", out: 10000 }
  - { in: "만 원", out: 10000 }
  - { in: "1만5천", out: 15000 }
  - { in: "1만 5천원", out: 15000 }
  - { in: "만오천원", out: 15000 }
  - { in: "1.5만", out: 15000 }
  - { in: "8천", out: 8000 }
  - { in: "팔천원", out: 8000 }
  - { in: "오천", out: 5000 }
  - { in: "칠천오백원", out: 7500 }
  - { in: "삼만원", out: 30000 }
  - { in: "이만 오천 원", out: 25000 }
  - { in: "12만", out: 120000 }
  - { in: "십이만원", out: 120000 }
  - { in: "백만원", out: 1000000 }
  - { in: "만 이천 오백 원", out: 12500 }
  - { in: "10", out: 10 }                 # WON 단위면 그대로 (유효성 검사는 별도)
  - { in: "공짜", out: null }
  - { in: "1.25만", out: 12500 }
  - { in: "1.23456만", out: null }        # 12345.6원 → 원 단위 소수 발생 → 거부
  - { in: "-5000", out: null }
---
suite: amount
settings: { unit: THOUSAND }
cases:
  - { in: "10", out: 10000 }              # 1000 미만 정수 = 천원 단위
  - { in: "8", out: 8000 }
  - { in: "15", out: 15000 }
  - { in: "500", out: 500000 }
  - { in: "999", out: 999000 }
  - { in: "1000", out: 1000 }             # 1000 이상은 원 그대로
  - { in: "10000", out: 10000 }
  - { in: "1만", out: 10000 }             # 한글 단위가 있으면 단위 설정 무시
  - { in: "8천", out: 8000 }
  - { in: "7.5", out: 7500 }
---
# 한글 수사 → 정수 (음성의 상품 번호용)
suite: korean-number
cases:
  - { in: "십오", out: 15 }
  - { in: "십오번", out: 15 }
  - { in: "15번", out: 15 }
  - { in: "이십일", out: 21 }
  - { in: "백이", out: 102 }
  - { in: "백이십삼번", out: 123 }
  - { in: "구십구", out: 99 }
  - { in: "열다섯", out: 15 }             # 고유어 수사도 허용
  - { in: "스무", out: 20 }
  - { in: "핑크프릴", out: null }
---
# S01 보강 — 금액 해석 세부 (DOMAIN_RULES R-14, D-029). WON 단위.
# 판단 기준: 애매한 금액은 추측하지 않고 null(가격 다시 입력) — 잘못된 가격 등록보다 다시 묻는 편이 안전하다.
suite: amount
settings: { unit: WON }
cases:
  # 숫자 형식
  - { in: "1,000,000", out: 1000000 }
  - { in: "0", out: 0 }
  - { in: "0원", out: 0 }
  - { in: " 2만원 ", out: 20000 }          # 앞뒤 공백
  - { in: "１만", out: 10000 }              # 전각 숫자
  - { in: "10,00", out: null }              # 쉼표 묶음이 세 자리가 아님
  - { in: "1,0000", out: null }
  - { in: "10 000", out: null }             # 숫자 사이 공백은 잇지 않는다
  - { in: "0500", out: null }               # 0으로 시작하는 정수(0 자체 제외)
  - { in: "1.5", out: null }                # 1.5원 → 원 단위 소수
  - { in: "9007199254740993", out: null }   # 안전한 정수 범위(2^53-1) 밖
  # 한글 단위 — 계수 생략은 1, 큰 단위부터 한 번씩
  - { in: "천원", out: 1000 }
  - { in: "백원", out: 100 }
  - { in: "오백원", out: 500 }
  - { in: "일만", out: 10000 }
  - { in: "십만원", out: 100000 }           # 만의 계수 = 십(10) → 10×10000
  - { in: "오십만", out: 500000 }
  - { in: "천만원", out: 10000000 }         # 만의 계수 = 천(1000)
  - { in: "1천만", out: 10000000 }
  - { in: "2만 오천", out: 25000 }          # 20000 + 5000
  - { in: "2만5천5백원", out: 25500 }       # 20000 + 5000 + 500
  - { in: "1.5천", out: 1500 }              # 소수 계수는 단위 하나뿐일 때만
  - { in: "0.5만", out: 5000 }
  # 만 뒤 숫자 나머지는 정확히 네 자리만
  - { in: "1만 2500원", out: 12500 }        # 10000 + 2500
  - { in: "1만 2,500원", out: 12500 }
  - { in: "1만5", out: null }               # '만오(천)'=15000 줄임말인지 10005인지 애매 → 거부
  - { in: "1만 500", out: null }
  - { in: "2천500", out: null }             # 만 말고 다른 단위 뒤 숫자 나머지는 거부
  # 거부 — 순서·반복·지원하지 않는 단위·다른 글자
  - { in: "5천 1만", out: null }            # 단위 순서 거꾸로
  - { in: "1만 1만", out: null }            # 같은 단위 두 번
  - { in: "1.5만5천", out: null }           # 소수 계수 뒤에 다른 단위
  - { in: "1억", out: null }                # 억 이상은 지원하지 않는다
  - { in: "+5000", out: null }
  - { in: "5000원원", out: null }           # '원'은 맨 끝에 한 번만
  - { in: "원5000", out: null }
  - { in: "원", out: null }
  - { in: "만원이요", out: null }           # 금액 뒤 다른 글자
  - { in: "", out: null }
---
# S01 보강 — 천원 단위 (D-007, R-14)
suite: amount
settings: { unit: THOUSAND }
cases:
  - { in: "0", out: 0 }                     # 0 × 1000
  - { in: "1.5", out: 1500 }                # 1.5 < 1000 → × 1000
  - { in: "7.25", out: 7250 }
  - { in: "7.2555", out: null }             # 7255.5원 → 원 단위 소수
  - { in: "1,000", out: 1000 }              # 1000 이상은 원 그대로
  - { in: "1,500", out: 1500 }
  - { in: "1000.5", out: null }             # 1000 이상 → 원 → 1000.5원
  - { in: "10원", out: 10 }                 # '원'이 붙으면 단위 설정 무시 → 10원
  - { in: "8000원", out: 8000 }
  - { in: "5백", out: 500 }                 # 한글 단위가 있으면 단위 설정 무시
---
# S01 보강 — 한글 수사 세부 (DOMAIN_RULES R-15, D-029). 결과 1..9999
suite: korean-number
cases:
  - { in: "일", out: 1 }
  - { in: "십", out: 10 }
  - { in: "백", out: 100 }
  - { in: "천이백", out: 1200 }
  - { in: "구천구백구십구", out: 9999 }
  - { in: "십오 번", out: 15 }             # '번' 앞 공백 허용
  - { in: "015번", out: 15 }
  - { in: "하나", out: 1 }
  - { in: "스물다섯", out: 25 }
  - { in: "아흔아홉", out: 99 }
  - { in: "영", out: null }                # 0은 번호가 아니다
  - { in: "0", out: null }
  - { in: "만", out: null }                # 9999 초과
  - { in: "10000", out: null }
  - { in: "일오", out: null }              # 숫자 하나씩 읽기는 받지 않는다(15인지 1·5인지 애매)
  - { in: "오오", out: null }
  - { in: "십십", out: null }              # 같은 단위 두 번
  - { in: "백열다섯", out: null }          # 한자어·고유어 섞기
  - { in: "십오번 핑크프릴", out: null }   # 입력 전체가 수 하나여야 한다
  - { in: "", out: null }
