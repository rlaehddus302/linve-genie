# O1 — 댓글 옵션 인식 (DOMAIN_RULES R-20, SPEC CMT-01~CMT-05, D-O-07~D-O-10)
# O0 초안(tests/golden/drafts/o1/comment-options.yaml.draft, 89사례)을 O1 시작 때 옮겼다(D-O-01). 기대값은 그대로다.
# 형식은 tests/golden/README.md "파서 사례 형식"의 comment-options 줄(입력 catalog·focus, out 키 orders·cancels·mentions·review).
# 허용 목록에는 넣지 않는다 — O1 범위라 O1 끝에는 모두 통과해야 한다.
#
# 기대값은 R-20의 순서로 손으로 따라가 정했다: 2 번호 문법 먼저 → 3 상품 후보(가 이름 / 나 맨 앞 번호 / 다 지금 상품) → 4 옵션(숫자 먼저) → 수량 → 꼬리 → 남은 말 → 5 해석 고르기·검사.
---
# A — 식품·의류·수건·화분이 섞인 방송. 지금 상품 = 31 수건(2분 전에 정함).
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - { no: 11, name: 초코 과자, aliases: [초코] }
  - { no: 12, name: 감자칩 }
  - no: 21
    name: 반바지
    options:
      - { name: 사이즈, choices: [{ label: S, aliases: [스몰] }, { label: M, aliases: [엠, 미디움] }, { label: L, aliases: [라지] }] }
  - no: 31
    name: 수건
    options:
      - { name: 색상, choices: [{ label: 흰색, aliases: [화이트, 흰] }, { label: 검정색, aliases: [검정, 블랙] }] }
      - { name: 크기, choices: [{ label: 소형 }, { label: 중형 }, { label: 대형, aliases: [큰거] }] }
  - no: 51
    name: 화분
    options:
      - { name: 크기, choices: [{ label: 1호 }, { label: 2호 }, { label: 3호 }] }
  - no: 61
    name: 양말 세트
    options:
      - { name: 구성, choices: [{ label: 5켤레 }] }        # 선택지 하나 → 댓글에 없어도 그 선택지
focus: { no: 31, ageSec: 120 }
cases:
  # 사용자 예시
  - { in: "초코 과자 3", out: { orders: [{ no: 11, qty: 3 }] } }                                   # 이름(가) '초코과자' → 이름 바로 뒤 맨숫자 3 = 수량
  - { in: "반바지 M", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }               # 이름 → 옵션 M, 수량 안 씀 = 1
  - { in: "흰색 대형 2개", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 }] } }   # 이름·번호 없음 → 지금 상품(다) 31, 옵션 둘, 단위 수량 2. 지금 상품 120초 ≥ 15초
  # 상품 이름·별칭
  - { in: "초코과자 3개", out: { orders: [{ no: 11, qty: 3 }] } }                                   # 비교 글자는 공백 무시
  - { in: "초코 과자 3개요", out: { orders: [{ no: 11, qty: 3 }] } }                                # 꼬리말 '요'
  - { in: "초코 3", out: { orders: [{ no: 11, qty: 3 }] } }                                        # 별칭 '초코'
  - { in: "초코과자 두개", out: { orders: [{ no: 11, qty: 2 }] } }                                  # 한글 수 '두' + 단위
  - { in: "3개 초코과자", out: { orders: [{ no: 11, qty: 3 }] } }                                   # 단위가 붙은 수는 어디에 있어도 수량
  - { in: "감자칩", out: { orders: [{ no: 12, qty: 1 }] } }                                         # 옵션 없는 상품 이름만 = 1개
  - { in: "양말 세트 2", out: { orders: [{ no: 61, options: { 구성: 5켤레 }, qty: 2 }] } }           # 이름 안의 '세트'는 이름이 먼저 차지. 선택지 하나인 항목은 자동
  # 옵션 값
  - { in: "반바지 m", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }               # 영문 대소문자 무시
  - { in: "반바지 엠 2개", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 2 }] } }          # 동의어
  - { in: "찜 반바지 M", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }            # 맨 앞 '찜'
  - { in: "반바지 M 주세요 💕", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }      # 꼬리말 + 허용 이모지
  - { in: "반바지,M,2개", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 2 }] } }           # 쉼표는 구분자
  - { in: "반바지M", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }                # 붙여 써도 된다
  - { in: "블랙 소형", out: { orders: [{ no: 31, options: { 색상: 검정색, 크기: 소형 }, qty: 1 }] } }  # 지금 상품, 동의어 '블랙'
  - { in: "대형 흰색", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 1 }] } }     # 옵션 순서는 상관없다. 결과는 항목 순서
  - { in: "흰색 대형 2", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 }] } }   # 옵션 값 바로 뒤 맨숫자 = 수량
  - { in: "수건 흰색 대형 2개", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 }] } }
  - { in: "화분 2호 3", out: { orders: [{ no: 51, options: { 크기: 2호 }, qty: 3 }] } }              # '2호'는 옵션이 먼저 차지 → 남은 3이 수량
  - { in: "화분2호", out: { orders: [{ no: 51, options: { 크기: 2호 }, qty: 1 }] } }
  # 번호 문법이 먼저 (다육과 같은 댓글은 같은 뜻)
  - { in: "15", out: { orders: [{ no: 15, qty: 1 }] } }                                          # 15번 상품은 아직 없다 → 엔진이 보류 찜으로(R-5)
  - { in: "11 12", out: { orders: [{ no: 11, qty: 1 }, { no: 12, qty: 1 }] } }                   # 번호 둘 — 수량이 아니다
  - { in: "11 2", out: { orders: [{ no: 11, qty: 1 }, { no: 2, qty: 1 }] } }                     # 번호 뒤 맨숫자는 수량이 아니다(다육 '15 28'과 같다)
  - { in: "21", out: { review: { reason: OPTION_MISSING, no: 21 } } }                           # 번호 문법인데 옵션 상품(변형 셋)
  - { in: "11 21", out: { review: { reason: OPTION_MISSING, no: 21 } } }                        # 옵션 상품이 하나라도 있으면 메시지 전체가 확인 필요(11도 주문하지 않는다)
  - { in: "21 2", out: { review: { reason: OPTION_MISSING, no: 21 } } }                         # 번호 문법 '21 2' = 21번·2번 → 21이 옵션 상품
  - { in: "11 취소", out: { cancels: [11] } }
  # 맨 앞 번호(나)
  - { in: "21 M", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }
  - { in: "21 M 2", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 2 }] } }              # 옵션 바로 뒤 맨숫자 = 수량
  - { in: "11 2개", out: { orders: [{ no: 11, qty: 2 }] } }                                      # 번호 문법 아님('2개') → 맨 앞 번호 11, 단위 수량 2
  - { in: "11번 3개요", out: { orders: [{ no: 11, qty: 3 }] } }
  - { in: "21 반바지 M", out: { orders: [{ no: 21, options: { 사이즈: M }, qty: 1 }] } }          # 번호와 이름이 같은 상품
  # 확인 필요
  - { in: "반바지", out: { review: { reason: OPTION_MISSING, no: 21 } } }                       # 사이즈 없음
  - { in: "반바지 XL", out: { review: { reason: UNKNOWN_WORD, no: 21 } } }                       # 없는 선택지 — 남은 말 한 덩어리, 옵션 상품
  - { in: "반바지 예뻐요", out: { review: { reason: UNKNOWN_WORD, no: 21 } } }                    # 남은 말 한 덩어리면 확인 필요로 모은다(판매자가 '주문 아님'으로 지움)
  - { in: "반바지 M L", out: { review: { reason: OPTION_CONFLICT, no: 21 } } }                   # 한 항목에 둘
  - { in: "반바지 M 20개", out: { review: { reason: QTY_INVALID, no: 21, options: { 사이즈: M }, qty: 20 } } }   # 20 > maxQuantity 10
  - { in: "반바지 M 0개", out: { review: { reason: QTY_INVALID, no: 21, options: { 사이즈: M }, qty: 0 } } }
  - { in: "화분 2", out: { review: { reason: OPTION_MISSING, no: 51, qty: 2 } } }                # '2'는 '2호'가 아니다 → 이름 뒤 맨숫자 = 수량, 크기 없음
  - { in: "흰색", out: { review: { reason: OPTION_MISSING, no: 31, options: { 색상: 흰색 } } } }   # 지금 상품, 크기 없음
  - { in: "대형", out: { review: { reason: OPTION_MISSING, no: 31, options: { 크기: 대형 } } } }
  - { in: "흰색 검정 대형", out: { review: { reason: OPTION_CONFLICT, no: 31 } } }
  - { in: "반바지 M 감자칩", out: { review: { reason: MULTI_PRODUCT } } }                         # 이름이 두 상품
  - { in: "초코 과자 3 감자칩 2", out: { review: { reason: MULTI_PRODUCT } } }
  - { in: "12 반바지 M", out: { review: { reason: MULTI_PRODUCT } } }                             # 맨 앞 번호(감자칩)와 이름(반바지)이 다른 상품
  # 주문 아님(언급)
  - { in: "반바지 M 너무 예뻐요", out: {} }                                                       # 남은 말 두 덩어리 → 언급(번호 없음)
  - { in: "초코 과자 맛있어요", out: {} }                                                         # 옵션 없는 상품 + 남은 말 → 언급
  - { in: "반바지 M 있나요?", out: {} }                                                          # 질문 기호
  - { in: "21 M?", out: { mentions: [21] } }
  - { in: "초코 과자 3 취소", out: { mentions: [3] } }                                            # 번호 취소 문법이 아닌 '취소'
  - { in: "초코 과자 12,000원", out: {} }                                                        # 금액 덩어리 — 언급에서도 빠진다
  - { in: "3개", out: { mentions: [3] } }                                                        # 지금 상품은 옵션 값을 하나 이상 읽어야 후보가 된다
  - { in: "S", out: {} }                                                                         # 지금 상품(수건)에 S 없음, 다른 후보 없음
  - { in: "안녕하세요", out: {} }
---
# B — 휴대폰 케이스. 지금 상품 = 41 폰케이스. 17번(그립톡)도 있다 — '17'의 뜻이 갈린다.
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - { no: 17, name: 그립톡 }
  - no: 41
    name: 폰케이스
    aliases: [케이스]
    options:
      - name: 기종
        choices:
          - { label: 아이폰 17 프로, aliases: [17프로, 17pro] }
          - { label: 아이폰 17 }
          - { label: 갤럭시 S25, aliases: [s25, 갤s25] }
focus: { no: 41, ageSec: 60 }
cases:
  - { in: "아이폰 17 프로", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 프로 }, qty: 1 }] } }      # 사용자 예시: 옵션 사전이 17을 먼저 차지 — 수량 아님
  - { in: "아이폰 17", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 }, qty: 1 }] } }              # 가장 긴 것: '프로'가 없으니 '아이폰 17'
  - { in: "아이폰 17 프로 2개", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 프로 }, qty: 2 }] } }
  - { in: "아이폰 17 2", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 }, qty: 2 }] } }            # '17' 뒤에 공백 → 옵션 '아이폰 17'이 맞고, 그 뒤 맨숫자 2 = 수량
  - { in: "17 프로", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 프로 }, qty: 1 }] } }           # (나) 17번 그립톡 + 남은 '프로' → 안 맞음. (다) 별칭 '17프로' → 맞음 → 하나뿐
  - { in: "17", out: { orders: [{ no: 17, qty: 1 }] } }                                                  # 번호 문법 — 17은 지금 상품의 선택지 이름·별칭과 같지 않다
  - { in: "17 2개", out: { orders: [{ no: 17, qty: 2 }] } }                                              # (나) 맞음. (다) '17'이 옵션이 아니라 남음 → 안 맞음
  - { in: "갤s25", out: { orders: [{ no: 41, options: { 기종: 갤럭시 S25 }, qty: 1 }] } }
  - { in: "갤럭시 s25 3개", out: { orders: [{ no: 41, options: { 기종: 갤럭시 S25 }, qty: 3 }] } }
  - { in: "폰케이스 아이폰 17 프로", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 프로 }, qty: 1 }] } }
  - { in: "케이스 17프로 3개", out: { orders: [{ no: 41, options: { 기종: 아이폰 17 프로 }, qty: 3 }] } }
  - { in: "아이폰 17 프로 갤럭시 S25", out: { review: { reason: OPTION_CONFLICT, no: 41 } } }
  - { in: "케이스", out: { review: { reason: OPTION_MISSING, no: 41 } } }
  - { in: "아이폰", out: {} }                                                                            # 선택지 일부만 — 맞추지 않는다(언급)
  - { in: "그립톡 아이폰 17", out: { mentions: [17] } }                                                   # 그립톡은 옵션 없음 + 남은 말 둘 → 언급
---
# C — 지금 상품이 방금(5초 전) 바뀌었다. 앞 상품을 보고 쓴 댓글이 늦게 왔을 수 있다.
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - no: 31
    name: 수건
    options:
      - { name: 색상, choices: [{ label: 흰색, aliases: [화이트] }, { label: 검정색, aliases: [검정, 블랙] }] }
      - { name: 크기, choices: [{ label: 소형 }, { label: 대형 }] }
focus: { no: 31, ageSec: 5 }
cases:
  - { in: "흰색 대형 2개", out: { review: { reason: FOCUS_CHANGED, no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 } } }
  - { in: "수건 흰색 대형 2개", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 }] } }   # 이름을 쓰면 유예와 상관없다
  - { in: "흰색", out: { review: { reason: OPTION_MISSING, no: 31, options: { 색상: 흰색 } } } }              # 검사 순서: 빠진 항목이 먼저
---
# C2 — 경계: 정해진 지 정확히 15초면 지금 상품을 쓴다(15초 미만만 유예).
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - no: 31
    name: 수건
    options:
      - { name: 색상, choices: [{ label: 흰색 }, { label: 검정색 }] }
      - { name: 크기, choices: [{ label: 소형 }, { label: 대형 }] }
focus: { no: 31, ageSec: 15 }
cases:
  - { in: "흰색 대형", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 1 }] } }
---
# D — 지금 상품이 없다(아직 아무것도 공개·지정하지 않음).
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - no: 31
    name: 수건
    options:
      - { name: 색상, choices: [{ label: 흰색 }, { label: 검정색 }] }
      - { name: 크기, choices: [{ label: 소형 }, { label: 대형 }] }
focus: null
cases:
  - { in: "흰색 대형 2개", out: { mentions: [2] } }                                                    # 상품 후보 없음 → 언급
  - { in: "수건 흰색 대형 2개", out: { orders: [{ no: 31, options: { 색상: 흰색, 크기: 대형 }, qty: 2 }] } }
---
# E — 숫자 사이즈(95·100·105). 지금 상품 = 22 반팔티, 100번 상품(양말)도 있다.
suite: comment-options
settings: { maxNumber: 999, maxQuantity: 10 }
catalog:
  - no: 22
    name: 반팔티
    options:
      - { name: 사이즈, choices: [{ label: "95" }, { label: "100" }, { label: "105", price: 2000 }] }
      - { name: 색상, choices: [{ label: 흰색, aliases: [화이트] }, { label: 검정색, aliases: [검정, 블랙] }] }
  - { no: 100, name: 양말 }
focus: { no: 22, ageSec: 60 }
cases:
  - { in: "100", out: { review: { reason: NUMBER_AMBIGUOUS } } }                                       # 숫자만 + 지금 상품의 선택지와 같음
  - { in: "105", out: { review: { reason: NUMBER_AMBIGUOUS } } }                                       # 105번 상품이 없어도 같다
  - { in: "100 흰색", out: { orders: [{ no: 22, options: { 사이즈: "100", 색상: 흰색 }, qty: 1 }] } }   # (나) 양말 + 남은 '흰색' → 안 맞음. (다) 맞음
  - { in: "100 2개", out: { review: { reason: NUMBER_AMBIGUOUS } } }                                   # (나) 양말 2개 맞음, (다) 사이즈 100·2개(색상 빠짐)도 들어맞음 → 둘
  - { in: "양말 2", out: { orders: [{ no: 100, qty: 2 }] } }
  - { in: "95 흰색", out: { orders: [{ no: 22, options: { 사이즈: "95", 색상: 흰색 }, qty: 1 }] } }     # 95번 상품 없음 → (다)만
  - { in: "반팔티 105 검정 2", out: { orders: [{ no: 22, options: { 사이즈: "105", 색상: 검정색 }, qty: 2 }] } }
