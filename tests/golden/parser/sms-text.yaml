# R-26 문자 읽기 (SMS3 — D-SMS3-09·D-SMS3-10). 휴대폰이 받은 문자 하나(보낸 곳 + 본문) → 문자찜/취소 요청/확인 필요/거름/찜 아님.
# 코어 parseSmsText를 부른다. `from`을 적지 않으면 휴대폰 번호 "010-1234-5678"에서 온 문자다(README "파서 사례 형식" sms-text 줄).
# 손 계산 순서: ① 보낸 곳(휴대폰/휴대폰 아님/이름만) ② R-3 정규화 ③ 거를 낱말 ④ 확실한 모양(전체 STRICT → 마지막 토큰 이름 → 첫 토큰 이름)
#               ⑤ 아니면 STRICT 언급 → UNCLEAR, 없으면 {} ⑥ OPTIONS·이름만 바꾸기.
suite: sms-text
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 999 }
cases:
  # ── 확실한 문자찜 — 번호만 (④-1, R-3 STRICT 그대로) ──
  - { in: "775", out: { claims: [775] } }
  - { in: "775번", out: { claims: [775] } }
  - { in: "찜 775", out: { claims: [775] } }
  - { in: "775찜", out: { claims: [775] } }
  - { in: "775번 주세요", out: { claims: [775] } }
  - { in: "775번이요!!", out: { claims: [775] } }
  - { in: "0775", out: { claims: [775] } }                       # 선행 0 (R-3)
  - { in: "７７５", out: { claims: [775] } }                     # 전각 숫자
  - { in: "775 💕", out: { claims: [775] } }                    # 💕 U+1F495는 R-3 꼬리 이모지 허용 목록
  - { in: "775🌱", out: { claims: [775] } }                     # 🌱 U+1F331 허용 목록
  - { in: "775 776", out: { claims: [775, 776] } }
  # D-SMS3-15: 쉼표 목록은 천 단위 묶음 모양이 아닌 것만 번호 목록. "775,776,777"은 금액 모양(R-3 STRICT, 채팅 "12,500"→{}과 같은 규칙)이라 아래 {}로 고정
  - { in: "15,28,31", out: { claims: [15, 28, 31] } }
  - { in: "775,776,777", out: {} }
  - { in: "1 2 3 4 5", out: { claims: [1, 2, 3, 4, 5] } }        # 서로 다른 번호 5개까지 주문
  # ── 확실한 문자찜 — 이름 꼬리·머리 (④-2) ──
  - { in: "775 홍길동", out: { claims: [775], memo: "홍길동" } }   # 마지막 토큰 홍길동 → 남은 "775" STRICT 주문
  - { in: "775번 홍길동", out: { claims: [775], memo: "홍길동" } }
  - { in: "홍길동 775", out: { claims: [775], memo: "홍길동" } }   # 마지막 "775"는 이름 아님 → 첫 토큰 홍길동
  - { in: "홍길동 775번이요", out: { claims: [775], memo: "홍길동" } }
  - { in: "찜 775 홍길동", out: { claims: [775], memo: "홍길동" } }
  - { in: "775 홍길동입니다", out: { claims: [775], memo: "홍길동" } }  # 끝 "입니다" 뗌
  - { in: "민지예요 775", out: { claims: [775], memo: "민지" } }        # 끝 "예요" 뗌
  - { in: "775 홍길동이에요", out: { claims: [775], memo: "홍길동" } }  # "이에요"(긴 것 먼저)
  - { in: "775 홍길동이요", out: { claims: [775], memo: "홍길동" } }    # "이요"
  - { in: "775\n홍길동", out: { claims: [775], memo: "홍길동" } }      # 줄바꿈 = 공백
  - { in: "  775   홍길동  ", out: { claims: [775], memo: "홍길동" } }
  - { in: "775　홍길동", out: { claims: [775], memo: "홍길동" } }       # U+3000 전각 공백도 공백
  - { in: "７７５번 김영희", out: { claims: [775], memo: "김영희" } }
  - { in: "775 776 홍길동", out: { claims: [775, 776], memo: "홍길동" } }
  - { in: "775/776 김영희", out: { claims: [775, 776], memo: "김영희" } }
  - { in: "775, 776 김영희", out: { claims: [775, 776], memo: "김영희" } }
  - { in: "775번 776번 홍길동입니다", out: { claims: [775, 776], memo: "홍길동" } }
  - { in: "775 775 홍길동", out: { claims: [775], memo: "홍길동" } }  # 같은 번호는 하나
  - { in: "775 홍길동!!", out: { claims: [775], memo: "홍길동" } }    # 끝 ! 뗌
  - { in: "775 홍길동ㅎㅎ", out: { claims: [775], memo: "홍길동" } }   # 끝 ㅎ 뗌
  - { in: "775 다육이맘", out: { claims: [775], memo: "다육이맘" } }   # 별명도 한글 2~10자면 이름
  - { in: "775 남궁민수", out: { claims: [775], memo: "남궁민수" } }
  - { in: "홍길동님 775", out: { claims: [775], memo: "홍길동님" } }  # "님"은 떼지 않는다(끝이 요·다·까가 아님)
  # ── 취소 요청 (R-3 STRICT 취소 — 번호 하나) ──
  - { in: "775 취소", out: { cancels: [775] } }
  - { in: "775번 취소요", out: { cancels: [775] } }
  - { in: "775 취소할게요 ㅠㅠ", out: { cancels: [775] } }           # R-3 취소 꼬리 ㅠ 허용
  - { in: "775 취소 홍길동", out: { cancels: [775], memo: "홍길동" } }
  - { in: "홍길동 775 취소해주세요", out: { cancels: [775], memo: "홍길동" } }  # 마지막 토큰은 "취소" 포함 → 첫 토큰
  # ── 확인 필요 UNCLEAR — 번호는 있는데 확실하지 않음 (⑤) ──
  - { in: "775 776 취소", out: { review: [775, 776], why: UNCLEAR } }  # 취소는 번호 하나만. 꼬리 "취소"는 ④에서 이름 아님
  - { in: "취소 775", out: { review: [775], why: UNCLEAR } }
  - { in: "775 있나요?", out: { review: [775], why: UNCLEAR } }
  - { in: "775?", out: { review: [775], why: UNCLEAR } }
  - { in: "775 ❓", out: { review: [775], why: UNCLEAR } }
  - { in: "775 예뻐요", out: { review: [775], why: UNCLEAR } }        # "예뻐요"는 요로 끝나 이름 아님
  - { in: "775 김영희요", out: { review: [775], why: UNCLEAR } }      # "요" 하나는 떼지 않는다 → 요로 끝남
  - { in: "775 감사합니다", out: { review: [775], why: UNCLEAR } }    # 다로 끝남
  - { in: "775 아직 있어요", out: { review: [775], why: UNCLEAR } }
  - { in: "775 아님", out: { review: [775], why: UNCLEAR } }          # 아님으로 시작
  - { in: "775 패스", out: { review: [775], why: UNCLEAR } }
  - { in: "775 얼마", out: { review: [775], why: UNCLEAR } }
  - { in: "775 안철수", out: { review: [775], why: UNCLEAR } }        # "안"으로 시작하는 이름도 확인 필요(안전한 쪽)
  - { in: "775 홍 길동", out: { review: [775], why: UNCLEAR } }       # 띄어 쓴 이름
  - { in: "775홍길동", out: { review: [775], why: UNCLEAR } }         # 붙여 쓴 이름 — 토큰 하나
  - { in: "775 hong", out: { review: [775], why: UNCLEAR } }          # 영문은 이름 아님
  - { in: "775 홍길동 ❤️", out: { review: [775], why: UNCLEAR } }     # 이름 뒤 이모지 토큰 — 이름 하나 떼기로 안 됨
  - { in: "775 홍길동🌱", out: { review: [775], why: UNCLEAR } }      # 이름 토큰에 이모지
  - { in: "775 💔", out: { review: [775], why: UNCLEAR } }            # 허용 목록 밖 이모지 → R-3 언급
  - { in: "775번 2개요", out: { review: [775, 2], why: UNCLEAR } }
  - { in: "775 말고 776", out: { review: [775, 776], why: UNCLEAR } }
  - { in: "775-776", out: { review: [775, 776], why: UNCLEAR } }      # "-"는 R-3 구분자 아님
  - { in: "3시에 775 주세요", out: { review: [3, 775], why: UNCLEAR } }
  - { in: "775 1000", out: { review: [775], why: UNCLEAR } }          # 1000은 범위 밖 → 주문 아님, 언급은 775만
  - { in: "1 2 3 4 5 6", out: { review: [1, 2, 3, 4, 5, 6], why: UNCLEAR } }  # 6개 이상은 주문 아님(R-3 상한). 마지막·첫 토큰 숫자는 이름 아님
  - { in: "775 776 777 홍길동 김영희", out: { review: [775, 776, 777], why: UNCLEAR } }
  # 금액·전화번호 섞임 — 금액 덩어리는 언급에 없음, 010은 언급 10(판매자가 고르는 후보일 뿐)
  - { in: "775 15,000원", out: { review: [775], why: UNCLEAR } }
  - { in: "775 3만원 홍길동", out: { review: [775, 3], why: UNCLEAR } }
  - { in: "775 12,000원 입금했어요", out: { review: [775], why: UNCLEAR } }  # "입금"은 거를 낱말이 아니다
  - { in: "775 010-1234-5678", out: { review: [775, 10], why: UNCLEAR } }    # 덩어리 775·010(=10)·1234·5678 → 범위 안 775·10
  - { in: "775 김영희 010 1234 5678", out: { review: [775, 10], why: UNCLEAR } }
  # ── 찜 아님 {} — 범위 안 번호가 없음 ──
  - { in: "안녕하세요 사장님", out: {} }
  - { in: "입금했어요", out: {} }
  - { in: "12,000원 입금했어요 홍길동", out: {} }                       # 금액 덩어리뿐
  - { in: "1.5 홍길동", out: {} }                                       # 숫자.숫자 = 금액
  - { in: "칠백칠십오번이요", out: {} }                                 # 한글 수는 읽지 않음
  - { in: "1000", out: {} }
  - { in: "0", out: {} }
  - { in: "ㅋㅋㅋ", out: {} }
  - { in: "", out: {} }
  # ── 거름 EXCLUDED — 거를 낱말 (③, 본문 무엇이든) ──
  - { in: "(광고) 다육이 특가 775원", out: { skip: EXCLUDED } }
  - { in: "[광고] 775", out: { skip: EXCLUDED } }
  - { in: "[Web발신]\n775", out: { skip: EXCLUDED } }                  # 영문 대소문자 무시
  - { in: "[web발신] 인증번호 [1234]", out: { skip: EXCLUDED } }
  - { in: "인증번호는 0775입니다", out: { skip: EXCLUDED } }
  - { in: "승인 12,000원 일시불", out: { skip: EXCLUDED } }
  - { in: "[국제발신] 입금 14,000원", out: { skip: EXCLUDED } }
  - { in: "775 결제할게요", out: { skip: EXCLUDED } }                  # 손님 문자여도 거른다(D-SMS3-09 — 휴대폰엔 남음)
  - { in: "775 택배로 보내주세요", out: { skip: EXCLUDED } }
  # ── 보낸 곳 (①) ──
  - { from: "1588-9999", in: "775", out: { skip: NOT_MOBILE } }
  - { from: "1588-9999", in: "안녕", out: { skip: NOT_MOBILE } }           # 본문을 보지 않는다
  - { from: "02-123-4567", in: "775 홍길동", out: { skip: NOT_MOBILE } }
  - { from: "070-1234-5678", in: "775", out: { skip: NOT_MOBILE } }
  - { from: "#1004", in: "775", out: { skip: NOT_MOBILE } }
  - { from: "010-1234", in: "775", out: { skip: NOT_MOBILE } }             # 일부만 — 숫자와 - 뿐인데 휴대폰 번호 아님
  - { from: "+82 2-1234-5678", in: "775", out: { skip: NOT_MOBILE } }      # 82 뗌 → 212345678(9자리) → 0 붙임 → 0212345678, 휴대폰 아님
  - { from: "+82 10-1234-5678", in: "775", out: { claims: [775] } }        # 82 뗌 → 1012345678 → 0 붙임 → 01012345678
  - { from: "+821012345678", in: "775 홍길동", out: { claims: [775], memo: "홍길동" } }
  - { from: "01012345678", in: "775", out: { claims: [775] } }
  - { from: "010 1234 5678", in: "775", out: { claims: [775] } }
  - { from: "０１０-１２３４-５６７８", in: "775", out: { claims: [775] } }  # 전각 숫자 보낸 곳
  - { from: "+82 10-1234-5678", in: "[Web발신] 775", out: { skip: EXCLUDED } }  # 휴대폰이어도 거를 낱말
  # 이름만 — 번호를 모르면 문자찜은 확인 필요 NO_NUMBER (⑥)
  - { from: "홍길동", in: "775", out: { review: [775], why: NO_NUMBER } }
  - { from: "홍길동", in: "775 김영희", out: { review: [775], why: NO_NUMBER, memo: "김영희" } }
  - { from: "단골 3호", in: "775", out: { review: [775], why: NO_NUMBER } }  # 글자가 섞이면 이름
  - { from: null, in: "775", out: { review: [775], why: NO_NUMBER } }
  - { from: "", in: "775", out: { review: [775], why: NO_NUMBER } }
  - { from: "홍길동", in: "775 취소", out: { cancels: [775] } }             # 취소 요청은 그대로 — 승인은 판매자
  - { from: "홍길동", in: "775 있나요?", out: { review: [775], why: UNCLEAR } }
  - { from: "홍길동", in: "안녕하세요", out: {} }
  - { from: "홍길동", in: "(광고) 775", out: { skip: EXCLUDED } }
---
# 옵션 방송 — 번호가 있는 결과는 모두 확인 필요 OPTIONS (⑥, 옵션·수량은 문자에서 읽지 않는다)
suite: sms-text
settings: { parseMode: OPTIONS, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "775", out: { review: [775], why: OPTIONS } }
  - { in: "775 홍길동", out: { review: [775], why: OPTIONS, memo: "홍길동" } }
  - { in: "775 취소", out: { review: [775], why: OPTIONS } }
  - { in: "775 있나요?", out: { review: [775], why: OPTIONS } }
  - { in: "775 반바지 M", out: { review: [775], why: OPTIONS } }
  - { from: "홍길동", in: "775", out: { review: [775], why: OPTIONS } }     # OPTIONS가 NO_NUMBER보다 먼저
  - { in: "안녕하세요", out: {} }
  - { in: "(광고) 775", out: { skip: EXCLUDED } }
---
# 여러 번호 FIRST — R-3 그대로 첫 번호만
suite: sms-text
settings: { parseMode: STRICT, multiNumber: FIRST, maxNumber: 999 }
cases:
  - { in: "775 776 홍길동", out: { claims: [775], memo: "홍길동" } }
  - { in: "775 776", out: { claims: [775] } }
---
# 여러 번호 IGNORE — 번호 둘 이상은 R-3 언급 → 확인 필요
suite: sms-text
settings: { parseMode: STRICT, multiNumber: IGNORE, maxNumber: 999 }
cases:
  - { in: "775 776", out: { review: [775, 776], why: UNCLEAR } }  # ④-2에서 남은 한 번호는 주문이 되지만 떼어 낸 토큰이 숫자라 이름 아님
  - { in: "775 홍길동", out: { claims: [775], memo: "홍길동" } }
---
# 번호 상한 99 — 범위 밖 번호는 주문도 언급도 아님
suite: sms-text
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 99 }
cases:
  - { in: "775", out: {} }
  - { in: "15 홍길동", out: { claims: [15], memo: "홍길동" } }
  - { in: "15 775", out: { review: [15], why: UNCLEAR } }   # 775 범위 밖 → 주문 아님, 언급 15
---
# LOOSE 방송도 문자는 STRICT로 읽는다
suite: sms-text
settings: { parseMode: LOOSE, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "775 너무 예뻐요", out: { review: [775], why: UNCLEAR } }
  - { in: "775 홍길동", out: { claims: [775], memo: "홍길동" } }
