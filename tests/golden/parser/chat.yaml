suite: chat
settings: { parseMode: LOOSE, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "15번 너무 예뻐요 살게요", out: { claims: [15] } }
  - { in: "15번 18번 중에 뭐가 나아요?", out: { claims: [15, 18] } }
  - { in: "예뻐요 15번", out: { mentions: [15] } }   # 맨 앞이 번호가 아니면 주문 아님
