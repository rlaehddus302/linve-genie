# S01 분쟁 판정 — LOOSE에서도 허용 목록·번호 개수 상한은 같다 (D-033, D-034)
suite: chat
settings: { parseMode: LOOSE, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "1 2 3 4 5 6 다 주세요", out: { mentions: [1, 2, 3, 4, 5, 6] } }  # 가장 긴 주문 부분 '1 2 3 4 5 6'이 6개 → 짧은 앞부분으로 물러나지 않고 주문 아님
  - { in: "1 2 3 4 5 다 주세요", out: { claims: [1, 2, 3, 4, 5] } }         # 5개 → 주문
  - { in: "15❓ 남았나요", out: { mentions: [15] } }        # '15' 뒤가 ❓(꼬리 기호 아님) → 주문 부분이 끝나지 않음
  - { in: "15😭 놓쳤어요", out: { mentions: [15] } }        # 😭는 주문 꼬리 기호가 아님
  - { in: "15🥰예뻐요", out: { claims: [15] } }             # 허용 목록 꼬리 기호로 끝난 주문 부분
