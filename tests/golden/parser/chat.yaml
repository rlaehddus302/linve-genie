# S01 보강 — maxNumber를 바꾼 경우 (D-028 범위 규칙)
suite: chat
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 50 }
cases:
  - { in: "50", out: { claims: [50] } }
  - { in: "51", out: {} }                                 # 범위 밖 → 언급도 없음
  - { in: "15 51", out: { mentions: [15] } }
  - { in: "51번 예뻐요", out: {} }
  - { in: "51 취소", out: {} }
