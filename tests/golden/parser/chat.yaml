# S01 보강 — LOOSE: 맨 앞 주문 부분은 끝·공백 앞에서 끝나거나 꼬리 기호로 끝나야 한다. 취소가 우선 (D-028)
suite: chat
settings: { parseMode: LOOSE, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "3개 남았나요?", out: { mentions: [3] } }       # '3' 뒤가 '개' → 주문 부분이 끝나지 않음
  - { in: "15개요", out: { mentions: [15] } }
  - { in: "15?", out: { mentions: [15] } }
  - { in: "15번 2개 가능해요?", out: { claims: [15] } }   # '15번 2'는 '개' 앞이라 안 되고, '15번'까지가 주문. 나머지 숫자는 언급하지 않는다
  - { in: "15번이요 감사합니다", out: { claims: [15] } }
  - { in: "15!!예뻐요", out: { claims: [15] } }           # 꼬리 기호로 끝난 주문 부분
  - { in: "15 취소", out: { cancels: [15] } }
  - { in: "15 취소할게요 죄송해요", out: { cancels: [15] } }  # 맨 앞이 취소 문법이면 취소
  - { in: "15번 사려다 취소", out: { mentions: [15] } }   # '취소'가 들어간 메시지는 주문으로 보지 않는다
  - { in: "안녕하세요 15", out: { mentions: [15] } }
  - { in: "12,500원이요", out: {} }                       # 금액 모양은 LOOSE에서도 번호가 아니다
