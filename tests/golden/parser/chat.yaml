# S01 보강 — multiNumber: IGNORE
suite: chat
settings: { parseMode: STRICT, multiNumber: IGNORE, maxNumber: 999 }
cases:
  - { in: "15 15", out: { claims: [15] } }                # 같은 번호 반복은 번호 하나
  - { in: "15,28,31", out: { mentions: [15, 28, 31] } }
  - { in: "15 취소", out: { cancels: [15] } }
