  - { in: "1 2 3 4 5 6", out: { mentions: [1, 2, 3, 4, 5, 6] } }   # 6개 → 주문 아님(첫 번호만 주문으로 살리지 않는다)
  - { in: "1 2 3 4 5", out: { claims: [1] } }                      # 5개 → 주문, FIRST라 첫 번호만
