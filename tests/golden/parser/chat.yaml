suite: chat
settings: { parseMode: STRICT, multiNumber: IGNORE, maxNumber: 999 }
cases:
  - { in: "1 2 3 4 5 6", out: { mentions: [1, 2, 3, 4, 5, 6] } }   # 원래도 둘 이상이면 언급 — 결과 같음
