# S01 분쟁 판정 — LOOSE 끝 신호 (D-035, TD-S01-005). LOOSE, 기본 설정.
# 두 자리 — (가) 고른(가장 긴) 주문·취소 부분 바로 뒤 (나) 끝 경계와 상관없이 문법에 맞는 가장 긴 맨 앞 부분 바로 뒤 — 에서
# 공백·피부색 수식 문자·보이지 않는 글자(Default_Ignorable_Code_Point)를 건너뛴 첫 글자가
# ① 질문 기호(? ？ ❓ ❔ ⁉) ② 그 부분의 꼬리 기호가 아닌 한글 자모 ③ 그 부분의 꼬리 기호가 아닌 그림 이모지 ④ '번' ⑤ 공백 없이 붙은 숫자
# 이면 주문·취소가 아니다(언급 = 메시지 전체의 번호). 더 짧은 앞부분으로 물러나지 않는다. 두 자리의 첫 글자만 보고 그 뒤의 말은 보지 않는다.
suite: chat
settings: { parseMode: LOOSE, multiNumber: ALL, maxNumber: 999 }
cases:
  # D-033의 대표 사례 — 공백을 사이에 둬도 STRICT·붙여 쓴 LOOSE('15😭 놓쳤어요' → 언급)와 같다
  - { in: "15번 😭", out: { mentions: [15] } }              # 부분 '15번'(뒤가 공백) → 첫 글자 😭 U+1F62D: 주문 꼬리 아님 ③
  - { in: "15 ❌", out: { mentions: [15] } }                # 부분 '15' → ❌ U+274C ③
  - { in: "15 ❓ 남았나요", out: { mentions: [15] } }        # ❓ U+2753 ①
  - { in: "15 😭 놓쳤어요", out: { mentions: [15] } }        # ③
  - { in: "15번 ❌ 안 살게요", out: { mentions: [15] } }      # ③
  - { in: "15 ?", out: { mentions: [15] } }                 # ①
  - { in: "15 ？ 남았나요", out: { mentions: [15] } }        # ？ U+FF1F 전각 물음표 ① (정규화는 전각 숫자만 바꾼다)
  - { in: "15번 ㅠㅠ", out: { mentions: [15] } }             # ㅠ U+3160: 주문 꼬리가 아닌 자모 ②
  - { in: "15 ㄴㄴ", out: { mentions: [15] } }               # ㄴㄴ(아니요) ②
  - { in: "15 ㅇㅇ", out: { mentions: [15] } }               # ㅇㅇ(네)도 ② — 놓친 주문 쪽 비용. 콘솔 강조 후 클릭 한 번으로 찜 변환(ORD-12)
  - { in: "15 ​😭", out: { mentions: [15] } }          # 제로폭 공백 U+200B(Default_Ignorable)는 건너뛴다 → 😭 ③
  # 꼬리 기호로 끝난 부분 바로 뒤도 같다. 가장 긴 부분에만 보고 짧은 부분으로 물러나지 않는다
  - { in: "15!❓", out: { mentions: [15] } }                # 부분 '15!'(꼬리 기호로 끝남) → 바로 뒤 ❓ ①
  - { in: "15👍👎", out: { mentions: [15] } }               # 부분 '15👍' → 👎 U+1F44E(목록 밖) ③
  - { in: "15 ❤️ 😭", out: { mentions: [15] } }             # 가장 긴 부분 '15 ❤️' → 😭 ③. 뒤가 ❤인 '15'로 물러나지 않는다
  - { in: "15 28 ❓", out: { mentions: [15, 28] } }          # 부분 '15 28' → ❓ ① — 언급은 메시지 전체 번호
  - { in: "15~28", out: { mentions: [15, 28] } }            # 부분 '15~' → 공백 없이 붙은 숫자 '2' ⑤ (범위 표현)
  - { in: "15 번째 사진 예뻐요", out: { mentions: [15] } }    # '15 번'은 뒤가 '째'라 부분이 아니고, 부분 '15' 뒤 첫 글자가 '번' ④ ('15번째'와 같다)
  # (나) 가장 긴 부분 뒤 — 고른 부분이 더 짧아도 그 뒤 번호·꼬리말에 붙은 신호를 본다
  - { in: "15 28❓", out: { mentions: [15, 28] } }           # 고른 부분 '15'(뒤가 공백), 가장 긴 부분 '15 28'(뒤가 ❓) → ① (15로 물러나 주문하지 않는다)
  - { in: "15 28ㅠ", out: { mentions: [15, 28] } }           # 가장 긴 부분 '15 28' 뒤 ㅠ ②
  - { in: "15 찜❓", out: { mentions: [15] } }               # 고른 부분 '15', 가장 긴 부분 '15 찜'(꼬리말) 뒤 ❓ ①
  - { in: "1 2 3 4 5 6❓", out: { mentions: [1, 2, 3, 4, 5, 6] } }  # 고른 부분 '1 2 3 4 5'(5개), 가장 긴 부분 '1 2 3 4 5 6' 뒤 ❓ ① → 주문 아님
  # 그대로 주문 — 첫 글자가 끝 신호가 아니면 그 뒤는 보지 않는다(LOOSE 전제 "뒤에 무엇이 와도 주문")
  - { in: "15 ❤️ 예뻐요", out: { claims: [15] } }           # 부분 '15 ❤️' → '예'
  - { in: "15 ㅋㅋ 예뻐요", out: { claims: [15] } }          # ㅋ은 꼬리 기호라 부분 '15 ㅋㅋ'에 들어간다 → '예'
  - { in: "15 번 예뻐요", out: { claims: [15] } }            # '15 번'(숫자와 번 사이 공백 하나)이 부분 → '예'
  - { in: "15 🙋‍♀️ 저요", out: { claims: [15] } }    # 🙋+ZWJ+♀+FE0F 모두 꼬리 기호·수식 문자 → 부분에 들어간다 → '저'
  - { in: "15번 너무 예뻐요 ❓", out: { claims: [15] } }     # 부분 '15번' → '너'. 끝 신호는 바로 뒤 첫 글자만 본다
  - { in: "15 말고 16", out: { claims: [15] } }              # 말(글자)은 보지 않는다 — LOOSE의 오인 위험(R-3 LOOSE 머리말, 기본 꺼짐)
  # 취소 — 취소 꼬리 기준(ㅠ ㅜ 😢 😭 🥲는 끝 신호가 아니다)
  - { in: "15번 취소 😭 죄송해요", out: { cancels: [15] } }   # 😭는 취소 꼬리라 부분 '15번 취소 😭'에 들어간다 → '죄'
  - { in: "15번 취소 ❓", out: { mentions: [15] } }          # 취소 부분 '15번 취소' → ❓ ① → 취소 아님. '취소'가 들어 있어 주문도 아님
  - { in: "15 취소 번복할게요", out: { mentions: [15] } }     # 취소 부분 '15 취소' → '번' ④ (취소를 거두는 말)
  - { in: "15 취소 ㄴㄴ", out: { mentions: [15] } }          # ㄴ은 취소 꼬리가 아닌 자모 ②
---
# S01 분쟁 판정 — 끝 신호는 multiNumber 적용 전에 본다 (D-035): LOOSE·FIRST
suite: chat
settings: { parseMode: LOOSE, multiNumber: FIRST, maxNumber: 999 }
cases:
  - { in: "15 28 ❓", out: { mentions: [15, 28] } }          # 끝 신호 → 주문 아님(첫 번호만 주문으로 살리지 않는다)
  - { in: "15 28 예뻐요", out: { claims: [15] } }            # 끝 신호 아님 → FIRST라 첫 번호만
---
# Y1 — 발송함이 게시하는 감사 문구(한 건 R-13·묶음 D-Y07)는 기본 설정(STRICT)에서 주문도 취소도 아니다.
# 판매자 채널이 쓴 메시지라 기본(claim.ignoreOwner = 예)이면 어차피 무시하지만, 그 설정을 꺼도 STRICT에선 판매자 자신의 감사 문구가 주문이 되지 않는다.
# (LOOSE는 '17번 미니마 800원 …'처럼 쉼표 없는 가격이면 맨 앞 '17번'이 주문이 된다 — 그래서 수집기는 발송함이 게시한 메시지를 기록하지 않는다, D-Y04.)
# 언급 = 금액 덩어리(쉼표 천 단위 묶음)가 아닌 1~4자리 숫자 덩어리 중 1..999 (R-3 "언급"). '800원'의 800은 쉼표가 없어 금액 덩어리가 아니다.
suite: chat
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다", out: { mentions: [15] } }        # 10,000은 금액 덩어리 → 언급에서 빠진다
  - { in: "15번 8,000원 문자찜님 구매 감사합니다", out: { mentions: [15] } }               # 품종 없음(자리째 뺌), 문자찜
  - { in: "17번 미니마 800원 이영희님 구매 감사합니다", out: { mentions: [17, 800] } }      # 800 ≤ 999 → 언급
  - { in: "18번 방울복랑 금 15,000원 홍길동님 구매 감사합니다", out: { mentions: [18] } }   # 품종 안 공백
  - { in: "15번 핑크프릴 10,000원 홍길동님, 16번 라울 5,000원 김철수님 구매 감사합니다", out: { mentions: [15, 16] } }   # 묶음 문구
  - { in: "15번 핑크프릴 10,000원 홍길동님, 16번 8,000원 문자찜님, 17번 미니마 800원 시청자님 구매 감사합니다", out: { mentions: [15, 16, 17, 800] } }   # 묶음 + 빈 이름 대체 '시청자'(D-Y05)
---
# N2 — 인스타그램 라이브 댓글 모양 (PLT-01, R-3, D-006, D-036, D-N2-02). STRICT, 기본 설정. 새 규칙은 없다(지금 코어로 통과).
# 인스타그램 댓글에는 다른 계정을 부르는 `@이름`, 해시태그 `#`, 줄바꿈이 흔하다. 다른 사람(또는 가게 계정)을 부른 댓글은 그 사람에게 하는 말일 수 있어
# 주문으로 보지 않는다 — 번호는 언급으로 강조되고, 판매자가 한 번 눌러 찜으로 바꾼다(ORD-12). 줄을 바꾼 번호는 정규화(연속 공백 1칸)로 띄어 쓴 번호와 같다.
suite: chat
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "@pink.mom 15번", out: { mentions: [15] } }          # 다른 시청자를 부른 댓글 — 주문 아님
  - { in: "@shop_official 15", out: { mentions: [15] } }        # 가게 계정을 불러도 문법 밖 — 주문 아님(언급 강조 → 한 번 눌러 바꾸기)
  - { in: "15번 @pink.mom", out: { mentions: [15] } }          # 뒤에 부르기가 붙어도 문법 밖
  - { in: "@pink.mom 15 취소", out: { mentions: [15] } }       # 남을 부른 취소는 취소도 아니다(그 사람의 찜 취소로 오해하지 않게)
  - { in: "#15", out: { mentions: [15] } }                      # 해시태그 번호
  - { in: "15번 #다육이", out: { mentions: [15] } }             # 해시태그가 붙은 번호
  - { in: "15번\n28번", out: { claims: [15, 28] } }             # 줄을 바꾼 두 번호 = "15번 28번"
  - { in: "@pink.mom", out: {} }                                # 부르기만 — 번호 없음
---
# O0 — 다육 방식(STRICT, 기본) 회귀 고정 (CMT-07, R-3, R-20 머리말, D-O-02). 새 규칙은 없다(지금 코어로 통과).
# 업종 확장(옵션 방송)의 댓글 모양이 "번호로만 받기" 방송에서는 지금처럼 주문이 아니다 — 숫자는 언급으로 강조만 된다.
# 옵션 인식은 claim.parseMode=OPTIONS 방송에서만 켜진다(R-20, O1). 언급 = 금액 덩어리가 아닌 1~4자리 숫자 덩어리 중 1..999.
suite: chat
settings: { parseMode: STRICT, multiNumber: ALL, maxNumber: 999 }
cases:
  - { in: "초코 과자 3", out: { mentions: [3] } }        # 상품명 + 수량 모양 — 주문 아님
  - { in: "반바지 M", out: {} }                          # 숫자 없음
  - { in: "아이폰 17 프로", out: { mentions: [17] } }    # 기종 안의 17은 언급으로만
  - { in: "흰색 대형 2개", out: { mentions: [2] } }      # '2개'는 꼬리말이 아니다
  - { in: "11 2개", out: { mentions: [11, 2] } }         # 번호 뒤 '2개'가 붙으면 문법 밖 → 둘 다 언급
  - { in: "21 M", out: { mentions: [21] } }
  - { in: "15 2", out: { claims: [15, 2] } }             # 번호 둘 — 옵션 방송에서도 같은 뜻(R-20 2)
