# S01 보강 — multiNumber: FIRST
suite: chat
settings: { parseMode: STRICT, multiNumber: FIRST, maxNumber: 999 }
cases:
  - { in: "28 15", out: { claims: [28] } }                # 정렬이 아니라 처음 나온 번호
  - { in: "15 15 28", out: { claims: [15] } }             # 첫 번호 말고는 버린다(언급에도 넣지 않음)
  - { in: "15 취소", out: { cancels: [15] } }             # 취소에는 영향 없음
  - { in: "15번 18번 중에 뭐가 나아요?", out: { mentions: [15, 18] } }  # 주문이 아닌 메시지의 언급은 그대로
