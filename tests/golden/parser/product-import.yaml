# I2 — 상품 목록 가져오기 (PRD-05, DOMAIN_RULES R-18, D-I2-09). 붙여 넣은 표 글 → { header, rows } 또는 { error }
# 판단 기준: 애매한 줄은 등록하지 않고 그 줄의 문제로 알린다. 빠진 줄은 한 번 더 넣으면 되지만 틀린 번호·가격으로 등록된 상품은 판매 사고다.
# - 줄: \r\n·\n·\r로 나누고 1부터 센다(빈 줄 포함). 공백만 있는 줄은 건너뛴다. 맨 앞 BOM(U+FEFF) 하나는 지운다.
# - 칸: 탭이 있으면 탭, 없으면 쉼표. "로 시작하는 칸은 짝 "까지(안의 ""는 " 하나). 칸마다 R-3 정규화. 넷째 칸부터 빈 칸은 지우고, 셋이 아니면 CELLS.
# - 머리글: 건너뛰지 않은 첫 줄의 첫 칸에 숫자 0~9가 없으면 머리글(header = 그 줄 번호). 한 줄만.
# - 문제 순서: CELLS → NUMBER_INVALID → DUPLICATE(칸이 셋이고 번호가 읽힌 줄끼리) → EXISTS → NAME_PHONE → PRICE_MISSING → PRICE_INVALID → PRICE_TOO_LOW
# - 가격은 R-14(price.unit)로 읽는다: 천원 단위(기본)면 1000 미만 값은 ×1000, `원`이나 한글 단위가 있으면 단위 설정 무시. 100원 미만은 PRICE_TOO_LOW(R-16과 같다).
# - TOO_MANY(상품 줄 500 초과)는 입력이 너무 길어 이 파일에 적지 않는다 — 서버 단위 시험이 500줄(통과)·501줄(TOO_MANY)을 본다(AC-I2-50).
suite: product-import
settings: { unit: THOUSAND }
cases:
  # 엑셀에서 머리글째 복사(탭). 16번 `8` = 8 × 1000 = 8,000원(천원 단위). `1만5천` = 1×10000 + 5×1000 = 15,000원
  - in: "번호\t품종\t가격\n15\t핑크프릴\t10000\n16\t라울\t8\n17\t방울복랑 금\t1만5천"
    out:
      header: 1
      rows:
        - { line: 2, no: 15, name: 핑크프릴, price: 10000 }
        - { line: 3, no: 16, name: 라울, price: 8000 }
        - { line: 4, no: 17, name: "방울복랑 금", price: 15000 }
  # CSV(쉼표), 머리글 없음(첫 칸 `15`에 숫자). 따옴표로 감싼 "8,000원"은 한 칸 → 8,000원(원 → 단위 무시).
  # 따옴표 없는 `8,000원`은 쉼표로 갈려 칸이 넷(17 · 블루엘프 · 8 · 000원) → CELLS (8원·8,000원 중 무엇인지 모른다)
  - in: "15,핑크프릴,10000\n16,라울,\"8,000원\"\n17,블루엘프,8,000원"
    out:
      rows:
        - { line: 1, no: 15, name: 핑크프릴, price: 10000 }
        - { line: 2, no: 16, name: 라울, price: 8000 }
        - { line: 3, error: CELLS }
  # 번호 `015번` = 15(선행 0·`번` 허용, R-16 3), `7 번` = 7(띄어 쓴 `번`). 빈 품종은 등록된다(품종 미입력). 품종 안 연속 공백은 한 칸
  - in: "015번\t\t10\n7 번\t핑크  프릴\t5천"
    out:
      rows:
        - { line: 1, no: 15, name: "", price: 10000 }
        - { line: 2, no: 7, name: "핑크 프릴", price: 5000 }
  # 윈도우 줄바꿈(\r\n), 빈 줄·공백만 있는 줄은 건너뛰되 줄 번호는 센다. 엑셀에서 넓게 복사해 생긴 넷째 칸부터의 빈 칸은 지운다
  # 줄: 1 머리글 · 2 빈 줄 · 3 15번 · 4 공백만 · 5 16번 · 6 (마지막 \r\n 뒤) 빈 줄
  - in: "번호\t품종\t가격\t\t\r\n\r\n15\t핑크프릴\t10000\t\t\r\n   \r\n16\t라울\t8000\r\n"
    out:
      header: 1
      rows:
        - { line: 3, no: 15, name: 핑크프릴, price: 10000 }
        - { line: 5, no: 16, name: 라울, price: 8000 }
  # 전각 숫자는 반각으로(R-3). 첫 칸 `１５번` → `15번`이라 머리글이 아니다. `1만 5천` = 15,000원(단위 묶음 사이 공백 허용, R-14 4)
  - in: "１５번\t핑크프릴\t1만 5천"
    out:
      rows:
        - { line: 1, no: 15, name: 핑크프릴, price: 15000 }
  # 천원 단위에서 `8.5` = 8.5 × 1000 = 8,500원 (R-14 3)
  - in: "18\t로라\t8.5"
    out:
      rows:
        - { line: 1, no: 18, name: 로라, price: 8500 }
  # 맨 앞 BOM(U+FEFF)은 지운다 — 엑셀 "CSV UTF-8" 파일. 지우지 않으면 첫 칸이 `﻿20`이 되어 번호가 읽히지 않는다
  - in: "﻿번호,품종,가격\n3,로라,4000"
    out:
      header: 1
      rows:
        - { line: 2, no: 3, name: 로라, price: 4000 }
  - in: "﻿20,자보,3000"
    out:
      rows:
        - { line: 1, no: 20, name: 자보, price: 3000 }
---
# 줄마다의 문제 하나씩 (R-18 2·4·6·7·8·9). 그 방송에 3번·30번이 이미 있다(existing). 번호 범위는 기본 1~999.
suite: product-import
settings: { unit: THOUSAND, maxNumber: 999, existing: [3, 30] }
cases:
  # 줄  2: 등록                              줄 12: `50원` = 50원(원 → 단위 무시) < 100 → PRICE_TOO_LOW
  # 줄  3: 3번은 이미 있다 → EXISTS           줄 13: 칸 둘(가격인지 품종인지 모른다) → CELLS
  # 줄  4: 1000 > 999 → NUMBER_INVALID       줄 14: 품종 안 쉼표로 칸 넷 → CELLS
  # 줄  5: 0 → NUMBER_INVALID                줄 15: 따옴표로 감싼 품종 "방울복랑, 금" → 등록
  # 줄  6: 15.5 → NUMBER_INVALID             줄 16: 닫히지 않은 따옴표 → CELLS
  # 줄  7: 십오(숫자가 아님) → NUMBER_INVALID — 첫 줄이 아니라 머리글로 보지 않는다
  # 줄  8: 품종에 휴대폰 번호(R-1 글 칸 판단) → NAME_PHONE
  # 줄  9: 셋째 칸이 비었다 → PRICE_MISSING   줄 17: `1만5` 단위 뒤 단위 없는 숫자(D-029) → PRICE_INVALID
  # 줄 10: `공짜` → PRICE_INVALID             줄 18: 번호 칸이 비었다 → NUMBER_INVALID
  # 줄 11: `0` = 0 × 1000 = 0원 → PRICE_TOO_LOW  줄 19: `10 000` 숫자 사이 공백(R-14 3) → PRICE_INVALID
  # 줄 20: 30번은 이미 있다 → EXISTS          줄 21: `1234-5678`(010을 뺀 8자리)은 휴대폰 번호가 아니다(R-1) → 등록
  # 줄 22: `00015` 숫자 다섯 자리 → NUMBER_INVALID
  # 번호가 읽힌 줄의 번호(1·3·20·21·22·23·24·27·29·31·30·32)는 서로 겹치지 않아 DUPLICATE는 없다(13·14·16번 줄은 칸 문제라 세지 않는다)
  - in: |-
      번호,품종,가격
      1,핑크프릴,10000
      3,라울,5000
      1000,블루엘프,8000
      0,레티지아,7000
      15.5,황금사,6000
      십오,자보,3000
      20,김영희 010-1234-5678,9000
      21,로라,
      22,로라,공짜
      23,로라,0
      24,로라,50원
      25,로라
      26,방울복랑, 금,15000
      27,"방울복랑, 금",15000
      28,"안 닫힌 따옴표,15000
      29,핑크,1만5
      ,핑크,10000
      31,핑크,10 000
      30,핑크,10000
      32,1234-5678 금,10000
      00015,핑크,10000
    out:
      header: 1
      rows:
        - { line: 2, no: 1, name: 핑크프릴, price: 10000 }
        - { line: 3, error: EXISTS }
        - { line: 4, error: NUMBER_INVALID }
        - { line: 5, error: NUMBER_INVALID }
        - { line: 6, error: NUMBER_INVALID }
        - { line: 7, error: NUMBER_INVALID }
        - { line: 8, error: NAME_PHONE }
        - { line: 9, error: PRICE_MISSING }
        - { line: 10, error: PRICE_INVALID }
        - { line: 11, error: PRICE_TOO_LOW }
        - { line: 12, error: PRICE_TOO_LOW }
        - { line: 13, error: CELLS }
        - { line: 14, error: CELLS }
        - { line: 15, no: 27, name: "방울복랑, 금", price: 15000 }
        - { line: 16, error: CELLS }
        - { line: 17, error: PRICE_INVALID }
        - { line: 18, error: NUMBER_INVALID }
        - { line: 19, error: PRICE_INVALID }
        - { line: 20, error: EXISTS }
        - { line: 21, no: 32, name: "1234-5678 금", price: 10000 }
        - { line: 22, error: NUMBER_INVALID }
---
# 같은 번호 (R-18 5): 어느 줄이 맞는지 모르니 그 번호의 줄 모두 DUPLICATE. 5번은 이미 있지만 같은 번호가 먼저다(DUPLICATE → EXISTS).
# 가격이 틀린 줄(6)도 번호가 읽혔으면 센다 — 7번 줄만 등록하면 판매자가 고치려던 6번 줄 대신 엉뚱한 값이 남을 수 있다.
# `015`와 `15번`은 같은 15번(8·9). 번호가 읽히지 않은 줄(10·11 — 1000 > 999)과 칸 문제 줄(12)은 세지 않으니 13번 줄은 등록된다.
suite: product-import
settings: { unit: THOUSAND, existing: [5] }
cases:
  - in: "10\t핑크프릴\t10000\n11\t라울\t5000\n10\t블루엘프\t8000\n5\t레티지아\t7000\n5\t황금사\t6000\n12\t로라\t공짜\n12\t자보\t3000\n015\t핑크\t1000\n15번\t핑크\t1000\n1000\ta\t1000\n1000\tb\t1000\n13\t로라\n13\t로라\t3000"
    out:
      rows:
        - { line: 1, error: DUPLICATE }
        - { line: 2, no: 11, name: 라울, price: 5000 }
        - { line: 3, error: DUPLICATE }
        - { line: 4, error: DUPLICATE }
        - { line: 5, error: DUPLICATE }
        - { line: 6, error: DUPLICATE }
        - { line: 7, error: DUPLICATE }
        - { line: 8, error: DUPLICATE }
        - { line: 9, error: DUPLICATE }
        - { line: 10, error: NUMBER_INVALID }
        - { line: 11, error: NUMBER_INVALID }
        - { line: 12, error: CELLS }
        - { line: 13, no: 13, name: 로라, price: 3000 }
---
# 원 단위(WON)·번호 범위 1~50. 줄마다 탭 여부로 나누는 글자를 따로 정한다(7은 쉼표 → 칸 넷, 8은 탭 → `1,000` 한 칸).
#   줄 1 `품종 목록`(칸 하나, 숫자 없음) → 머리글 · 2 50 ≤ 50 → 등록 · 3 51 > 50 → NUMBER_INVALID
#   줄 4 `10`(원 단위) = 10원 → PRICE_TOO_LOW · 5 `8.5`(원 단위 소수, R-14 6) → PRICE_INVALID · 6 `5천` = 5,000원(한글 단위 → 단위 설정 무시)
#   줄 7 쉼표 줄 `4,로라,1,000` → 칸 넷 → CELLS · 8 탭 줄 `1,000` = 1,000원 · 9 `100` = 100원(하한 정각) → 등록 · 10 `99` → PRICE_TOO_LOW
suite: product-import
settings: { unit: WON, maxNumber: 50 }
cases:
  - in: "품종 목록\n50,핑크프릴,10000\n51,라울,10000\n1,블루엘프,10\n2,황금사,8.5\n3,자보,5천\n4,로라,1,000\n5\t로라\t1,000\n6\t레티지아\t100\n7\t레티지아\t99"
    out:
      header: 1
      rows:
        - { line: 2, no: 50, name: 핑크프릴, price: 10000 }
        - { line: 3, error: NUMBER_INVALID }
        - { line: 4, error: PRICE_TOO_LOW }
        - { line: 5, error: PRICE_INVALID }
        - { line: 6, no: 3, name: 자보, price: 5000 }
        - { line: 7, error: CELLS }
        - { line: 8, no: 5, name: 로라, price: 1000 }
        - { line: 9, no: 6, name: 레티지아, price: 100 }
        - { line: 10, error: PRICE_TOO_LOW }
---
# 머리글 판단과 빈 목록 (R-18 3·10). 머리글은 건너뛰지 않은 첫 줄 하나만, 첫 칸에 숫자가 없을 때만 본다.
suite: product-import
settings: { unit: THOUSAND }
cases:
  # 첫 칸 `상품번호1`에 숫자가 있어 머리글이 아니다 → 상품 줄로 보고 NUMBER_INVALID(조용히 빼지 않는다 — 판매자가 미리 보기에서 본다)
  - in: "상품번호1\t품종\t가격\n15\t핑크\t10000"
    out:
      rows:
        - { line: 1, error: NUMBER_INVALID }
        - { line: 2, no: 15, name: 핑크, price: 10000 }
  # 앞의 빈 줄은 건너뛰므로 3번 줄이 "건너뛰지 않은 첫 줄"
  - in: "\n\n번호,품종,가격\n15,핑크,10000"
    out:
      header: 3
      rows:
        - { line: 4, no: 15, name: 핑크, price: 10000 }
  # 머리글은 한 줄만 — 두 번째 머리글 줄은 상품 줄(NUMBER_INVALID)
  - in: "번호,품종,가격\n번호,품종,가격\n15,핑크,10000"
    out:
      header: 1
      rows:
        - { line: 2, error: NUMBER_INVALID }
        - { line: 3, no: 15, name: 핑크, price: 10000 }
  # 열 순서를 바꿔 적은 목록(품종, 번호, 가격): 첫 줄은 첫 칸에 숫자가 없어 머리글로 보이고, 나머지는 NUMBER_INVALID — 등록되는 줄이 없다
  - in: "핑크프릴,15,10000\n라울,16,5000"
    out:
      header: 1
      rows:
        - { line: 2, error: NUMBER_INVALID }
  # 첫 줄이 따옴표 문제로 칸을 나눌 수 없으면 머리글이 아니다 — 상품 줄 CELLS (조용히 빼지 않는다)
  - in: "\"번호,품종,가격\n15,핑크,10000"
    out:
      rows:
        - { line: 1, error: CELLS }
        - { line: 2, no: 15, name: 핑크, price: 10000 }
  - { in: "", out: { error: EMPTY } }
  - { in: "번호\t품종\t가격\n\n", out: { error: EMPTY } }   # 머리글뿐
  - { in: "  \n\t\n", out: { error: EMPTY } }              # 공백·탭만 있는 줄은 건너뛴다
  - { in: "상품 목록", out: { error: EMPTY } }              # 머리글(칸 하나)뿐
---
# 큰따옴표 (R-18 2). 엑셀은 쉼표·탭·따옴표가 든 칸을 따옴표로 감싸 내보낸다.
#   줄 1 모든 칸을 감쌈 → 등록(첫 칸 글 `15`에 숫자가 있어 머리글 아님)
#   줄 2 `"핑크 ""특"""` → 핑크 "특" (안의 "" = " 하나)
#   줄 3 칸 중간의 " 는 그냥 글자 → 핑크"프릴
#   줄 4 닫는 " 뒤에 `프릴`이 붙음 → CELLS
#   줄 5 탭 줄의 따옴표 칸 안 탭은 글자 → 정규화로 공백 한 칸 → 핑크 A
#   줄 6 칸 앞에 공백이 있으면 따옴표가 아니다 → 첫 칸 `"20"` → NUMBER_INVALID
#   줄 7 `""` = 빈 품종 → 등록 · 줄 8 가격 칸 `""` = 빈 칸 → PRICE_MISSING
suite: product-import
settings: { unit: THOUSAND }
cases:
  - in: "\"15\",\"핑크프릴\",\"10000\"\n16,\"핑크 \"\"특\"\"\",10000\n17,핑크\"프릴,10000\n18,\"핑크\"프릴,10000\n19\t\"핑크\tA\"\t10000\n\x20\"20\",핑크,10000\n21,\"\",10000\n22,핑크,\"\""
    out:
      rows:
        - { line: 1, no: 15, name: 핑크프릴, price: 10000 }
        - { line: 2, no: 16, name: "핑크 \"특\"", price: 10000 }
        - { line: 3, no: 17, name: "핑크\"프릴", price: 10000 }
        - { line: 4, error: CELLS }
        - { line: 5, no: 19, name: "핑크 A", price: 10000 }
        - { line: 6, error: NUMBER_INVALID }
        - { line: 7, no: 21, name: "", price: 10000 }
        - { line: 8, error: PRICE_MISSING }
---
# I2 마지막 감사 TD-I2-003 (D-I2-21): 칸을 나눌 수 있고 정규화한 칸이 모두 빈 줄은 건너뛴다(R-18 1) — 엑셀 빈 행을 CSV로 저장한 `,,` 줄이
# .xlsx의 빈 행과 같은 결과가 되게. 건너뛴 줄은 머리글 판단·500줄에 세지 않고, 줄 번호는 센다. 이 문서는 새 사례만 더한다(기존 사례 그대로).
suite: product-import
settings: { unit: THOUSAND }
cases:
  # 줄 1 머리글 · 2 등록 · 3 `,,`(빈 칸 셋) 건너뜀 · 4 `"",,`(따옴표로 감싼 빈 칸 + 빈 칸 둘) 건너뜀
  # 줄 5 `8` = 8 × 1000 = 8,000원 · 6 ` , , `(공백 칸 셋 → 정규화하면 빈 칸) 건너뜀 · 7 `,,,`(빈 칸 넷) 건너뜀 · 8 마지막 \r\n 뒤 빈 줄
  - in: "번호,품종,가격\r\n15,핑크프릴,10000\r\n,,\r\n\"\",,\r\n16,라울,8\r\n , , \r\n,,,\r\n"
    out:
      header: 1
      rows:
        - { line: 2, no: 15, name: 핑크프릴, price: 10000 }
        - { line: 5, no: 16, name: 라울, price: 8000 }
  # 탭 줄: 줄 1 `\t\t`(빈 칸 셋) 건너뜀 → "건너뛰지 않은 첫 줄"은 줄 2 → 첫 칸 `번호`에 숫자가 없어 머리글(header 2)
  # 줄 3 `\t\t\t` 건너뜀 · 줄 4 `5천` = 5,000원
  - in: "\t\t\n번호\t품종\t가격\n\t\t\t\n17\t블루엘프\t5천"
    out:
      header: 2
      rows:
        - { line: 4, no: 17, name: 블루엘프, price: 5000 }
  # 빈 행만 있는 CSV(`,,` · `,,,` · `"","",""`) → 상품 줄 없음 → EMPTY
  - { in: ",,\n,,,\n\"\",\"\",\"\"", out: { error: EMPTY } }
  # 닫히지 않은 따옴표로 시작하는 줄은 칸을 나눌 수 없어 빈 줄이 아니다 → CELLS (머리글도 아니다, R-18 3)
  - in: "\",,\n15,핑크,10000"
    out:
      rows:
        - { line: 1, error: CELLS }
        - { line: 2, no: 15, name: 핑크, price: 10000 }
---
# I2 마지막 감사 SA-I2-010·TD-I2-009 (D-I2-17): 정규화한 품종에 제어 글자(U+0000~U+001F·U+007F~U+009F)가 남으면 NAME_CONTROL — 지우지 않고 등록하지 않는다.
# 순서: 품종 칸에서 제어 글자 → 휴대폰 번호(NAME_PHONE), 가격보다 먼저(R-18 9). 첫 줄 첫 칸 `15`에 숫자가 있어 머리글은 없다. 번호 15~22는 겹치지 않는다.
#   줄 1 U+0001 → NAME_CONTROL           줄 5 U+000B(세로 탭)는 R-3 공백 → 한 칸 공백 → `핑크 프릴` 등록
#   줄 2 U+007F(DEL) → NAME_CONTROL      줄 6 U+200B(폭 없는 공백)는 제어 글자가 아니다(서식 글자) → 그대로 등록 — 규칙은 제어 글자 범위만 본다(D-036)
#   줄 3 맨 앞 U+001B — 공백이 아니라 앞뒤 자르기로 지워지지 않는다 → NAME_CONTROL
#   줄 4 U+0085(NEL)는 R-3 공백(JavaScript `\s`)이 아니고 줄 나눔도 아니다 → 남아서 NAME_CONTROL
#   줄 7 제어 글자 + 휴대폰 번호 → 제어 글자가 먼저 → NAME_CONTROL
#   줄 8 제어 글자 + 가격 `공짜` → 품종이 가격보다 먼저 → NAME_CONTROL
suite: product-import
settings: { unit: THOUSAND }
cases:
  - in: "15,핑크\x01프릴,10000\n16,라울\x7F,8000\n17,\x1B블루엘프,8000\n18,로라\u0085,8000\n19,핑크\x0B프릴,10000\n20,​자보,3000\n21,김\x01 010-1234-5678,9000\n22,레티\x02지아,공짜"
    out:
      rows:
        - { line: 1, error: NAME_CONTROL }
        - { line: 2, error: NAME_CONTROL }
        - { line: 3, error: NAME_CONTROL }
        - { line: 4, error: NAME_CONTROL }
        - { line: 5, no: 19, name: "핑크 프릴", price: 10000 }
        - { line: 6, no: 20, name: "​자보", price: 3000 }
        - { line: 7, error: NAME_CONTROL }
        - { line: 8, error: NAME_CONTROL }
---
# FB1 사용자 결정 — 만원 단위 가져오기 (R-18 8 → R-14 3, D-FB1-11). 첫 칸 `15`에 숫자 → 머리글 없음.
#   줄 1 `15` = 15 × 10000 = 150,000 · 줄 2 `15000` = 1000 이상 → 15,000 · 줄 3 `2만` = 20,000(한글 단위 → 설정 무시)
#   줄 4 `1.5` = 15,000 · 줄 5 `0.001` = 0.001 × 10000 = 10원 < 100 → PRICE_TOO_LOW · 줄 6 `1.23456` = 12345.6원 → PRICE_INVALID
suite: product-import
settings: { unit: TEN_THOUSAND }
cases:
  - in: "15\t엘레강스\t15\n16\t라울\t15000\n17\t블루엘프\t2만\n18\t로라\t1.5\n19\t자보\t0.001\n20\t레티\t1.23456"
    out:
      rows:
        - { line: 1, no: 15, name: 엘레강스, price: 150000 }
        - { line: 2, no: 16, name: 라울, price: 15000 }
        - { line: 3, no: 17, name: 블루엘프, price: 20000 }
        - { line: 4, no: 18, name: 로라, price: 15000 }
        - { line: 5, error: PRICE_TOO_LOW }
        - { line: 6, error: PRICE_INVALID }
