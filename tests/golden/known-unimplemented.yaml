# I1 (라벨·출력 화면 통합 — dev-core 없음): 새 골든 G-ENG-301~304(21-i1-labels.yaml — 라벨 키 = (찜, 확정버전), 출력 보고 잠금, 품종·가격 변경은 효과 없음,
