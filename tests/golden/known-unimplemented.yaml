# 알려진 미구현 허용 목록 (D-020) — spec-keeper만 수정한다. 골든 러너가 읽는 예약 파일이며 골든 시나리오가 아니다.
#
# - 여기 적힌 항목은 결과가 "미구현"일 때만 실패로 세지 않는다("미구현(허용)"으로 따로 센다).
# - 값 불일치·읽기 오류·결정성 위반·러너 오류는 이 목록과 상관없이 항상 실패다.
# - 이 목록을 넓히는 환경변수·명령행 옵션은 없다. 이 파일이 없으면 빈 목록으로 본다(모든 미구현이 실패).
# - 스프린트가 항목을 구현하면 spec-keeper가 그 스프린트 시작 때 지운다. 이미 통과하던 항목을 다시 넣으려면 DECISIONS 근거가 필요하다.
# - 미래 스프린트용으로 새로 추가한 골든은 넣을 수 있다.
#
# suites: 파서 suite 이름 (chat / amount / korean-number / quick-input / voice-extract / product-import) — 그 suite의 모든 문서·사례
# scenarios: 엔진 시나리오 ID. '*'는 0글자 이상과 맞는다. 어떤 시나리오와도 맞지 않는 항목은 읽기 오류.
#
# S02 (D-037): 판정 엔진 범위의 시나리오(01·02·03 전부, G-ENG-050·051·061·062·070, S02 보강 전부)는 모두 뺐다.
# S03: 남아 있던 20개(문자찜 G-ENG-030·054·055·060, 실제 시각순 G-ENG-031~036·063·071·072, 메시지 변환 G-ENG-037,
#      상품 수정 G-ENG-040~042, 정산 G-ENG-052·053·073)와 S03 보강(G-ENG-100~102·110~121·130~133·140~145)은 모두 S03 범위라 뺐다.
#      이제 허용 목록은 비어 있다 — 모든 골든이 통과해야 한다. 정산 직접 묶기(MANUAL, D-059)는 골든이 없다.
# S03b: 새 골든 G-ENG-150~159(14-core-cleanup.yaml — 전화번호 키·문자찜 재전송·메시지 변환·시청자 취소·충돌 중 배정·확정버전 순서·
#       충돌이 풀릴 때 대기 넘침, D-061~D-068)는 모두 S03b 범위라 넣지 않았다. 허용 목록은 계속 비어 있다.
# S04: 새 골든 G-ENG-160~162(15-broadcast.yaml — 방송 시작·종료, 방송마다의 설정 스냅샷, D-069·D-070)와 G-ENG-163~165(16-s04-rules.yaml —
#      취소 메시지 변환 금지·대기 한도 0의 승계 묻기, D-076·D-077)는 모두 S04 범위라 넣지 않았다. 허용 목록은 계속 비어 있다 —
#      남기면 미구현이 통과로 숨는다. broadcast.start·broadcast.end는 S04부터 미구현(NotImplementedError)이 아니다.
