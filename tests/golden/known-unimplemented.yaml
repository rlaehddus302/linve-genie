# 알려진 미구현 허용 목록 (D-020) — spec-keeper만 수정한다. 골든 러너가 읽는 예약 파일이며 골든 시나리오가 아니다.
#
# - 여기 적힌 항목은 결과가 "미구현"일 때만 실패로 세지 않는다("미구현(허용)"으로 따로 센다).
# - 값 불일치·읽기 오류·결정성 위반·러너 오류는 이 목록과 상관없이 항상 실패다.
# - 이 목록을 넓히는 환경변수·명령행 옵션은 없다. 이 파일이 없으면 빈 목록으로 본다(모든 미구현이 실패).
# - 스프린트가 항목을 구현하면 spec-keeper가 그 스프린트 시작 때 지운다. 이미 통과하던 항목을 다시 넣으려면 DECISIONS 근거가 필요하다.
# - 미래 스프린트용으로 새로 추가한 골든은 넣을 수 있다.
#
# suites: 파서 suite 이름 (chat / amount / korean-number / quick-input) — 그 suite의 모든 문서·사례
# scenarios: 엔진 시나리오 ID. '*'는 0글자 이상과 맞는다. 어떤 시나리오와도 맞지 않는 항목은 읽기 오류.
#
# S02 (D-037): 판정 엔진 범위의 시나리오(01·02·03 전부, G-ENG-050·051·061·062·070, S02 보강 전부)는 모두 뺐다.
# 남은 20개는 S03 몫이다. 와일드카드를 쓰지 않는다 — 같은 범위에 새 ID가 생기면 미구현이 조용히 숨기 때문이다.
# S02 엔진은 이 시나리오들에서 S03 이벤트·설정을 만나는 지점에 "미구현"을 알려야 하고, 그 앞에서 틀린 값(불일치)을 내면 실패다.
