#      G-ENG-201·202(engine/19-p2-documents.yaml — 확인서·판매대장 재료, D-206·D-208)는 새 엔진 규칙이 없어 지금 코어로 통과한다. 넣지 않았다.
#      허용 목록은 계속 비어 있다 — 남기면 미구현이 통과로 숨는다. (P2는 dev-core가 없다. 러너 연결은 dev-device가 최소로 한다 — D-209.)
