# P2 보강 — 구매 내역 확인서·엑셀 판매대장이 기대는 정산 결과 (STL-04·STL-06, D-206·D-208). 새 판정 규칙 없음.
# 문서 패키지(packages/documents)의 시험은 이 시나리오의 이벤트를 그대로 엔진에 넣고, 문서에 적힌 금액이 아래 expect와 같은지 본다
# ("명세서 PDF·엑셀 대장이 골든 정산 결과와 일치" — SPEC §8 2단계 완료 기준). 문서는 금액을 다시 계산하지 않는다.
# ID는 병렬 트랙과 겹치지 않게 P2 트랙 범위 G-ENG-201부터 쓴다(D-201).
id: G-ENG-201
title: 확인서 재료 — 같은 날 두 방송·닉네임 변경·확정 뒤 가격 변경(찜 시점 가격)·할인·부분 입금·직접 수령 문자찜
refs: [STL-04, STL-01, STL-02, STL-03, STL-07, R-10, R-11, R-12, D-206]
broadcasts:
  - { id: b1, date: 2026-10-18, title: 1부 }
  - { id: b2, date: 2026-10-18, title: 2부 }
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:01:00", type: product.register, b: b1, no: 28, name: 라울, price: 5000 }
  - { at: "20:01:03", type: chat, b: b1, id: m2, ch: UC_A, nick: 홍길동, text: "28" }
  - { at: "20:02:00", type: product.register, b: b1, no: 31, name: "방울복랑 금", price: 15000 }
  - { at: "20:02:10", type: sms, b: b1, ref: s1, no: 31, received: "20:02", memo: 김영희, phone: "010-1234-5678" }
  - { at: "22:00:00", type: product.register, b: b2, no: 7, name: 블루엘프, price: 8000 }
  - { at: "22:00:04", type: chat, b: b2, id: m3, ch: UC_A, nick: 길동이, text: "7" }
  # 확정 뒤 가격을 9,000원으로 고친다(기본 NEW_ONLY) — 확정 찜은 8,000원 그대로(R-10, D-013). 확인서의 그 줄은 8,000원이다.
  - { at: "22:00:30", type: product.update, b: b2, no: 7, price: 9000 }
  - { at: "22:10:00", type: settlement.adjust, buyer: UC_A, date: 2026-10-18, amount: -2000, reason: 단골 할인 }
  - { at: "22:11:00", type: settlement.shippingOverride, buyer: "sms:s1", date: 2026-10-18, mode: PICKUP }
  - { at: "22:12:00", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 10000 }
expect:
  products:
    b2/7: { status: SOLD, winner: UC_A, price: 9000, priceHistory: [{ from: 8000, to: 9000 }] }
  buyers:
    # 상품 합계 = 10,000 + 5,000 + 8,000(찜 시점 가격) = 23,000. 표시 이름은 가장 최근 닉네임.
    UC_A: { display: 길동이, nameHistory: [홍길동, 길동이], items: [b1/15, b1/28, b2/7], subtotal: 23000, byBroadcast: { b1: 15000, b2: 8000 }, phoneLast4: null }
    "sms:s1": { display: "문자찜(김영희)", items: [b1/31], subtotal: 15000, phoneLast4: "5678" }
  settlements:
    # 23,000 + 배송비 4,000(기본) + 조정 −2,000 = 25,000. 받은 금액 10,000 < 25,000 → 부분 입금. (확인서의 '남은 금액' = 25,000 − 10,000 = 15,000, D-206)
    UC_A@2026-10-18: { subtotal: 23000, shipping: 4000, adjustments: -2000, total: 25000, payment: PARTIAL, refundDue: 0 }
    # 15,000 + 배송비 0(직접 수령) + 조정 0 = 15,000. 입금 없음 → 미입금.
    "sms:s1@2026-10-18": { subtotal: 15000, shipping: 0, adjustments: 0, total: 15000, payment: UNPAID, refundDue: 0 }
