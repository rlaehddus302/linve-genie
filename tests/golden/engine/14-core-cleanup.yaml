id: G-ENG-155
title: 충돌 중인 상품에는 직접 배정(교체 포함)이 아무 일도 없다 — 방송자가 충돌부터 정하고, 정한 뒤에는 교체 배정이 된다
refs: [ORD-10, ORD-12, R-7, R-9, D-042, D-053, D-064]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }               # A 확정(1), t 10 (찜 1)
  - { at: "20:00:11", type: host.confirm, b: b1, no: 15, buyer: UC_A }                               # A 잠금
  - { at: "20:00:12", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "안녕하세요" }        # B 기록
  - { at: "20:00:20", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }                     # t 05 < A, 잠금 후 → 충돌 (찜 2)
  # 충돌 중 → 교체 배정도, 교체 없는 배정(빈 자리도 없다)도 아무 일도 없다. (받으면 1등이 B로 바뀐 채 충돌이 남아 화면의 질문이 낡는다)
  - { at: "20:00:30", type: host.assign, b: b1, no: 15, buyer: UC_B, reason: 전화 주문, replace: UC_A, replaceTo: WAITLIST }
  - { at: "20:00:31", type: host.assign, b: b1, no: 15, buyer: UC_B, reason: 전화 주문 }
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [], conflict: true } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFLICT }], claimCount: 2 } }
  # 바꾸기: s1 확정(2), A 확정이 풀려(미실행 효과 취소) 대기 1순위 [A]
  - { at: "20:00:40", type: host.resolveConflict, b: b1, no: 15, decision: SWITCH }
  # 충돌이 없으니 교체 배정이 된다: B 새 배정 찜 확정(3), s1 취소. 대기 [A] 그대로 (찜 3)
  - { at: "20:00:50", type: host.assign, b: b1, no: 15, buyer: UC_B, reason: 전화 주문, replace: "sms:s1", replaceTo: CANCEL }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_A], conflict: false }
  claims:
    - { product: b1/15, buyer: "sms:s1", status: CANCELLED }
    - { product: b1/15, buyer: UC_A, status: WAITLISTED }
    - { product: b1/15, buyer: UC_B, status: CONFIRMED }
  claimCount: 3
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다", confirmVersion: 3 }
  effectCounts: { POST_THANKS: 3, PRINT_PRODUCT_LABEL: 3, VOID_LABEL: 0 }    # A(1)·s1(2)·B(3), 출력 보고 없음 → 폐기 없음
  pendingEffects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, confirmVersion: 3 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_B, confirmVersion: 3 }
