id: G-ENG-159
title: 승계=묻기에서 충돌이 자리가 비어 풀리면 빈 자리는 방송자 결정으로 남고, 대기 한도는 그대로 지킨다(맨 끝 품절)
refs: [ORD-07, ORD-10, R-4, R-7, R-8, D-041, D-068]
settings: { cancel.succession: ASK, waitlist.max: 1 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }   # seq 1
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번이용ㅎ" }  # seq 2. 주문 아님(언급)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }         # seq 3. B 확정(1) (찜 1)
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }         # seq 4. 대기 [C] — 한도 1, 꽉 참 (찜 2)
  - { at: "20:00:20", type: host.convertMessage, b: b1, msg: m1, no: 15 }                    # A(2) < B(3) → 충돌 (찜 3)
  # B 취소 → 충돌이 먼저 풀림: A(2)를 대기 자리에 → C(4)보다 앞 → [A, C] → 승계 ASK: 대기가 있으니 "승계 결정 필요"(확정 없음)
  # → 넘침 정리: 2 > 1 → 맨 끝 C 품절 → [A]
  - { at: "20:00:30", type: host.cancel, b: b1, no: 15, buyer: UC_B, reason: 구매자 요청 }
  - { type: assert, expect: { products: { b1/15: { status: OPEN, winner: null, waitlist: [UC_A], conflict: false } }, claims: [{ product: b1/15, buyer: UC_C, status: REJECTED, reason: SOLD_OUT }] } }
  - { at: "20:00:40", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "15" }         # 승계 결정 필요 → 5번 줄: 대기 1 = 한도 → 품절 (찜 4)
  - { at: "20:00:50", type: host.promote, b: b1, no: 15, buyer: UC_A, reason: 순서대로 }      # A 확정(2) → 대기 비어 표시 사라짐
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_B, status: CANCELLED }
    - { product: b1/15, buyer: UC_C, status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: UC_D, status: REJECTED, reason: SOLD_OUT }
  claimCount: 4
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }    # B(1)·A(2)
  pendingEffects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A, confirmVersion: 2 }
