# S03b 보강 — 코어 정리: 전화번호 키, 문자찜 재전송, 메시지 변환·시청자 취소·충돌 중 배정, 확정버전 순서, 충돌이 풀릴 때 대기 넘침
# (DAT-06, BUY-02, ORD-10, ORD-12, R-1, R-7, R-8, R-9, R-10, R-11, R-13, INV-3, INV-12, D-061~D-068). 기대값 계산은 각 줄 주석.
# 기본 설정: 접수순(ARRIVAL), 대기 한도 5, 자동 승계, 시청자 취소 REQUEST, 확정마다 라벨 1 + 감사 1.
# 문자찜의 phone은 판매자가 적은 글자 그대로다. 러너가 서버처럼 코어 normalizePhone으로 정규화해 phoneKey(불투명 키)·phoneLast4로
# 바꿔 엔진에 넘긴다(README "이벤트 종류와 필드", D-061). 휴대폰 번호 모양이 아니면 전화번호 없이 넘긴다.
id: G-ENG-150
title: 전화번호는 키로 잇는다 — 형식이 달라도 같은 번호면 같은 구매자, 뒤 4자리만 같으면 다른 구매자, 구매자 보기엔 뒤 4자리만, 번호 일부·지정 구매자의 전화번호는 뒤 4자리도 남기지 않는다
refs: [DAT-06, ORD-08, BUY-02, R-1, R-11, R-13, D-051, D-061]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 1, name: 금황성, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 2, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 3, name: 성미인, price: 8000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_H, nick: 홍길동, text: "안녕하세요" }                              # H 기록(찜 없음)
  # 01012345678 → 키 K1(새) → 새 문자 구매자 X, 뒤 4자리 5678 → 1번 확정(1) (찜 1)
  - { at: "20:00:10", type: sms, b: b1, ref: s1, no: 1, received: "20:00:09", phone: "010-1234-5678" }
  # 괄호·공백·하이픈을 지우면 01012345678 → 같은 키 K1 → X → 2번 확정(1) (찜 2)
  - { at: "20:00:11", type: sms, b: b1, ref: s2, no: 2, received: "20:00", phone: "(010) 1234-5678" }
  # "5678" → 휴대폰 번호 모양 아님 → 전화번호 없이 → 새 문자 구매자 Y, 뒤 4자리 없음 → 3번 확정(1) (찜 3)
  - { at: "20:00:12", type: sms, b: b1, ref: s3, no: 3, received: "20:00:11", phone: "5678" }
  # 지정 구매자 H가 먼저 → 전화번호는 보지 않는다(키를 기록하지 않고, H에 뒤 4자리도 붙지 않는다) → 3번 대기 [H] (찜 4)
  - { at: "20:00:13", type: sms, b: b1, ref: s4, no: 3, received: "20:00:12", buyer: UC_H, phone: "010-9999-0000" }
  # 01099990000 → 키 K2. s4는 키를 기록하지 않았으므로 이을 구매자가 없다 → 새 문자 구매자 Z, 뒤 4자리 0000 → 2번 대기 [Z] (찜 5)
  - { at: "20:00:14", type: sms, b: b1, ref: s5, no: 2, received: "20:00:13", phone: "010-9999-0000" }
  # 같은 키 K2 → Z → 1번 대기 [Z] (찜 6)
  - { at: "20:00:15", type: sms, b: b1, ref: s6, no: 1, received: "20:00:14", phone: "01099990000" }
  # 01077775678 → 뒤 4자리는 X와 같은 5678이지만 다른 번호 → 다른 키 K3 → 새 문자 구매자 W → 1번 대기 [Z, W] (찜 7)
  # (뒤 4자리로 이으면 W = X가 되어 X는 1번에 확정 찜이 있으니 새 찜이 없다 → 대기 [Z], 찜 6)
  - { at: "20:00:16", type: sms, b: b1, ref: s7, no: 1, received: "20:00:15", phone: "010-7777-5678" }
expect:
  products:
    b1/1: { status: SOLD, winner: "sms:s1", waitlist: ["sms:s5", "sms:s7"] }
    b1/2: { status: SOLD, winner: "sms:s1", waitlist: ["sms:s5"] }
    b1/3: { status: SOLD, winner: "sms:s3", waitlist: [UC_H] }
  sameBuyer: [["sms:s1", "sms:s2"], ["sms:s5", "sms:s6"], ["sms:s4", UC_H]]
  buyers:
    "sms:s1": { items: [b1/1, b1/2], subtotal: 15000, display: 문자찜, phoneLast4: "5678" }    # 10,000 + 5,000
    "sms:s3": { items: [b1/3], subtotal: 8000, display: 문자찜, phoneLast4: null }
    "sms:s5": { items: [], subtotal: 0, display: 문자찜, phoneLast4: "0000" }
    "sms:s7": { items: [], subtotal: 0, display: 문자찜, phoneLast4: "5678" }                 # 뒤 4자리가 같아도 X와 다른 구매자
    UC_H: { items: [], subtotal: 0, display: 홍길동, phoneLast4: null }                       # 유튜브 구매자에는 뒤 4자리가 없다
  claimCount: 7
  effects:                                         # 감사 문구에 전화번호·뒤 4자리가 없다
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/1, buyer: "sms:s1", text: "1번 금황성 10,000원 문자찜님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/2, buyer: "sms:s1", text: "2번 라울 5,000원 문자찜님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/3, buyer: "sms:s3", text: "3번 성미인 8,000원 문자찜님 구매 감사합니다" }
  effectCounts: { POST_THANKS: 3, PRINT_PRODUCT_LABEL: 3 }
---
id: G-ENG-151
title: 문자찜 재전송 — ref는 처음 받을 때 기록한다(모르는 지정 구매자라 아무 일도 없었어도). 같은 ref의 사본은 내용이 달라도 아무 일도 없다
refs: [ORD-08, BUY-02, R-11, INV-3, INV-12, D-051, D-067]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  # UC_A는 엔진이 아직 모르는 구매자 → 찜·구매자 없음. ref s1은 기록한다
  - { at: "20:00:05", type: sms, b: b1, ref: s1, no: 15, received: "20:00:04", buyer: UC_A }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "안녕하세요" }                   # 이제 A를 안다
  # s1 사본(네트워크 재시도). 이미 받은 ref → 아무 일도 없다. (ref를 기록하지 않았다면 지금은 A를 알므로 A가 1등이 되어 결과가 달라진다)
  - { at: "20:00:20", type: sms, b: b1, ref: s1, no: 15, received: "20:00:04", buyer: UC_A }
  - { type: assert, expect: { products: { b1/15: { status: OPEN, winner: null } }, claimCount: 0 } }
  - { at: "20:00:30", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }                        # B 확정(1) (찜 1)
  # 지정 구매자 A → 대기 [A] (찜 2). 메모는 유튜브 구매자의 표시 이름을 바꾸지 않는다
  - { at: "20:00:32", type: sms, b: b1, ref: s2, no: 15, received: "20:00:31", buyer: UC_A, memo: 전화 주문 }
  # s2 사본인데 내용이 다르다(수신 시각·메모) → 이미 받은 ref → 아무 일도 없다
  - { at: "20:00:40", type: sms, b: b1, ref: s2, no: 15, received: "20:00:33", buyer: UC_A, memo: 다른 메모 }
  # 01012345678 → 새 문자 구매자 X(뒤 4자리 5678) → 대기 [A, X] (찜 3)
  - { at: "20:00:42", type: sms, b: b1, ref: s3, no: 15, received: "20:00:41", phone: "010-1234-5678" }
  # s3 사본에 다른 전화번호·메모 → 아무 일도 없다(그 번호의 키도 기록하지 않고, X의 메모·뒤 4자리도 그대로)
  - { at: "20:00:50", type: sms, b: b1, ref: s3, no: 15, received: "20:00:41", phone: "010-9999-0000", memo: 김영희 }
  # 01099990000 → 이을 구매자 없음(사본은 키를 기록하지 않았다) → 새 문자 구매자 Z(뒤 4자리 0000) → 대기 [A, X, Z] (찜 4)
  - { at: "20:00:51", type: sms, b: b1, ref: s4, no: 15, received: "20:00:50", phone: "01099990000" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_A, "sms:s3", "sms:s4"] }
  sameBuyer: [["sms:s2", UC_A]]
  buyers:
    UC_A: { items: [], subtotal: 0, display: 홍길동, nameHistory: [홍길동] }
    "sms:s3": { items: [], display: 문자찜, nameHistory: [문자찜], phoneLast4: "5678" }
    "sms:s4": { items: [], display: 문자찜, phoneLast4: "0000" }
  claimCount: 4
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1 }
---
id: G-ENG-152
title: 메시지 변환은 주문이 아니었던 메시지만 — 주문이었던 메시지(같은 사람 반복이라 찜을 만들지 않았어도)는 어느 번호로도 바꾸지 않고, 주문이 아니었던 메시지는 번호마다 한 번
refs: [ORD-01, ORD-10, ORD-12, R-4, R-7, D-054, D-062]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }    # seq 1
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }         # seq 2
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }          # seq 3. A 15번 확정(1) (찜 1)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_A, nick: 홍길동, text: "15번" }        # seq 4. 주문이지만 같은 사람 반복(4번 줄) → 찜 없음
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_B, nick: 김철수, text: "15" }          # seq 5. 대기 [B] (찜 2)
  - { at: "20:00:20", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }      # seq 6. A 취소 → 자동 승계: B 확정(2)
  # m2는 15번 주문이었다 → 아무 일도 없다. (막지 않으면 A의 새 찜이 m2 순위 seq 4로 B(5)를 밀어내야 해 충돌 — 취소한 사람이 옛 순위로 돌아온다)
  - { at: "20:00:30", type: host.convertMessage, b: b1, msg: m2, no: 15 }                     # seq 7
  # m1은 주문이었던 메시지 → 다른 번호로도 바꾸지 않는다. (막지 않으면 A가 m1 순위로 16번 1등)
  - { at: "20:00:31", type: host.convertMessage, b: b1, msg: m1, no: 16 }                     # seq 8
  - { type: assert, expect: { products: { b1/15: { winner: UC_B, waitlist: [], conflict: false }, b1/16: { status: OPEN, winner: null } }, claimCount: 2 } }
  - { at: "20:00:40", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "16번 예뻐요" }  # seq 9. 주문 아님(언급 [16])
  # m4 → C의 16번 찜(순위 seq 9). 16번 빈 자리 → 확정(1) (찜 3)
  - { at: "20:00:50", type: host.convertMessage, b: b1, msg: m4, no: 16 }                     # seq 10
  # m4 → 15번(메시지에 없는 번호도 된다). C(9)는 B(5)보다 뒤 → 대기 자리 [C] (찜 4)
  - { at: "20:00:51", type: host.convertMessage, b: b1, msg: m4, no: 15 }                     # seq 11
  - { at: "20:00:52", type: host.convertMessage, b: b1, msg: m4, no: 16 }                     # seq 12. 이미 16번으로 바꾼 메시지 → 아무 일도 없다
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_C], conflict: false }
    b1/16: { status: SOLD, winner: UC_C, waitlist: [], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
    - { product: b1/15, buyer: UC_C, status: WAITLISTED }
    - { product: b1/16, buyer: UC_C, status: CONFIRMED }
  claimCount: 4
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_C, text: "16번 라울 5,000원 이영희님 구매 감사합니다", confirmVersion: 1 }
  effectCounts: { POST_THANKS: 3, PRINT_PRODUCT_LABEL: 3, VOID_LABEL: 0 }    # A(1)·B(2)·C 16번(1)
  pendingEffects:                                  # A(1)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_B, confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_C, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: UC_C, confirmVersion: 1 }
---
id: G-ENG-153
title: 시청자 채팅 취소는 그 채널 자신의 찜에만 — 합친 문자 구매자의 찜은 자동 취소되지 않고, 자기 찜은 그대로 자동 취소
refs: [ORD-07, BUY-03, R-8, R-11, D-057, D-063]
settings: { cancel.buyerChat: AUTO }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:05", type: sms, b: b1, ref: s1, no: 15, received: "20:00:04", memo: 길동 }     # 새 문자 구매자 S → 15번 확정(1) (찜 1)
  - { at: "20:00:06", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "16" }           # A 16번 확정(1) (찜 2)
  - { at: "20:00:10", type: buyer.merge, from: UC_A, into: "sms:s1", reason: 같은 사람 }         # A → S. 같은 상품 찜이 없어 중복 없음
  # 지금의 구매자(S)의 15번 활성 찜은 S 자신의 찜(문자찜) — A 채널의 찜이 아니다 → 무시(취소·요청 없음)
  - { at: "20:00:20", type: chat, b: b1, id: m2, ch: UC_A, nick: 홍길동, text: "15 취소" }
  - { type: assert, expect: { products: { b1/15: { status: SOLD, winner: "sms:s1" } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFIRMED }], cancelRequests: [] } }
  # 16번 찜은 A 자신의 찜 → AUTO, 잠금 전(보고·확인 없음, 묶음 받은 금액 0) → 바로 취소 → 대기 없음 → OPEN
  - { at: "20:00:30", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "16 취소" }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1" }
    b1/16: { status: OPEN, winner: null }
  claims:
    - { product: b1/15, buyer: "sms:s1", status: CONFIRMED }
    - { product: b1/16, buyer: UC_A, status: CANCELLED }
  cancelRequests: []
  buyers:
    "sms:s1": { items: [b1/15], subtotal: 10000 }
  pendingEffects:                                  # A 16번(1)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s1", confirmVersion: 1 }
---
id: G-ENG-154
title: 시청자 채팅 취소 요청(기본)도 그 채널 자신의 찜에만 — 채널에 합친 문자 구매자의 찜에는 요청이 생기지 않아 승인할 것도 없다
refs: [ORD-07, BUY-03, R-8, R-11, D-043, D-063]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:05", type: sms, b: b1, ref: s1, no: 15, received: "20:00:04" }                 # 새 문자 구매자 S → 15번 확정(1)
  - { at: "20:00:06", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "16" }           # A 16번 확정(1)
  - { at: "20:00:10", type: buyer.merge, from: "sms:s1", into: UC_A, reason: 같은 사람 }         # S → A. 지금의 구매자 A
  - { at: "20:00:20", type: chat, b: b1, id: m2, ch: UC_A, nick: 홍길동, text: "15 취소" }       # 15번 활성 찜은 S 자신의 찜 → 무시(요청 없음)
  - { at: "20:00:21", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "16 취소" }       # A 자신의 찜 → 요청 (16, A)
  - { at: "20:00:30", type: host.approveCancel, b: b1, no: 15, buyer: UC_A }                    # 15번 요청 없음 → 아무 일도 없다
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A }
    b1/16: { status: SOLD, winner: UC_A }
  claims:
    - { product: b1/15, buyer: "sms:s1", status: CONFIRMED }
  cancelRequests: [{ product: b1/16, buyer: UC_A }]
  buyers:
    UC_A: { items: [b1/15, b1/16], subtotal: 15000 }                                          # 합친 결과 10,000 + 5,000
