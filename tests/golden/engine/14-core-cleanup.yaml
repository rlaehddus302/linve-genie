id: G-ENG-156
title: 재고를 늘려 여럿이 확정되면 확정버전은 확정하는 순서(대기 순번)대로 — 대기 1순위가 순위로는 뒤여도 먼저 붙는다
refs: [PRD-02, ORD-11, R-9, R-10, R-13, D-044, D-055, D-066]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }    # seq 1
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }          # seq 2. A 확정(1)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_D, nick: 박민수, text: "안녕하세요" }  # seq 3. D 기록
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_E, nick: 최영수, text: "안녕하세요" }  # seq 4. E 기록
  # D 새 배정 찜(순위 = 이 조치 seq 5) 확정(2), A → 대기 1순위 [A]
  - { at: "20:00:10", type: host.assign, b: b1, no: 15, buyer: UC_D, reason: 전화 주문, replace: UC_A, replaceTo: WAITLIST }
  - { at: "20:00:20", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "15" }          # seq 6. 대기 [A, C]
  # E 새 배정 찜 확정(3), D → 대기 1순위 [D, A, C]. 대기 순번은 D(순위 seq 5)가 A(seq 2)보다 앞이다
  - { at: "20:00:30", type: host.assign, b: b1, no: 15, buyer: UC_E, reason: 전화 주문, replace: UC_D, replaceTo: WAITLIST }
  - { type: assert, expect: { products: { b1/15: { winner: UC_E, waitlist: [UC_D, UC_A, UC_C] } } } }
  # 재고 1→3: 늘린 2자리 → 대기 1순위부터 확정 — D 확정(4), 그다음 A 확정(5). 판정 순위 순서(A 먼저)가 아니다 → 대기 [C]
  - { at: "20:00:40", type: product.update, b: b1, no: 15, stock: 3 }
expect:
  products:
    b1/15: { status: SOLD, winners: [UC_E, UC_D, UC_A], waitlist: [UC_C] }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_D, text: "15번 핑크프릴 10,000원 박민수님 구매 감사합니다", confirmVersion: 4 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다", confirmVersion: 5 }
  effectCounts: { POST_THANKS: 5, PRINT_PRODUCT_LABEL: 5, VOID_LABEL: 0 }    # A(1)·D(2)·E(3)·D(4)·A(5)
  pendingEffects:                                  # A(1)·D(2)의 미실행 효과는 교체 때 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_E, confirmVersion: 3 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_E, confirmVersion: 3 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_D, confirmVersion: 4 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_D, confirmVersion: 4 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, confirmVersion: 5 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A, confirmVersion: 5 }
---
id: G-ENG-157
title: 대기가 꽉 찼을 때 충돌이 자리가 비어 풀리면 넘침 정리는 승계·재고 규칙 뒤에 — 맨 끝 대기자가 이유 없이 품절되지 않는다(1등 취소, 재고 늘림)
refs: [ORD-04, ORD-10, ORD-11, R-4, R-7, R-8, R-10, D-053, D-068]
settings: { contention.policy: RECEIVED_TIME, waitlist.max: 2 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # A 15번 확정(1), t 10 (찜 1)
  - { at: "20:00:11", type: host.confirm, b: b1, no: 15, buyer: UC_A }                        # A 잠금
  - { at: "20:00:20", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }        # 대기 [B(20)] (찜 2)
  - { at: "20:00:30", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }        # 대기 [B, C(30)] — 한도 2, 꽉 참 (찜 3)
  - { at: "20:00:40", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }              # t 05 < A, 잠금 후 → 충돌 (찜 4)
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [UC_B, UC_C], conflict: true } } } }
  # A 취소 → 자리가 빔 → 충돌이 먼저 풀림: s1(05)을 대기 자리에 → [s1, B, C] (아직 정리하지 않는다)
  # → 자동 승계: s1 확정(2) → [B, C] → 넘침 정리: 2 ≤ 2 → 아무도 품절되지 않는다. (먼저 정리하면 C가 품절되고 대기 [B]만 남는다)
  - { at: "20:00:50", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }
  - { at: "20:01:00", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "16" }        # D 16번 확정(1), t 60 (찜 5)
  - { at: "20:01:01", type: host.confirm, b: b1, no: 16, buyer: UC_D }                        # D 잠금
  - { at: "20:01:10", type: chat, b: b1, id: m5, ch: UC_E, nick: 최영수, text: "16" }        # 대기 [E] (찜 6)
  - { at: "20:01:20", type: chat, b: b1, id: m6, ch: UC_F, nick: 정수진, text: "16" }        # 대기 [E, F] — 꽉 참 (찜 7)
  - { at: "20:01:30", type: sms, b: b1, ref: s2, no: 16, received: "20:00:50" }              # t 50 < D(60), 잠금 후 → 충돌 (찜 8)
  # 재고 1→2 → 충돌이 먼저 풀림: s2(50)를 대기 자리에 → [s2, E, F] → 늘린 1자리: s2 확정(2) → [E, F] → 정리할 것 없음
  - { at: "20:01:40", type: product.update, b: b1, no: 16, stock: 2 }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_B, UC_C], conflict: false }
    b1/16: { status: SOLD, winners: [UC_D, "sms:s2"], waitlist: [UC_E, UC_F], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
    - { product: b1/15, buyer: UC_C, status: WAITLISTED }
    - { product: b1/16, buyer: UC_F, status: WAITLISTED }
  claimCount: 8
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4, VOID_LABEL: 0 }    # A(1)·s1(2)·D(1)·s2(2)
  pendingEffects:                                  # A(1)의 미실행 효과는 취소. D는 확인(잠금)만 했고 실행 보고는 없다
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_D, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: UC_D, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: "sms:s2", confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: "sms:s2", confirmVersion: 2 }
