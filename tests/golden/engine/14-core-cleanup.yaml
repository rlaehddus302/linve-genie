id: G-ENG-158
title: 대기 한도 0(대기 없음)·접수순 — 변환으로 생긴 충돌의 1등이 채팅으로 자동 취소하면 충돌 찜이 품절되지 않고 승계로 1등이 된다
refs: [ORD-07, ORD-10, ORD-12, R-4, R-7, R-8, D-053, D-054, D-068]
settings: { waitlist.max: 0, cancel.buyerChat: AUTO }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }   # seq 1
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번이용ㅎ" }  # seq 2. 주문 아님(언급)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }         # seq 3. B 확정(1) (찜 1)
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }         # seq 4. 대기 한도 0 → 품절 (찜 2)
  # m1 → A의 15번 찜, 순위 seq 2 < B(3) → 1등을 밀어내야 함 → 변환은 늘 충돌 (찜 3)
  - { at: "20:00:20", type: host.convertMessage, b: b1, msg: m1, no: 15 }
  - { type: assert, expect: { products: { b1/15: { winner: UC_B, waitlist: [], conflict: true } } } }
  # B 자기 찜 취소(AUTO, 잠금 전) → 자리가 빔 → 충돌이 먼저 풀림: A를 대기 자리에 [A] → 자동 승계: A 확정(2) → [] → 정리할 것 없음
  # (먼저 정리하면 한도 0이라 A가 품절되고 15번은 1등 없이 다시 판매 중이 된다)
  - { at: "20:00:30", type: chat, b: b1, id: m4, ch: UC_B, nick: 김철수, text: "15 취소" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_B, status: CANCELLED }
    - { product: b1/15, buyer: UC_C, status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: UC_A, status: CONFIRMED }
  claimCount: 3
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }    # B(1)·A(2)
  pendingEffects:                                  # B(1)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A, confirmVersion: 2 }
