  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_X, nick: 장난꾼, text: "15" }
  - { at: "20:00:02", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }
