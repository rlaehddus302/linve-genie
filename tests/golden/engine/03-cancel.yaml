id: G-ENG-028
title: 승계=묻기 세부 — 대기가 없으면 바로 판매 중, 결정 대기 중 대기 한도를 넘으면 품절, 재오픈하면 대기자 정리 (D-041)
refs: [ORD-07, R-8, R-4, D-041]
settings: { cancel.succession: ASK, waitlist.max: 2 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }      # A 15번 확정(15번 확정버전 1)
  - { at: "20:00:03", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }      # 대기 [B]
  - { at: "20:00:04", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "16" }      # A 16번 확정(16번 확정버전 1)
  - { at: "20:01:00", type: host.cancel, b: b1, no: 16, buyer: UC_A, reason: 구매자 요청 }  # 16번 대기 없음 → 표시 없이 OPEN
  - { at: "20:01:01", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "16" }      # 5번 줄 아님 → 6번 줄 확정(16번 확정버전 2)
  - { type: assert, expect: { products: { b1/16: { status: SOLD, winner: UC_C } } } }
  - { at: "20:02:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }  # 15번 대기 [B] 있음 → "승계 결정 필요", 1등 없음
  - { at: "20:02:01", type: chat, b: b1, id: m5, ch: UC_D, nick: 박민수, text: "15" }      # 5번 줄: 대기 1 < 한도 2 → 대기 [B, D]
  - { at: "20:02:02", type: chat, b: b1, id: m6, ch: UC_E, nick: 최지우, text: "15" }      # 5번 줄: 대기 2 = 한도 → REJECTED(SOLD_OUT)
  - { type: assert, expect: { products: { b1/15: { winner: null, waitlist: [UC_B, UC_D] } }, claims: [{ product: b1/15, buyer: UC_E, status: REJECTED, reason: SOLD_OUT }] } }
  - { at: "20:02:30", type: host.reopen, b: b1, no: 15, reason: 다시 받기 }                # REOPEN과 같다: B·D → WAITLIST_CLEARED, OPEN, 표시 사라짐
  - { type: assert, expect: { products: { b1/15: { status: OPEN, winner: null, waitlist: [] } } } }
  - { at: "20:02:31", type: chat, b: b1, id: m7, ch: UC_E, nick: 최지우, text: "15" }      # E는 활성 찜 없음 → 새 찜, 6번 줄 확정(15번 확정버전 2)
expect:
  products:
    b1/15: { status: SOLD, winner: UC_E, waitlist: [] }
    b1/16: { status: SOLD, winner: UC_C, waitlist: [] }
  claims:
    - { product: b1/15, buyer: UC_B, status: REJECTED, reason: WAITLIST_CLEARED }
    - { product: b1/15, buyer: UC_D, status: REJECTED, reason: WAITLIST_CLEARED }
    - { product: b1/15, buyer: UC_E, status: CONFIRMED }
  claimCount: 7      # A·15, B·15, A·16, C·16, D·15, E·15(품절), E·15(확정)
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4 }
  pendingEffects:    # A의 두 확정 효과는 취소됨
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_C, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: UC_C, confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_E, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_E, confirmVersion: 2 }
