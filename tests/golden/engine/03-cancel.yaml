id: G-ENG-020
title: 1등 취소 + 자동 승계 → 새 1등에게 라벨·감사, 이전 라벨 폐기
refs: [ORD-07, R-8, R-13]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:02", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }
  - { at: "20:00:03", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }
  - { at: "20:00:04", type: effect.labelPrinted, b: b1, no: 15, buyer: UC_A }      # A 라벨은 이미 출력됨
  - { at: "20:05:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_C] }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
  buyers:
    UC_A: { subtotal: 0 }
    UC_B: { subtotal: 10000 }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다" }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_B }
    - { kind: VOID_LABEL, product: b1/15, buyer: UC_A }
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 1 }
