id: G-ENG-037
title: 접수순이어도 방송자가 놓친 채팅을 찜으로 바꾸면 원래 순위로 → 1등을 밀어내야 하면 충돌
refs: [ORD-01, ORD-10, ORD-12, R-7]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번이용ㅎ 제가 살게요" }  # STRICT에선 주문 아님
  - { at: "20:00:08", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }
  - { at: "20:00:30", type: host.convertMessage, b: b1, msg: m1, no: 15 }
  - { type: assert, expect: { products: { b1/15: { winner: UC_B, conflict: true } } } }
  - { at: "20:00:40", type: host.resolveConflict, b: b1, no: 15, decision: SWITCH }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_B], conflict: false }
