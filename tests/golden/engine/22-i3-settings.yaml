# I3 보강 — 설정 화면·시작 마법사가 판매자에게 하는 약속 (SPEC §7 화면 8·UX-02·YT-04·YT-05, DOMAIN_RULES "설정 스냅샷"·R-4·R-8·R-12·R-13, D-070, D-I3-08·D-I3-09).
# 새 규칙은 없다(I3는 dev-core가 없다). 화면이 "바꾼 규칙은 다음에 시작하는 방송부터 적용돼요", "그날 첫 방송이 이미 있으면 그날 정산은 그대로예요",
# "진행 중인 방송에는 바뀐 규칙이 적용되지 않아요"라고 말하는 근거를 고정한다(G-ENG-160은 실시간 감사 끄기·대기·배송비만 본다 — 여기서는 감사 메시지
# 규칙 셋(thanks.liveChat·thanks.videoComment)과 승계·대기·자동 출력을 함께 바꾼다).
# - 판매자가 설정 화면에서 규칙을 바꾸면 서버는 판매자 설정만 고친다(엔진 이벤트 없음). 다음 broadcast.start가 그 설정을 스냅샷으로 담는다(D-070).
# - 1부(기본값으로 시작)의 상품은 2부를 시작한 뒤에도 1부 스냅샷으로 판정하고 효과를 낸다 — 대기 한도 5, 자동 승계, 실시간 채팅 감사, 자동 출력.
# - 2부(바꾼 설정으로 시작)의 상품은 2부 스냅샷 — 대기 한도 1, 재오픈, 영상 댓글(판매마다)만, 자동 출력 끔.
# - 같은 날 정산 배송비는 그날 첫 방송(1부) 스냅샷 4,000원이다(2부의 3,000원이 아니다).
# 시나리오 번호: 병렬 트랙끼리 겹치지 않게 I3은 G-ENG-701부터 쓴다(D-I3-18 — 러너 형식이 G-ENG-세 자리라 G-ENG-I3-01은 쓸 수 없다).
id: G-ENG-701
title: 설정 화면의 약속 — 감사 메시지·대기·승계·자동 출력·배송비를 바꾸고 같은 날 2부를 시작해도 1부 상품은 1부 스냅샷으로 판정·효과, 2부 상품은 2부 스냅샷, 그날 배송비는 첫 방송 것
refs: [UX-02, YT-04, YT-05, ORD-04, ORD-07, STL-02, R-4, R-8, R-12, R-13, D-070, D-I3-08]
broadcasts: []
events:
  # 1부: 설정 없이 시작 = DOMAIN_RULES 기본값 (thanks.liveChat 예, thanks.videoComment OFF, waitlist.max 5, cancel.succession AUTO, print.autoOnConfirm 예, shipping.baseFee 4000)
  - { at: "20:00:00", type: broadcast.start, b: b1, date: 2026-10-25, title: 1부 }
  - { at: "20:00:05", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # A 1등(15번 확정버전 1) → 라벨 1 + 실시간 채팅 감사 1 (영상 댓글 OFF → 없음)
  - { at: "20:00:11", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }        # 대기 [B] (1 < 한도 5)
  - { at: "20:00:12", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }        # 대기 [B, C] (2 < 5)
  # 판매자가 설정 화면에서 규칙을 바꿨다(엔진 이벤트 없음) → 2부 broadcast.start가 바뀐 설정을 스냅샷으로 담는다
  - { at: "21:00:00", type: broadcast.start, b: b2, date: 2026-10-25, title: 2부, settings: { thanks.liveChat: false, thanks.videoComment: PER_SALE, waitlist.max: 1, cancel.succession: REOPEN, print.autoOnConfirm: false, shipping.baseFee: 3000 } }
  - { at: "21:00:05", type: product.register, b: b2, no: 31, name: 방울복랑 금, price: 15000 }
  - { at: "21:00:10", type: chat, b: b2, id: m4, ch: UC_B, nick: 김철수, text: "31" }        # B 1등(31번 확정버전 1) → 2부 스냅샷: 실시간 감사 없음·라벨 없음, 영상 댓글 감사 1
  - { at: "21:00:11", type: chat, b: b2, id: m5, ch: UC_D, nick: 박민수, text: "31" }        # 대기 [D] (0 < 한도 1)
  - { at: "21:00:12", type: chat, b: b2, id: m6, ch: UC_E, nick: 최수진, text: "31" }        # 대기 1 = 한도 1 → REJECTED(SOLD_OUT)
  - { at: "21:00:15", type: chat, b: b1, id: m7, ch: UC_F, nick: 정다은, text: "15" }        # 1부 상품: 1부 스냅샷 한도 5 → 대기 [B, C, F] (2부 한도 1이 걸리면 품절이었을 것)
  - type: assert
    expect:
      products:
        b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_B, UC_C, UC_F] }
        b2/31: { status: SOLD, winner: UC_B, waitlist: [UC_D] }
      claims:
        - { product: b2/31, buyer: UC_E, status: REJECTED, reason: SOLD_OUT }
        - { product: b1/15, buyer: UC_F, status: WAITLISTED }
      effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 1 }      # A: 라벨 1 + 실시간 감사 1, B(2부): 영상 댓글 감사 1
  - { at: "21:00:20", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }   # 1부 스냅샷 AUTO → 대기 1순위 B 1등(15번 확정버전 2) → 라벨 1 + 실시간 감사 1(김철수), 대기 [C, F]. A의 미실행 효과 2개는 취소(출력 보고 없음 → VOID_LABEL 없음)
  - { at: "21:00:30", type: host.cancel, b: b2, no: 31, buyer: UC_B, reason: 구매자 요청 }   # 2부 스냅샷 REOPEN → 대기 D는 REJECTED(WAITLIST_CLEARED), 31번 OPEN. B의 미실행 영상 댓글 감사는 취소
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_C, UC_F] }
    b2/31: { status: OPEN, winner: null, waitlist: [] }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
    - { product: b1/15, buyer: UC_B, status: CONFIRMED }
    - { product: b2/31, buyer: UC_B, status: CANCELLED }
    - { product: b2/31, buyer: UC_D, status: REJECTED, reason: WAITLIST_CLEARED }
    - { product: b2/31, buyer: UC_E, status: REJECTED, reason: SOLD_OUT }
  buyers:
    UC_B: { items: [b1/15], subtotal: 10000, byBroadcast: { b1: 10000 } }   # 2부 31번은 취소 → 1부 15번 10,000만
    UC_A: { items: [], subtotal: 0 }
  settlements:
    UC_B@2026-10-25: { subtotal: 10000, shipping: 4000, total: 14000, payment: UNPAID }   # 그날 첫 방송(1부) 스냅샷 배송비 4,000 (2부 3,000 아님), 무료 기준 없음 → 10,000 + 4,000
    UC_A@2026-10-25: { subtotal: 0, shipping: 0, total: 0, payment: UNPAID }             # 품목·입금 없음 → 모두 0
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다" }
    - { kind: POST_THANKS, target: VIDEO_COMMENT, product: b2/31, buyer: UC_B, text: "31번 방울복랑 금 15,000원 김철수님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다" }
  effectCounts: { POST_THANKS: 3, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }   # 감사: A 실시간·B 영상 댓글(2부)·B 실시간(1부 승계) / 라벨: A·B(1부만 — 2부는 자동 출력 끔)
  pendingEffects:                                                           # A의 두 효과·B의 2부 영상 댓글 감사는 취소됨 → 1부 승계의 두 효과만 남는다
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_B, confirmVersion: 2 }
  claimCount: 7          # 15번: A·B·C·F (4) + 31번: B·D·E (3)
  broadcasts:
    b1: { date: 2026-10-25, title: 1부, ended: false }
    b2: { date: 2026-10-25, title: 2부, ended: false }
