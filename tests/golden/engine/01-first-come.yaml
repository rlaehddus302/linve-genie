# S02 보강 — 채팅 → 찜 세부 (DOMAIN_RULES R-4 머리말, D-038, D-040, D-045). 기대값 계산은 각 줄 주석.
id: G-ENG-007
title: 같은 사람 반복은 무엇보다 먼저 본다 — 보류 중·일시 중지 중·차단 뒤에도 두 번째 찜이 생기지 않는다
refs: [ORD-02, R-4, INV-2, D-038]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # 15번 없음 → 보류 (찜 1)
  - { at: "20:00:01", type: chat, b: b1, id: m2, ch: UC_A, nick: 홍길동, text: "15번" }      # A는 15번에 보류 찜이 있음 → 새 찜 없음 (4번 줄을 2번 줄보다 먼저)
  - { type: assert, expect: { pending: { b1/15: [UC_A] }, claimCount: 1 } }
  - { at: "20:00:05", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }  # 공개 T−30초 = 19:59:35 ≤ 20:00:00 → A 확정
  - { at: "20:00:06", type: chat, b: b1, id: m3, ch: UC_B, nick: 김철수, text: "15" }        # 대기 1순위 (찜 2)
  - { at: "20:00:07", type: product.hold, b: b1, no: 15 }
  - { at: "20:00:08", type: chat, b: b1, id: m4, ch: UC_B, nick: 김철수, text: "15" }        # B는 대기 중 → 새 찜 없음 (3번 줄 NOT_ON_SALE보다 먼저)
  - { at: "20:00:09", type: chat, b: b1, id: m5, ch: UC_C, nick: 이영희, text: "15" }        # 일시 중지 → REJECTED(NOT_ON_SALE) (찜 3)
  - { at: "20:00:10", type: product.open, b: b1, no: 15 }                                     # 판매 재개: 확정 1 = 재고 1 → SOLD
  - { at: "20:00:20", type: host.blockBuyer, buyer: UC_A, reason: 장난 의심 }                # 확정 찜은 그대로 둔다 (D-040)
  - { at: "20:00:21", type: chat, b: b1, id: m6, ch: UC_A, nick: 홍길동, text: "15" }        # A는 15번 1등 → 새 찜 없음 (1번 줄 BLOCKED보다 먼저)
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_B] }
  claims:
    - { product: b1/15, buyer: UC_A, status: CONFIRMED }
    - { product: b1/15, buyer: UC_B, status: WAITLISTED }
    - { product: b1/15, buyer: UC_C, status: REJECTED, reason: NOT_ON_SALE }
  claimCount: 3
  pending: { b1/15: [] }
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1 }
---
id: G-ENG-008
title: 채팅은 그 방송의 설정으로 읽는다 — LOOSE·FIRST·maxNumber, 방송자 채팅 무시를 끄면 방송자도 찜할 수 있다
refs: [ORD-01, R-3, R-4, D-018, D-045]
settings: { claim.parseMode: LOOSE, claim.multiNumber: FIRST, claim.maxNumber: 50, claim.ignoreOwner: false }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 28, name: 라울, price: 5000 }
  - { at: "20:00:02", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번 이쁘다 살게요" }      # LOOSE: 맨 앞 '15번' → 주문 [15] → A 확정
  - { at: "20:00:03", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "28 15" }                 # FIRST: [28]만 → B 28번 확정, 15는 버린다
  - { at: "20:00:04", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "51" }                    # maxNumber 50 밖 → 주문 아님(보류도 아님)
  - { at: "20:00:05", type: chat, b: b1, id: m4, ch: UC_OWNER, nick: 비트다육, owner: true, text: "15" } # ignoreOwner 꺼짐 → 시청자와 같다 → 15번 대기 1순위
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_OWNER] }
    b1/28: { status: SOLD, winner: UC_B, waitlist: [] }
  pending: { b1/51: [] }
  claimCount: 3      # A·15, B·28, OWNER·15
  buyers:
    UC_B: { items: [b1/28], subtotal: 5000 }
---
id: G-ENG-009
title: 취소된 사람은 새 메시지로 다시 찜할 수 있지만 같은 메시지 재수신은 찜을 되살리지 않는다, 주문 아닌 채팅도 닉네임을 갱신한다
refs: [ORD-02, R-4, R-11, BUY-01, INV-3, INV-12, D-045]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }      # A 확정 (찜 1, 확정버전 1)
  - { at: "20:00:02", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }      # 대기 1순위 (찜 2)
  - { at: "20:01:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }  # A 취소 → 자동 승계: B 확정 (확정버전 2)
  - { at: "20:01:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }      # m1 재수신 → 아무 일도 없다 (A의 찜이 되살아나면 안 된다)
  - { type: assert, expect: { products: { b1/15: { winner: UC_B, waitlist: [] } }, claimCount: 2, claims: [{ product: b1/15, buyer: UC_A, status: CANCELLED }] } }
  - { at: "20:01:10", type: chat, b: b1, id: m3, ch: UC_A, nick: 길동이, text: "15" }      # 새 메시지: A는 활성 찜 없음 → 새 찜, 대기 1순위 (찜 3). 닉네임 갱신
  - { at: "20:01:20", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "15번 너무 예뻐요" }  # 언급뿐 → 찜 없음. 구매자 기록
  - { at: "20:01:30", type: chat, b: b1, id: m5, ch: UC_C, nick: 영희, text: "안녕하세요" }         # 주문 아님 → 닉네임만 갱신
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_A] }
  claims:
    - { product: b1/15, buyer: UC_A, status: WAITLISTED }
  claimCount: 3
  buyers:
    UC_A: { items: [], subtotal: 0, display: 길동이, nameHistory: [홍길동, 길동이] }
    UC_C: { items: [], subtotal: 0, display: 영희, nameHistory: [이영희, 영희] }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }   # A(1)·B(2). A 라벨은 출력 전에 취소 → 폐기 없음
