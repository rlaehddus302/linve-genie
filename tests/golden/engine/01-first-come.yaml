  - { at: "20:00:02.100", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:02.300", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15번" }
