id: G-ENG-001
title: 기본 선착순 — 먼저 쓴 사람이 산다. 재수신·같은 사람 반복은 무시
refs: [ORD-02, ORD-03, ORD-04, R-4, INV-2, INV-3]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:02.100", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:02.300", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15번" }
  - { at: "20:00:02.400", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }   # 같은 메시지 재수신
  - { at: "20:00:03.000", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "15!!" } # 같은 사람 반복
  - { at: "20:00:03.500", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "15" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_B, UC_C] }
  buyers:
    UC_A: { items: [b1/15], subtotal: 10000 }
    UC_B: { items: [], subtotal: 0 }
  claimCount: 3
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다" }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A }
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1 }
---
