  - { at: "20:00:03.000", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "15!!" } # 같은 사람 반복
  - { at: "20:00:03.500", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "15" }
expect:
