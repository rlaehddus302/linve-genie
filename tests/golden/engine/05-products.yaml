id: G-ENG-041
title: 번호를 잘못 등록했다가 고침 — 틀린 번호의 찜은 확인 대상, 맞는 번호 보류 찜은 판정
refs: [PRD-02, R-10, R-5]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 51, name: 핑크프릴, price: 10000 }   # 15를 51로 잘못 입력
  - { at: "20:00:03", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # 보류
  - { at: "20:00:04", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "51" }        # 화면의 오타를 보고 씀
  - { at: "20:00:10", type: product.renumber, b: b1, from: 51, to: 15 }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [] }
    b1/51: { exists: false }
  claims:
    - { product: b1/15, buyer: UC_B, status: REJECTED, reason: RENUMBERED }
