id: G-ENG-040
title: 가격 변경 — 기본은 확정 찜의 가격 유지, 입금 전 찜에 적용 옵션
refs: [PRD-02, R-10, DAT-05]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:30", type: product.update, b: b1, no: 15, price: 12000, applyTo: NEW_ONLY }
  - { at: "20:01:00", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:01:01", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16" }
  - { at: "20:01:30", type: product.update, b: b1, no: 16, price: 6000, applyTo: UNPAID_CLAIMS }
expect:
  products:
    b1/15: { price: 12000, priceHistory: [{ from: 10000, to: 12000 }] }
    b1/16: { price: 6000, priceHistory: [{ from: 5000, to: 6000 }] }
  buyers:
    UC_A: { subtotal: 10000 }
    UC_B: { subtotal: 6000 }
