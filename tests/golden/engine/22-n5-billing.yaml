# N5 보강 — 요금(주문 건권)이 기대는 엔진 동작 (BIL-02, R-2, R-8, R-10, R-11, R-13, BILLING_RULES BL-5, D-N5-05·D-N5-14).
# 새 엔진 규칙은 없다(N5는 dev-core가 없다). 서버는 "주문 건 방식(ORDERS) 방송의 상품이 처음으로 1등을 얻으면 1건"을 셀 때
# 코어 조회 ProductInfo.confirmVersion(그 상품의 지금까지 확정 횟수 = 마지막 확정버전, R-13)이 0에서 1 이상이 되는 것을 본다.
# 그 값이 기대는 성질을 고정한다 — 새 검사 키 `products.<p>.confirmVersion`(README "추가 검사 키"):
#   - 1등이 처음 나오면 1, 승계·역전으로 1등이 바뀔 때마다 1씩 늘고, 취소·대기 없음으로 1등이 없어져도 줄지 않는다.
#   - 재고 2 이상이면 확정마다 는다(요금은 상품 하나를 1건으로 센다 — 서버 몫, 엔진은 횟수만).
#   - 등록만 했거나 판매 종료(등록 되돌리기)한 상품은 0이다.
#   - 번호를 바꾸면 상품과 함께 옮긴다(같은 상품 — 다시 세지 않는다). 옛 번호에 새로 등록한 상품은 0부터(다른 상품).
#   - 같은 날 다른 방송의 같은 번호는 다른 상품, 끝낸 방송에 늦게 온 문자찜도 그 방송 상품의 확정, 합치기는 횟수를 바꾸지 않는다.
# 기대값은 손으로 계산했다. 계산은 줄마다 주석. 주석의 "주문 건 방식이었다면 N건"은 BL-5 셈(서버 시험의 기대값 재료)이다.
id: G-ENG-N5-01
title: 확정 횟수 — 승계·취소로 줄지 않음, 재고 2는 확정마다, 등록만·판매 종료는 0, 번호를 바꾸면 따라가고 옛 번호의 새 상품은 0부터
refs: [BIL-02, R-2, R-8, R-10, R-13, D-056, D-083, D-N5-05, D-N5-14]
broadcasts: [{ id: b1, date: 2026-10-20, title: 1부 }]   # 기본 설정: 대기 한도 5, 승계 AUTO
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }     # A 확정 → 15번 확정 횟수 1
  - { at: "20:00:02", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }     # 대기 [B]
  - type: assert
    expect:
      products: { b1/15: { winner: UC_A, waitlist: [UC_B], confirmVersion: 1 } }
  - { at: "20:01:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }  # A 취소 → 자동 승계 B 확정 → 2
  - { at: "20:02:00", type: host.cancel, b: b1, no: 15, buyer: UC_B, reason: 구매자 요청 }  # B 취소, 대기 없음 → 1등 없음, 다시 판매 중. 횟수는 2 그대로
  - type: assert
    expect:
      products: { b1/15: { status: OPEN, winner: null, waitlist: [], confirmVersion: 2 } }
  - { at: "20:03:00", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }                # 찜 없음 → 0
  - { at: "20:04:00", type: product.register, b: b1, no: 17, name: 홍미인, price: 8000, stock: 2 }
  - { at: "20:04:01", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "17" }    # C 확정 → 1
  - { at: "20:04:02", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "17" }    # D 확정 → 2 (재고 2)
  - { at: "20:05:00", type: product.register, b: b1, no: 18, name: 정야, price: 3000 }
  - { at: "20:05:03", type: product.close, b: b1, no: 18 }                                 # 등록 되돌리기 = 판매 종료 (D-083) → 0
  - type: assert
    expect:
      products:
        b1/16: { status: OPEN, winner: null, confirmVersion: 0 }
        b1/17: { status: SOLD, winners: [UC_C, UC_D], confirmVersion: 2 }
        b1/18: { status: CLOSED, confirmVersion: 0 }
  # 15번(1등 없음, 횟수 2)을 25번으로 → 상품·확정 횟수가 함께 옮긴다. 15번 자리는 비고 횟수 0
  - { at: "20:06:00", type: product.renumber, b: b1, from: 15, to: 25 }
  - { at: "20:06:10", type: product.register, b: b1, no: 15, name: 금황, price: 12000 }      # 옛 번호에 새 상품 → 0부터
  - type: assert
    expect:
      products:
        b1/15: { status: OPEN, winner: null, confirmVersion: 0 }
        b1/25: { status: OPEN, winner: null, confirmVersion: 2 }
  - { at: "20:06:11", type: chat, b: b1, id: m5, ch: UC_E, nick: 최지우, text: "15" }    # 새 15번 E 확정 → 1
  # 17번(1등 C·D, 횟수 2)을 27번으로 → C·D는 REJECTED(RENUMBERED), 승계 없음. 상품·횟수 2는 27번으로, 1등 없이 다시 판매 중
  - { at: "20:07:00", type: product.renumber, b: b1, from: 17, to: 27 }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_E, confirmVersion: 1 }
    b1/25: { status: OPEN, winner: null, confirmVersion: 2 }
    b1/16: { status: OPEN, winner: null, confirmVersion: 0 }
    b1/17: { exists: false }
    b1/27: { status: OPEN, winners: [], confirmVersion: 2 }
    b1/18: { status: CLOSED, confirmVersion: 0 }
  claims:
    - { product: b1/25, buyer: UC_A, status: CANCELLED }      # 옛 15번 상품의 찜은 그 상품을 따라 25번
    - { product: b1/25, buyer: UC_B, status: CANCELLED }
    - { product: b1/27, buyer: UC_C, status: REJECTED, reason: RENUMBERED }
    - { product: b1/27, buyer: UC_D, status: REJECTED, reason: RENUMBERED }
  # 주문 건 방식이었다면: 확정 횟수 ≥ 1인 상품 = 옛 15번(지금 25번)·17번(지금 27번)·새 15번 → 3건. 16·18번은 0건
---
id: G-ENG-N5-02
title: 같은 날 두 방송 — 2부의 같은 번호는 다른 상품, 실제 시각순 역전은 횟수를 늘리지만 같은 상품, 끝낸 1부의 늦은 문자찜도 1부 상품의 첫 1등, 합치기는 횟수를 바꾸지 않는다
refs: [BIL-02, ORD-08, ORD-09, BUY-03, R-0, R-7, R-11, R-13, D-070, D-090, D-N5-05, D-N5-14]
settings: { contention.policy: RECEIVED_TIME }   # 1부(목록으로 선언한 방송)에만 적용. 2부는 broadcast.start 설정(기본값)
broadcasts: [{ id: b1, date: 2026-10-20, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }      # A 확정 → 1
  - { at: "20:00:40", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }            # 더 빠른 문자찜, A 잠금 전 → 자동 역전(G-ENG-031): s1 확정 → 2, A는 대기
  - type: assert
    expect:
      products:
        b1/15: { winner: "sms:s1", waitlist: [UC_A], confirmVersion: 2 }
        b1/16: { winner: null, confirmVersion: 0 }
  - { at: "20:30:00", type: broadcast.end, b: b1 }
  - { at: "20:40:00", type: sms, b: b1, ref: s2, no: 16, received: "20:39" }               # 끝낸 1부의 늦은 문자찜(D-090) → 16번 첫 1등 → 1
  - { at: "21:00:00", type: broadcast.start, b: b2, date: 2026-10-20, title: 2부 }
  - { at: "21:00:01", type: product.register, b: b2, no: 15, name: 라울, price: 7000 }         # 2부 15번 = 다른 상품 → 0
  - type: assert
    expect:
      products:
        b1/15: { confirmVersion: 2 }
        b1/16: { winner: "sms:s2", confirmVersion: 1 }
        b2/15: { winner: null, confirmVersion: 0 }
  - { at: "21:00:02", type: chat, b: b2, id: m2, ch: UC_B, nick: 김철수, text: "15" }      # 2부 15번 B 확정 → 1
  # 같은 사람 → sms:s2를 UC_B에 합친다(두 사람 모두 1등인 상품 없음). 1등은 지금의 구매자로 풀릴 뿐, 확정 횟수는 그대로
  - { at: "21:10:00", type: buyer.merge, from: "sms:s2", into: UC_B, reason: 같은 사람 }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_A], confirmVersion: 2 }
    b1/16: { status: SOLD, winner: UC_B, confirmVersion: 1 }
    b2/15: { status: SOLD, winner: UC_B, confirmVersion: 1 }
  buyers:
    UC_B: { items: [b1/16, b2/15], subtotal: 12000, byBroadcast: { b1: 5000, b2: 7000 } }
  broadcasts:
    b1: { ended: true }
    b2: { ended: false }
  # 1부·2부가 모두 주문 건 방식이었다면: 1부 15·16번 2건 + 2부 15번 1건 = 3건 (방송마다 이용 방식이 따로라 서버가 방송별로 센다)
