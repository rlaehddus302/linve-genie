id: G-ENG-087
title: 시청자 채팅 취소 끔(OFF) — 취소 채팅은 기록만 하고 요청도 만들지 않는다
refs: [ORD-07, R-8]
settings: { cancel.buyerChat: OFF }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
