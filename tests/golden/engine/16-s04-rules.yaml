# 전화번호가 아닌 숫자는 받는다 (S04 마무리, D-079·D-080 — SA-S04-007·SA-S04-006·SA-S04-003). 번호 판단은 DOMAIN_RULES R-1 "판매자가 적는 칸의 휴대폰 번호"와
# README 이벤트 표 아래 같은 이름의 문단: 숫자 덩어리 하나가 01X(X는 0·1·6·7·8·9)로 시작하는 10~11자리 전체이거나, 01X 세 자리 덩어리 뒤에
# 구분자만 사이에 두고 이어진 덩어리들을 붙여 정확히 7~8자리가 되는 곳이 있을 때만 번호다. ID 칸은 값 전체가 숫자·구분자뿐이고 normalizePhone 결과가 있을 때만.
# 아래 글 칸은 모두 숫자를 전부 모으면 01로 시작하는 10자리가 된다 — 지난 "숫자 모으기" 판단(D-073 원문)은 번호로 보고 거절했다(방송 제목이면 방송 시작 불가).
# D-079는 숫자 모으기를 어디에도 쓰지 않으므로 이 시나리오의 모든 이벤트는 읽기 오류·입력 오류가 아니고 평소대로 처리된다.
# 바뀌는 판단과 상관없는 부분(판정·표시 이름·정산)은 글 칸의 날짜를 "1/5"로 바꾼 변형(숫자를 모아도 8자리)이 이 커밋의 실제 코어로 그대로 통과한다.
# 기본 설정: 접수순(ARRIVAL), 대기 한도 5, 자동 승계, 배송비 4,000(무료 기준 없음), 확정마다 라벨 1 + 감사 1.
id: G-ENG-166
title: 전화번호가 아닌 숫자는 받는다 — 날짜·수량·금액이 섞인 방송 제목·상품 이름·문자찜 메모·사유·입금 메모, 010 없는 8자리, 영문이 섞인 구매자 ID
refs: [DAT-06, R-1, R-11, R-12, D-073, D-079]
broadcasts: []
events:
  # 제목: 숫자를 모으면 0105301000(10자리). 덩어리 01·05(빗금은 구분자) → '구피'에서 끊김, 30 → '종'에서 끊김, 1000 → 번호 아님
  - { at: "20:00:00", type: broadcast.start, b: b1, date: 2026-10-18, title: "01/05 구피 30종 1000원" }   # seq 1
  # 상품 이름: 모으면 0105325000(10자리). 덩어리 01·05 → '입고분'에서 끊김, 3, 25000 → 번호 아님
  - { at: "20:00:01", type: product.register, b: b1, no: 15, name: "01/05 입고분 3마리 25000", price: 25000 }   # seq 2
  - { at: "20:00:02", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }                        # seq 3
  # 채널 ID 안에 01012345678이 있어도 영문이 섞인 불투명 ID다(채팅의 ch는 원래 검사하지 않는다). A 15번 확정(1) (찜 1)
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: "UC01012345678abcdEFGH_-", nick: 홍길동, text: "15" }     # seq 4
  # ref r-20261018-0001: 덩어리 20261018·0001 → 01X로 시작하지 않음 → 번호 아님. 메모 1234-5678: 010 없는 8자리 → 번호 아님 → 메모로 받는다.
  # 전화번호 없음 → 새 문자 구매자 R, 표시 "문자찜(1234-5678)". 16번 확정(1) (찜 2)
  - { at: "20:00:10", type: sms, b: b1, ref: r-20261018-0001, no: 16, received: "20:00:09", memo: "1234-5678" }   # seq 5
  # 메모: 모으면 0105325000(10자리). 덩어리 01·05·3(빗금·공백은 구분자) → 01053(5자리) → '개'에서 끊김, 25·000 → 25000 → 번호 아님.
  # 새 문자 구매자 S2, 표시 "문자찜(01/05 3개 25,000원)". 16번은 R이 1등 → 대기 [S2] (찜 3)
  - { at: "20:00:11", type: sms, b: b1, ref: s2, no: 16, received: "20:00:10", memo: "01/05 3개 25,000원" }    # seq 6
  # 구매자 키는 영문이 섞인 ID → ID 칸 검사에 걸리지 않는다. 사유: 모으면 0105325000 → 번호 아님. 확정 잠금만(상태·효과 그대로)
  - { at: "20:00:20", type: host.confirm, b: b1, no: 15, buyer: "UC01012345678abcdEFGH_-", reason: "01/05 3개 25,000원 확인" }   # seq 7
  - { type: assert, expect: { broadcasts: { b1: { title: "01/05 구피 30종 1000원" } }, products: { b1/15: { winner: "UC01012345678abcdEFGH_-" }, b1/16: { winner: "sms:r-20261018-0001", waitlist: ["sms:s2"] } }, claimCount: 3 } }
  # 입금 메모: 모으면 0105215000(10자리). 덩어리 01·05·2 → '건'에서 끊김, 15·000 → 번호 아님.
  # A@10/18: 상품 25,000 + 배송비 4,000 = 29,000, 입금 29,000 → PAID
  - { at: "21:00:00", type: settlement.payment, buyer: "UC01012345678abcdEFGH_-", date: 2026-10-18, amount: 29000, memo: "01/05 2건 15,000원" }   # seq 8
  # 조정 사유: 모으면 0105310000(10자리). 덩어리 01·05·3 → '개'에서 끊김, 10·000 → 번호 아님.
  # R@10/18: 상품 5,000 + 배송비 4,000 + 조정 −1,000 = 8,000, 입금 없음 → UNPAID
  - { at: "21:00:01", type: settlement.adjust, buyer: "sms:r-20261018-0001", date: 2026-10-18, amount: -1000, reason: "01/05 3개 10,000원 할인" }   # seq 9
expect:
  broadcasts:
    b1: { date: 2026-10-18, title: "01/05 구피 30종 1000원", ended: false }
  products:
    b1/15: { status: SOLD, winner: "UC01012345678abcdEFGH_-", waitlist: [], conflict: false }
    b1/16: { status: SOLD, winner: "sms:r-20261018-0001", waitlist: ["sms:s2"], conflict: false }
  buyers:
    "UC01012345678abcdEFGH_-": { items: [b1/15], subtotal: 25000, display: 홍길동, phoneLast4: null }
    "sms:r-20261018-0001": { items: [b1/16], subtotal: 5000, display: "문자찜(1234-5678)", phoneLast4: null }
    "sms:s2": { items: [], subtotal: 0, display: "문자찜(01/05 3개 25,000원)", phoneLast4: null }
  settlements:
    "UC01012345678abcdEFGH_-@2026-10-18": { subtotal: 25000, shipping: 4000, adjustments: 0, total: 29000, payment: PAID }
    "sms:r-20261018-0001@2026-10-18": { subtotal: 5000, shipping: 4000, adjustments: -1000, total: 8000, payment: UNPAID }
  claims:
    - { product: b1/16, buyer: "sms:s2", status: WAITLISTED }
  claimCount: 3
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }    # A 15번(1)·R 16번(1)
