    - { product: b1/15, buyer: UC_B, status: CANCELLED }
    - { product: b1/15, buyer: UC_A, status: REJECTED, reason: WAITLIST_CLEARED }
  claimCount: 3
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }    # B(1)·C(2)
  pendingEffects:                                  # B(1)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_C, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_C, confirmVersion: 2 }
