# S04 보강 — S03b 감사에서 넘어온 규칙 (DOMAIN_RULES R-7 4·7, R-8, D-068, D-076, D-077). 기대값 계산은 각 줄 주석.
# - 취소 메시지("15 취소")는 주문이었던 메시지처럼 어느 번호로도 찜으로 바꾸지 않는다(SA-S03b-001, D-076).
# - 대기 한도 0이면 승계=묻기(ASK)는 자동 승계(AUTO)와 같다 — 자리가 비어 풀린 충돌 찜이 품절되지 않고 1등이 된다(RA-S03b-003, D-077).
#   재오픈(REOPEN)은 그대로 충돌 찜도 대기자와 함께 정리한다(D-068).
# 기본 설정: 접수순(ARRIVAL), 대기 한도 5, 자동 승계, 시청자 취소 REQUEST, 확정마다 라벨 1 + 감사 1.
id: G-ENG-163
title: 취소 메시지는 찜으로 바꾸지 않는다 — 찜이 없어 무시된 취소, 취소 요청이 된 취소 모두 어느 번호로도 아무 일도 없고, 언급 메시지는 그대로 바꿀 수 있다
refs: [ORD-01, ORD-07, ORD-12, R-3, R-7, R-8, D-054, D-062, D-076]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }   # seq 1
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }        # seq 2
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }         # seq 3. A 15번 확정(1) (찜 1)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15 취소" }    # seq 4. 취소 [15]. B는 15번 찜이 없다 → 무시(메시지만 기록)
  # m2는 취소 메시지 → 아무 일도 없다. (막지 않으면 B의 15번 찜이 순위 seq 4로 생겨 A(3) 뒤 대기 [B])
  - { at: "20:00:10", type: host.convertMessage, b: b1, msg: m2, no: 15 }                    # seq 5
  # 다른 번호로도 아무 일도 없다. (막지 않으면 B가 16번 1등 — 취소하겠다고 쓴 사람이 산 사람이 된다)
  - { at: "20:00:11", type: host.convertMessage, b: b1, msg: m2, no: 16 }                    # seq 6
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [] }, b1/16: { status: OPEN, winner: null } }, claimCount: 1 } }
  - { at: "20:00:20", type: chat, b: b1, id: m3, ch: UC_A, nick: 홍길동, text: "15번 취소요 ㅠㅠ" }   # seq 7. 취소 [15] → REQUEST: 취소 요청 (A, 15번)
  - { at: "20:00:21", type: host.convertMessage, b: b1, msg: m3, no: 16 }                    # seq 8. 취소 메시지 → 아무 일도 없다 (막지 않으면 A가 16번 1등)
  - { at: "20:00:30", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "16번 예뻐요" }  # seq 9. 주문도 취소도 아님(언급 [16])
  - { at: "20:00:40", type: host.convertMessage, b: b1, msg: m4, no: 16 }                    # seq 10. 언급 메시지 → C의 16번 찜(순위 seq 9), 빈 자리 → 확정(1) (찜 2)
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [], conflict: false }
    b1/16: { status: SOLD, winner: UC_C, waitlist: [], conflict: false }
  cancelRequests:                                  # 취소 메시지를 변환하려 했어도 요청은 그대로
    - { product: b1/15, buyer: UC_A }
  claims:
    - { product: b1/16, buyer: UC_C, status: CONFIRMED }
  claimCount: 2
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, VOID_LABEL: 0 }    # A 15번(1)·C 16번(1)
