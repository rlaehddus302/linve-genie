id: G-ENG-165
title: 대기 한도 0의 재오픈은 그대로 — 자리가 비어 풀린 충돌 찜도 대기자와 함께 정리되고(WAITLIST_CLEARED) 상품은 다시 판매 중이다
refs: [ORD-07, ORD-10, R-7, R-8, D-068, D-077]
settings: { cancel.succession: REOPEN, waitlist.max: 0 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }   # seq 1
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번이용ㅎ" }  # seq 2. 주문 아님(언급)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }         # seq 3. B 확정(1) (찜 1)
  - { at: "20:00:20", type: host.convertMessage, b: b1, msg: m1, no: 15 }                    # seq 4. A(2) < B(3) → 충돌 (찜 2)
  # B 취소 → 충돌이 먼저 풀림: A를 대기 자리에 [A] → 재오픈: 대기자 전원 WAITLIST_CLEARED → 15번 다시 판매 중
  - { at: "20:00:30", type: host.cancel, b: b1, no: 15, buyer: UC_B, reason: 구매자 요청 }     # seq 5
  - { type: assert, expect: { products: { b1/15: { status: OPEN, winner: null, waitlist: [], conflict: false } } } }
  - { at: "20:00:40", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }         # seq 6. C 확정(2) (찜 3)
expect:
  products:
    b1/15: { status: SOLD, winner: UC_C, waitlist: [], conflict: false }
