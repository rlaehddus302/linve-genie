id: G-ENG-067
title: 잠금 세부 — 방송자 확인·감사 게시 보고도 잠근다, 같은 보고 두 번은 한 번, 자동 취소는 잠금 전 확정·대기 찜에 바로 적용
refs: [ORD-07, R-7, R-8, R-9, R-13, INV-10, INV-11, D-043, D-044]
settings: { cancel.buyerChat: AUTO, print.autoOnConfirm: false }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: 성미인, price: 8000 }
  - { at: "20:00:03", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15 16 17" }  # A 세 상품 확정(각 확정버전 1). 자동 출력 꺼짐 → 감사만
  - { at: "20:00:04", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "17" }        # 17번 대기 [B]
  - { at: "20:00:05", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "17" }        # 17번 대기 [B, C]
  - { at: "20:00:10", type: host.confirm, b: b1, no: 15, buyer: UC_A }                       # 15번 A 잠금
  - { at: "20:00:11", type: effect.thanksSent, b: b1, no: 16, buyer: UC_A }                  # 16번 감사 완료 → 잠금
  - { at: "20:00:12", type: effect.thanksSent, b: b1, no: 16, buyer: UC_A }                  # 같은 효과 두 번째 보고 → 아무 일도 없음 (INV-11)
  - { at: "20:01:00", type: chat, b: b1, id: m4, ch: UC_A, nick: 홍길동, text: "15 취소" }   # 잠금 후 → 요청
  - { at: "20:01:01", type: chat, b: b1, id: m5, ch: UC_A, nick: 홍길동, text: "16 취소" }   # 잠금 후 → 요청
  - { at: "20:01:02", type: chat, b: b1, id: m6, ch: UC_C, nick: 이영희, text: "17 취소" }   # 대기 찜(잠금 없음) → 바로 취소 → 대기 [B]
  - { at: "20:01:03", type: chat, b: b1, id: m7, ch: UC_A, nick: 홍길동, text: "17 취소" }   # 잠금 전 확정 → 바로 취소 → 자동 승계: B 확정(확정버전 2)
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A }
    b1/16: { status: SOLD, winner: UC_A }
    b1/17: { status: SOLD, winner: UC_B, waitlist: [] }
  claims:
    - { product: b1/17, buyer: UC_A, status: CANCELLED }
    - { product: b1/17, buyer: UC_C, status: CANCELLED }
  cancelRequests: [{ product: b1/15, buyer: UC_A }, { product: b1/16, buyer: UC_A }]
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 0, VOID_LABEL: 0 }   # A15·A16·A17·B17
  pendingEffects:    # A16은 완료, A17은 취소됨
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/17, buyer: UC_B, confirmVersion: 2 }
