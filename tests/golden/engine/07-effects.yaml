# S02 보강 — 효과 세부 (R-13, D-044). 기대값 계산은 각 줄 주석.
id: G-ENG-064
title: 감사 문구 — 품종이 없으면 자리째 빼고, 가격은 세 자리 쉼표 + 원, 이름은 확정되는 순간의 닉네임
refs: [YT-04, R-13, R-11, D-044]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: "", price: 8000 }          # 품종 미입력 (PRD-01 AC3)
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 금황성, price: 1000000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: 미니마, price: 800 }
  - { at: "20:00:03", type: product.register, b: b1, no: 18, name: 방울복랑 금, price: 15000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }   # "15번 8,000원 홍길동님 …" (빈 품종과 그 뒤 공백을 뺀다)
  - { at: "20:00:11", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16" }   # 1,000,000원
  - { at: "20:00:12", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "17" }   # 800원 (쉼표 없음)
  - { at: "20:00:13", type: chat, b: b1, id: m4, ch: UC_A, nick: 홍길동, text: "18" }   # 품종 안 공백은 그대로
  - { at: "20:00:14", type: chat, b: b1, id: m5, ch: UC_D, nick: 박민수, text: "17" }   # 17번 대기
  - { at: "20:00:20", type: chat, b: b1, id: m6, ch: UC_D, nick: 민수맘, text: "안녕하세요" }  # 닉네임이 바뀜
  - { at: "20:01:00", type: host.cancel, b: b1, no: 17, buyer: UC_C, reason: 구매자 요청 }  # D 승계 → 이름은 지금 닉네임 '민수맘'
expect:
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 8,000원 홍길동님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_B, text: "16번 금황성 1,000,000원 김철수님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/17, buyer: UC_C, text: "17번 미니마 800원 이영희님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/18, buyer: UC_A, text: "18번 방울복랑 금 15,000원 홍길동님 구매 감사합니다" }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/17, buyer: UC_D, text: "17번 미니마 800원 민수맘님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 5 }
