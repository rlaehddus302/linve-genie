id: G-ENG-065
title: 실시간 채팅 감사를 끄고 영상 댓글(판매마다)을 켜면 영상 댓글만, 묶음 시간은 엔진 효과를 바꾸지 않는다
refs: [YT-04, YT-05, YT-07, R-13, D-044]
settings: { thanks.liveChat: false, thanks.videoComment: PER_SALE, thanks.batchWindowSec: 30 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:03", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16" }   # 30초 안이지만 엔진은 판매마다 따로 낸다(묶음은 outbox, S11)
expect:
  effects:
    - { kind: POST_THANKS, target: VIDEO_COMMENT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다" }
    - { kind: POST_THANKS, target: VIDEO_COMMENT, product: b1/16, buyer: UC_B, text: "16번 라울 5,000원 김철수님 구매 감사합니다" }
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2, NOTIFY: 0 }
  pendingEffects:    # 실시간 채팅 감사 없음, 화면 알림(NOTIFY) 없음
    - { kind: POST_THANKS, target: VIDEO_COMMENT, product: b1/15, buyer: UC_A, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A, confirmVersion: 1 }
    - { kind: POST_THANKS, target: VIDEO_COMMENT, product: b1/16, buyer: UC_B, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: UC_B, confirmVersion: 1 }
