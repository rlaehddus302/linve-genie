id: G-ENG-402
title: 수집이 끊겼다 이어받은 채팅 — 도착한 때(접수순)로 판정하고, 겹쳐 다시 받은 메시지는 아무 일도 없다
refs: [YT-03, ORD-02, ORD-09, R-4, R-6, INV-3, INV-12, D-003, D-045, D-Y04]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:00", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "16", publishedAt: "20:00:04" }   # A 16번 1등
  # 20:00:06 ~ 20:00:39 수집이 끊김(유튜브 연결 끊김·서버 재시작). 그동안 보조자가 문자찜을 넣는다
  - { at: "20:00:20", type: sms, b: b1, ref: s1, no: 15, received: "20:00:15" }   # 접수순 → 먼저 도착한 s1이 15번 1등
  # 20:00:40 이어받기 지점(마지막으로 기록을 마친 묶음 뒤 nextPageToken)부터 다시 받는다. 겹친 m1이 한 번 더 온다
  - { at: "20:00:40", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "16", publishedAt: "20:00:04" }   # 재수신 사본 → 아무 일도 없음 (INV-3)
  # B는 문자 수신 시각(20:00:15)보다 먼저(20:00:10) 썼지만 접수순은 도착 순서(seq)로 정한다 → s1이 1등 그대로, B는 대기 1순위 (D-003, R-6 ARRIVAL)
  - { at: "20:00:40", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15", publishedAt: "20:00:10" }
  - { at: "20:00:40", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "16", publishedAt: "20:00:12" }   # 16번 대기 1순위
  - { at: "20:00:41", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "16", publishedAt: "20:00:12" }   # 한 번 더 겹침 → 아무 일도 없음
  - { at: "20:00:42", type: chat, b: b1, id: m4, ch: UC_B, nick: 김철수, text: "15", publishedAt: "20:00:41" }   # 새 메시지지만 같은 사람 반복(R-4 4번 줄) → 찜 없음
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_B], conflict: false }
    b1/16: { status: SOLD, winner: UC_A, waitlist: [UC_C], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_B, status: WAITLISTED }
    - { product: b1/16, buyer: UC_C, status: WAITLISTED }
  claimCount: 4                                        # A16 · s1 15 · B15 · C16 (사본 둘과 같은 사람 반복은 찜을 만들지 않는다)
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2 }   # 확정 둘(A16, s1 15)
  buyers:
    UC_A: { items: [b1/16], subtotal: 5000 }
    "sms:s1": { items: [b1/15], subtotal: 10000 }
    UC_B: { items: [], subtotal: 0 }
