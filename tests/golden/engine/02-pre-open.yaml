id: G-ENG-013
title: 일시 중지(HOLD) 상품은 찜을 받지 않는다
refs: [PRD-04, R-4]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.hold, b: b1, no: 15 }
  - { at: "20:00:02", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:30", type: product.open, b: b1, no: 15 }
  - { at: "20:00:31", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [] }
  claims:
    - { product: b1/15, buyer: UC_A, status: REJECTED, reason: NOT_ON_SALE }
