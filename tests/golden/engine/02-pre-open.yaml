id: G-ENG-010
title: 등록보다 먼저 온 찜은 보류했다가 등록 순간 순서대로 판정
refs: [ORD-06, R-5]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:07", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }
  - { type: assert, expect: { pending: { b1/15: [UC_A, UC_B] }, products: { b1/15: { exists: false } } } }
  - { at: "20:00:12", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:13", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_B, UC_C] }
  pending: { b1/15: [] }
