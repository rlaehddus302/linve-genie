  - { at: "20:00:14", type: product.update, b: b1, no: 96, price: 20000, applyTo: UNPAID_CLAIMS }   # D 찜 50,000 → 20,000. 게시된 실시간 채팅 글은 그대로, 아직인 영상 댓글만 20,000원
