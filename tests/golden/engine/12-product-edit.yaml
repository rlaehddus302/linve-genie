  - { at: "20:00:04", type: product.update, b: b1, no: 15, name: 라울, price: 7000, applyTo: UNPAID_CLAIMS }   # B 찜 10,000 → 7,000, 게시 전 문구 "15번 라울 7,000원 김철수님 …"
