    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 라울 7,000원 김철수님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 2 }
