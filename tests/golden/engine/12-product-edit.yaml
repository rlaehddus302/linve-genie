id: G-ENG-133
title: 재고를 늘리면 충돌이 먼저 풀려 순위대로 대기에 들어간 뒤 늘린 자리를 채운다, 일시 중지 상품도 재고를 늘리면 대기자가 확정된다
refs: [PRD-02, ORD-10, ORD-11, R-2, R-7, R-10, D-053, D-055]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }    # A 확정(1), t 10
  - { at: "20:00:11", type: host.confirm, b: b1, no: 15, buyer: UC_A }                    # A 잠금
  - { at: "20:00:12", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }    # 대기 [B(12)]
  - { at: "20:00:20", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }          # t 05 < A, 잠금 후 → 충돌
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [UC_B], conflict: true } } } }
  # 재고 1→2: 자리가 생김 → 충돌이 먼저 풀림: s1(05)을 대기 자리에 → B(12)보다 앞섬 → [s1, B]. 늘린 1자리 → 대기 1순위 s1 확정(2)
  - { at: "20:00:30", type: product.update, b: b1, no: 15, stock: 2 }
  - { at: "20:00:40", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "16" }    # C 16번 확정(1)
  - { at: "20:00:41", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "16" }    # 대기 [D]
  - { at: "20:00:42", type: product.hold, b: b1, no: 16 }
  - { at: "20:00:43", type: product.update, b: b1, no: 16, stock: 2 }                    # HOLD여도 늘린 자리 → D 확정(2). 상태는 HOLD 그대로
expect:
  products:
    b1/15: { status: SOLD, winners: [UC_A, "sms:s1"], waitlist: [UC_B], conflict: false }
    b1/16: { status: HOLD, winners: [UC_C, UC_D], waitlist: [] }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", text: "15번 핑크프릴 10,000원 문자찜님 구매 감사합니다", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_D, text: "16번 라울 5,000원 박민수님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4 }
