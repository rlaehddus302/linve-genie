id: G-ENG-131
title: 재고 변경 — 확정 수보다 줄이면 이벤트 전체(가격 포함)가 아무 일도 없고, 늘리면 늘린 수만큼만 대기 1순위부터 확정(승계 결정 필요 자리는 남김)
refs: [PRD-02, ORD-07, ORD-11, R-8, R-10, D-041, D-055]
settings: { cancel.succession: ASK }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000, stock: 2 }
  - { at: "20:00:01", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }    # A 확정(1)
  - { at: "20:00:02", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }    # B 확정(2) → SOLD
  - { at: "20:00:03", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }    # 대기 [C]
  - { at: "20:00:04", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "15" }    # 대기 [C, D]
  - { at: "20:00:05", type: chat, b: b1, id: m5, ch: UC_E, nick: 최영수, text: "15" }    # 대기 [C, D, E]
  - { at: "20:01:00", type: product.update, b: b1, no: 15, price: 12000, stock: 1 }      # 재고 1 < 확정 2 → 전체 거부: 가격도 그대로
  - { type: assert, expect: { products: { b1/15: { price: 10000, priceHistory: [], winners: [UC_A, UC_B], waitlist: [UC_C, UC_D, UC_E] } } } }
  - { at: "20:01:10", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 착오 }      # ASK, 대기 있음 → 승계 결정 필요. 1등 [B], 빈 자리 1
  # 재고 2→3: 늘린 수 1만큼 대기 1순위 C 확정(3). 1등 [B, C], 빈 자리 1, 대기 [D, E] → 승계 결정 필요 표시는 남는다
  - { at: "20:01:20", type: product.update, b: b1, no: 15, stock: 3 }
  - { type: assert, expect: { products: { b1/15: { status: OPEN, winners: [UC_B, UC_C], waitlist: [UC_D, UC_E] } } } }
  - { at: "20:01:30", type: chat, b: b1, id: m6, ch: UC_F, nick: 정하나, text: "15" }    # 승계 결정 필요 → R-4 5번 줄 → 대기 [D, E, F] (빈 자리가 있어도 확정 아님)
  - { at: "20:01:40", type: product.update, b: b1, no: 15, stock: 2 }                    # 재고 3→2 = 확정 수 2 → 받음 → SOLD, 표시 사라짐(확정 수 = 재고)
  - { at: "20:01:50", type: chat, b: b1, id: m7, ch: UC_G, nick: 강두리, text: "15" }    # 표시 없음, 자리 다 참 → R-4 7번 줄 → 대기 [D, E, F, G]
expect:
  products:
    b1/15: { status: SOLD, winners: [UC_B, UC_C], waitlist: [UC_D, UC_E, UC_F, UC_G], price: 10000, priceHistory: [] }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
  pendingEffects:                                  # A(1)의 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_B, confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_C, confirmVersion: 3 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_C, confirmVersion: 3 }
---
id: G-ENG-132
title: 번호 변경 — 있는 번호로는 거부, 잠기고 입금된 찜도 번호 변경 거절(라벨 폐기·과입금), 확정버전은 이어서, READY·HOLD 상품은 공개 때 판정, 원래 번호의 보류 찜은 그대로
refs: [PRD-02, R-5, R-10, R-12, R-13, D-056]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 51, name: 성미인, price: 8000 }          # 50을 51로 잘못 입력
  - { at: "20:00:03", type: product.register, b: b1, no: 20, name: 미니마, price: 3000, status: READY }
  - { at: "20:00:04", type: product.register, b: b1, no: 30, name: 화이트, price: 4000 }
  - { at: "20:00:04", type: product.hold, b: b1, no: 30 }                                          # 30번 일시 중지
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "51" }              # A 51번 확정(1)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "51" }              # 대기 [B]
  - { at: "20:00:07", type: effect.labelPrinted, b: b1, no: 51, buyer: UC_A }                       # A 라벨 출력됨(잠금)
  - { at: "20:00:08", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 12000 }     # A 묶음 8,000 + 4,000 = 12,000 입금
  - { at: "20:00:10", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "50" }              # 50번 없음 → 보류 (at 20:00:10)
  - { at: "20:00:11", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "21" }              # 21번 없음 → 보류 (at 20:00:11)
  - { at: "20:00:12", type: chat, b: b1, id: m5, ch: UC_E, nick: 최영수, text: "20" }              # 20번 READY → 보류
  - { at: "20:00:13", type: chat, b: b1, id: m6, ch: UC_F, nick: 정하나, text: "31" }              # 31번 없음 → 보류 (at 20:00:13)
  - { at: "20:00:20", type: product.renumber, b: b1, from: 51, to: 15 }                             # 15번이 이미 있음 → 거부(아무 일도 없음)
  - { at: "20:00:21", type: product.renumber, b: b1, from: 16, to: 16 }                             # 같은 번호 → 아무 일도 없음
  - { type: assert, expect: { products: { b1/51: { winner: UC_A, waitlist: [UC_B] }, b1/15: { winner: null }, b1/16: { winner: null } } } }
  # 51→50: A(잠금·입금과 상관없이)·B → REJECTED(RENUMBERED). A 라벨 출력됨 → VOID_LABEL(b1/51, 확정버전 1), A 감사는 취소. 승계 없음
  # 상품은 50이 되고(판매 중) T=20:00:30으로 R-5: 시작 20:00:00, C의 at 20:00:10 ≥ → C 확정. 확정버전은 이어서 2
  - { at: "20:00:30", type: product.renumber, b: b1, from: 51, to: 50 }
  # 20→21: READY 상품 → 20번에 확정·대기 찜 없음. 21이 되지만 공개 전이라 R-5 없음 → D는 계속 보류. E는 20번 보류로 남음
  - { at: "20:00:40", type: product.renumber, b: b1, from: 20, to: 21 }
  - { type: assert, expect: { products: { b1/21: { status: READY }, b1/20: { exists: false } }, pending: { b1/20: [UC_E], b1/21: [UC_D] } } }
  - { at: "20:00:41", type: product.open, b: b1, no: 21 }          # T=20:00:41 → 시작 20:00:11. D의 at 20:00:11 = 경계 포함 → D 확정(1)
  # 30→31: HOLD 상품 → R-5 없음 → F는 계속 보류 (판정했다면 HOLD라 NOT_ON_SALE로 끝났다)
  - { at: "20:00:42", type: product.renumber, b: b1, from: 30, to: 31 }
  - { type: assert, expect: { products: { b1/31: { status: HOLD } }, pending: { b1/31: [UC_F] } } }
  - { at: "20:00:43", type: product.open, b: b1, no: 31 }          # T=20:00:43 → 시작 20:00:13. F의 at 20:00:13 = 경계 포함 → F 확정(1)
expect:
  products:
    b1/50: { status: SOLD, winner: UC_C, waitlist: [], price: 8000 }
    b1/51: { exists: false }
    b1/15: { status: OPEN, winner: null }
    b1/16: { status: OPEN, winner: null }
    b1/21: { status: SOLD, winner: UC_D }
    b1/20: { exists: false }
    b1/31: { status: SOLD, winner: UC_F }
    b1/30: { exists: false }
  claims:                                          # 번호를 바꾼 상품의 찜은 새 번호로 찾는다
    - { product: b1/50, buyer: UC_A, status: REJECTED, reason: RENUMBERED }
    - { product: b1/50, buyer: UC_B, status: REJECTED, reason: RENUMBERED }
    - { product: b1/50, buyer: UC_C, status: CONFIRMED }
    - { product: b1/21, buyer: UC_D, status: CONFIRMED }
    - { product: b1/20, buyer: UC_E, status: PENDING }
    - { product: b1/31, buyer: UC_F, status: CONFIRMED }
  pending: { b1/20: [UC_E], b1/21: [], b1/50: [], b1/31: [] }
  settlements:
    UC_A@2026-10-18: { subtotal: 0, shipping: 0, total: 0, refundDue: 12000, payment: OVERPAID }   # 품목 없음, 받은 12,000 → 환불 필요
  effects:                                         # 효과의 상품 키·문구는 나온 때의 것. 폐기는 51번 라벨
    - { kind: VOID_LABEL, product: b1/51, buyer: UC_A, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/50, buyer: UC_C, text: "50번 성미인 8,000원 이영희님 구매 감사합니다", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/21, buyer: UC_D, text: "21번 미니마 3,000원 박민수님 구매 감사합니다", confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/31, buyer: UC_F, text: "31번 화이트 4,000원 정하나님 구매 감사합니다", confirmVersion: 1 }
  pendingEffects:
    - { kind: VOID_LABEL, product: b1/51, buyer: UC_A, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/50, buyer: UC_C, confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/50, buyer: UC_C, confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/21, buyer: UC_D, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/21, buyer: UC_D, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/31, buyer: UC_F, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/31, buyer: UC_F, confirmVersion: 1 }
