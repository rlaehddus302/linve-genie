# S03 보강 — 상품 수정·번호 변경 (PRD-02, R-10, D-055, D-056). 기대값 계산은 각 줄 주석.
# 기본 설정: 접수순, 대기 한도 5, 자동 승계, 배송비 4,000, 확정마다 라벨 1 + 감사 1.
id: G-ENG-130
title: 가격 변경 — 같은 값은 이력 없음, 입금 전 찜에 적용은 받은 금액이 있는 묶음의 찜을 건드리지 않음, 대기 찜은 확정될 때의 새 가격
refs: [PRD-02, R-10, R-12, INV-5, D-013, D-055]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: 성미인, price: 8000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15 16" }   # A 15번(10,000)·16번(5,000) 확정
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "17" }      # B 17번(8,000) 확정
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }      # 15번 대기 [C]
  - { at: "20:05:00", type: settlement.payment, buyer: UC_B, date: 2026-10-18, amount: 12000 }   # B 묶음 8,000 + 4,000 = 12,000 전액 → 받은 금액 12,000
  - { at: "20:10:00", type: product.update, b: b1, no: 15, price: 10000 }                         # 같은 값 → 바뀐 것 없음(이력 없음)
  - { at: "20:10:01", type: product.update, b: b1, no: 15, price: 12000 }                         # 기본 NEW_ONLY → 이력 10,000→12,000, A의 스냅샷 10,000 그대로
  - { at: "20:10:02", type: product.update, b: b1, no: 17, price: 9000, applyTo: UNPAID_CLAIMS }  # B 묶음 받은 금액 12,000 > 0 → 입금 전 아님 → B 스냅샷 8,000 그대로
  - { at: "20:10:03", type: product.update, b: b1, no: 16, price: 6000, applyTo: UNPAID_CLAIMS }  # A 묶음 받은 금액 0 → A의 16번 스냅샷 5,000 → 6,000
  - { type: assert, expect: { buyers: { UC_A: { subtotal: 16000 }, UC_B: { subtotal: 8000 } }, products: { b1/15: { price: 12000, priceHistory: [{ from: 10000, to: 12000 }] } } } }   # A = 10,000 + 6,000
  # A의 15번 취소 → 자동 승계: C 확정(2). C는 대기 중이라 스냅샷이 없었다 → 확정 때 상품 가격 12,000
  - { at: "20:20:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }
expect:
  products:
    b1/15: { price: 12000, priceHistory: [{ from: 10000, to: 12000 }], winner: UC_C, waitlist: [] }
    b1/16: { price: 6000, priceHistory: [{ from: 5000, to: 6000 }], winner: UC_A }
    b1/17: { price: 9000, priceHistory: [{ from: 8000, to: 9000 }], winner: UC_B }
  buyers:
    UC_A: { items: [b1/16], subtotal: 6000 }
    UC_B: { items: [b1/17], subtotal: 8000 }
    UC_C: { items: [b1/15], subtotal: 12000 }
  settlements:
    UC_A@2026-10-18: { subtotal: 6000, shipping: 4000, total: 10000, payment: UNPAID }
    UC_B@2026-10-18: { subtotal: 8000, shipping: 4000, total: 12000, payment: PAID }      # 가격을 바꾸지 않았으므로 입금 완료 그대로
    UC_C@2026-10-18: { subtotal: 12000, shipping: 4000, total: 16000, payment: UNPAID }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_C, text: "15번 핑크프릴 12,000원 이영희님 구매 감사합니다", confirmVersion: 2 }
