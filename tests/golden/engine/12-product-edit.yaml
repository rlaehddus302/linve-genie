  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "94" }      # B 94번 30,000 확정
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "95" }      # C 95번 60,000 확정
  - { at: "20:00:08", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "96" }      # D 96번 50,000 확정
