# 라이브 복기(2026-11-12) 보강 — 고침 따라가기(thanks.followEdits)를 켠 방송에서 아직 게시되지 않은 감사 문구는 품종 고침과 찜에 적용된 가격 고침을 따라간다 (R-13·R-10, D-RETRO-02).
# 켜지 않은 방송은 지금 그대로다(이미 나온 효과의 문구는 바뀌지 않는다 — G-ENG-137, 옛 방송 재생 D-072).
id: G-ENG-134
title: 품종 고침 — 아직 게시되지 않은 감사 문구는 새 품종으로, 이미 게시된 감사 문구는 그대로. 구매자 이름은 효과가 나온 때의 닉네임 그대로
refs: [PRD-02, YT-04, R-10, R-13, D-044, D-RETRO-02]
settings: { print.autoOnConfirm: false, thanks.followEdits: true }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 상광, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 특이종, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: "", price: 8000 }       # 품종 없이 등록
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }      # A 15번 확정 → "15번 상광 10,000원 홍길동님 …"
