id: G-ENG-117
title: 충돌은 상품마다 하나 — 충돌 중에 더 앞선 찜이 와도 대기 자리로. 1등이 취소되면 충돌이 먼저 풀려 순위대로 대기에 들어간 뒤 자동 승계
refs: [ORD-07, ORD-09, ORD-10, R-7, R-8, D-053]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }       # A 확정(1), t 10
  - { at: "20:00:11", type: host.confirm, b: b1, no: 15, buyer: UC_A }                       # A 잠금
  - { at: "20:00:20", type: sms, b: b1, ref: s1, no: 15, received: "20:00:08" }             # t 08 < A, 잠금 후 → 충돌
  # s2 t 03: A보다 앞서지만 이미 충돌 중 → 역전·새 충돌 없이 대기 자리 → [s2]
  - { at: "20:00:30", type: sms, b: b1, ref: s2, no: 15, received: "20:00:03" }
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: ["sms:s2"], conflict: true } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFLICT }, { product: b1/15, buyer: "sms:s2", status: WAITLISTED }] } }
  - { at: "20:00:40", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }       # t 40 → 대기 [s2, B]
  # A 취소 → 자리가 빔 → 충돌이 먼저 풀림: s1(08)을 대기 자리에 — 앞서는 대기자 s2(03) 바로 뒤 → [s2, s1, B]
  # 그다음 자동 승계: 대기 1순위 s2 확정(2) → 대기 [s1, B]
  - { at: "20:01:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s2", waitlist: ["sms:s1", UC_B], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
    - { product: b1/15, buyer: "sms:s1", status: WAITLISTED }
  pendingEffects:                                  # A(1)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s2", confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s2", confirmVersion: 2 }
