id: G-ENG-122
title: 대기 1순위에 밀려난 1등(배정 찜)이 있어 대기열이 순위대로가 아니어도, 늦게 온 찜은 자기보다 앞서는 대기자 중 가장 뒤 바로 뒤에 들어간다
refs: [ORD-09, ORD-12, R-4, R-6, R-7, R-9, D-053]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # A 확정(1), t 10
  - { at: "20:00:30", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }        # 대기 [B(30)]
  - { at: "20:00:35", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "안녕하세요" }  # C 기록
  # C에게 배정, A는 취소로 교체 → C 배정 찜(순위 = 조치 at 20:01:00) 확정(2). 대기 [B]
  - { at: "20:01:00", type: host.assign, b: b1, no: 15, buyer: UC_C, reason: 전화 주문, replace: UC_A, replaceTo: CANCEL }
  - { at: "20:01:10", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }              # t 05 < C(60), C는 배정 찜 → 충돌
  # 바꾸기: s1 확정(3), 가장 뒤 1등 C → 대기 1순위 → [C(60), B(30)] (순위대로가 아니다)
  - { at: "20:01:20", type: host.resolveConflict, b: b1, no: 15, decision: SWITCH }
  - { type: assert, expect: { products: { b1/15: { winner: "sms:s1", waitlist: [UC_C, UC_B], conflict: false } } } }
  # s2 t 40: 1등 s1(05)보다 뒤 → 대기 자리. s2보다 앞서는 대기자 = B(30) (C(60)는 뒤) → B 바로 뒤 → [C, B, s2]
  - { at: "20:01:30", type: sms, b: b1, ref: s2, no: 15, received: "20:00:40" }
expect:
