id: G-ENG-112
title: 늦게 온 선순위 찜은 대기열의 맞는 자리(자기보다 앞서는 대기자 중 가장 뒤 바로 뒤)에 끼워 넣고, 넘치면 맨 끝 대기자가 품절
refs: [ORD-04, ORD-09, R-4, R-7, INV-7, D-053]
settings: { contention.policy: RECEIVED_TIME, waitlist.max: 2 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }    # A 확정, t 20:00:10 (찜 1)
  - { at: "20:00:30", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }    # 대기 [B(30)] (찜 2)
  - { at: "20:00:40", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }    # 대기 [B(30), C(40)] (찜 3)
  # s1 t 20:00:35: A(10)보다 뒤 → 대기 자리. 앞서는 대기자 B(30) → B 바로 뒤 → [B, s1, C] → 한도 2 초과 → 맨 끝 C 품절 (찜 4)
  - { at: "20:00:50", type: sms, b: b1, ref: s1, no: 15, received: "20:00:35" }
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [UC_B, "sms:s1"] } }, claims: [{ product: b1/15, buyer: UC_C, status: REJECTED, reason: SOLD_OUT }] } }
  # s2 t 20:00:45: 앞서는 대기자 B(30)·s1(35) → s1 뒤 → [B, s1, s2] → 맨 끝 s2 자신이 품절 (찜 5)
  - { at: "20:00:55", type: sms, b: b1, ref: s2, no: 15, received: "20:00:45" }
  # s3 t 20:00:20: A(10)보다 뒤. 앞서는 대기자 없음 → 1순위 → [s3, B, s1] → 맨 끝 s1 품절 (찜 6)
  - { at: "20:01:00", type: sms, b: b1, ref: s3, no: 15, received: "20:00:20" }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: ["sms:s3", UC_B], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_C, status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: "sms:s1", status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: "sms:s2", status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: "sms:s3", status: WAITLISTED }
  claimCount: 6
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1 }
---
id: G-ENG-113
title: 재고 2 — 순위가 가장 뒤인 1등과 비교해 역전하고, 밀려난 1등은 대기 1순위. 앞선 1등의 잠금은 상관없다
refs: [ORD-09, ORD-11, R-6, R-7, R-13, D-053]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000, stock: 2 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }    # A 확정(1), t 10
  - { at: "20:00:20", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }    # B 확정(2), t 20 → SOLD
  - { at: "20:00:30", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15" }    # 대기 [C]
  # s1 t 15. 가장 뒤 1등 = B(20). s1이 앞섬, B 잠금 전 → 역전: B 효과 취소, s1 확정(3), B → 대기 1순위 [B, C]
  - { at: "20:00:40", type: sms, b: b1, ref: s1, no: 15, received: "20:00:15" }
  - { type: assert, expect: { products: { b1/15: { winners: [UC_A, "sms:s1"], waitlist: [UC_B, UC_C] } } } }
  - { at: "20:00:50", type: effect.thanksSent, b: b1, no: 15, buyer: UC_A }              # A 잠금 (비교 대상이 아니므로 상관없다)
  # s2 t 05. 1등 A(10)·s1(15) 중 가장 뒤 = s1. s2가 앞섬, s1 잠금 전 → 역전: s2 확정(4), s1 → 대기 1순위 [s1, B, C]
  - { at: "20:01:00", type: sms, b: b1, ref: s2, no: 15, received: "20:00:05" }
expect:
  products:
    b1/15: { status: SOLD, winners: [UC_A, "sms:s2"], waitlist: ["sms:s1", UC_B, UC_C], conflict: false }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", text: "15번 핑크프릴 10,000원 문자찜님 구매 감사합니다", confirmVersion: 3 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s2", text: "15번 핑크프릴 10,000원 문자찜님 구매 감사합니다", confirmVersion: 4 }
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4, VOID_LABEL: 0 }
  pendingEffects:                                  # A 감사는 완료, A 라벨은 남음. B(2)·s1(3)은 취소
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: UC_A, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s2", confirmVersion: 4 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s2", confirmVersion: 4 }
---
id: G-ENG-114
title: 역전으로 밀려난 1등 — 대기가 넘치면 맨 끝 대기자가 품절, 차단 중이면 대기에 넣지 않고 차단 거절(넘침 정리도 없음)
refs: [ORD-09, ORD-12, R-4, R-7, R-9, D-049, D-053]
settings: { contention.policy: RECEIVED_TIME, waitlist.max: 1 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }    # A 15번 확정
  - { at: "20:00:11", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }    # 대기 [B]
  - { at: "20:00:12", type: chat, b: b1, id: m3, ch: UC_X, nick: 장난꾼, text: "16" }    # X 16번 확정
  - { at: "20:00:13", type: chat, b: b1, id: m4, ch: UC_Y, nick: 이영희, text: "16" }    # 대기 [Y]
  - { at: "20:00:20", type: host.blockBuyer, buyer: UC_X, reason: 반복 장난 }              # X의 확정 찜은 그대로
  # s1 t 05 < A(10) → 역전: s1 확정(2), A → 대기 1순위 [A, B] → 한도 1 초과 → 맨 끝 B 품절 → [A]
  - { at: "20:00:30", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }
  # s2 t 06 < X(12) → 역전: s2 확정(2), X는 차단 중 → 대기에 넣지 않고 REJECTED(BLOCKED). 대기 [Y] 그대로
  - { at: "20:00:31", type: sms, b: b1, ref: s2, no: 16, received: "20:00:06" }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_A] }
    b1/16: { status: SOLD, winner: "sms:s2", waitlist: [UC_Y] }
  claims:
    - { product: b1/15, buyer: UC_A, status: WAITLISTED }
    - { product: b1/15, buyer: UC_B, status: REJECTED, reason: SOLD_OUT }
    - { product: b1/16, buyer: UC_X, status: REJECTED, reason: BLOCKED }
    - { product: b1/16, buyer: UC_Y, status: WAITLISTED }
  buyers:
    UC_X: { items: [], subtotal: 0 }
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4, VOID_LABEL: 0 }
---
id: G-ENG-115
title: 입금 기록이 있는 1등은 잠금 후 — 더 빠른 문자찜은 충돌, 바꾸기를 고르면 입금한 사람은 대기로 가고 정산은 과입금
refs: [ORD-09, ORD-10, R-7, R-12, STL-07, STL-09, INV-10, D-053, D-058]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }               # A 확정(1). 묶음 10,000 + 4,000 = 14,000
  - { at: "20:05:00", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 14000 }       # 받은 금액 14,000 > 0 → A 잠금
  - { at: "20:06:00", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }                     # t 05 < A(10), A 잠금 후 → 충돌
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, conflict: true } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFLICT }], settlements: { UC_A@2026-10-18: { total: 14000, payment: PAID } } } }
  # 바꾸기: s1 확정(2), A 확정이 풀림(미실행 라벨·감사 취소, 출력 전이라 폐기 없음) → A 대기 1순위
  - { at: "20:07:00", type: host.resolveConflict, b: b1, no: 15, decision: SWITCH, reason: 문자가 먼저 }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_A], conflict: false }
  settlements:
    UC_A@2026-10-18: { subtotal: 0, shipping: 0, adjustments: 0, total: 0, refundDue: 14000, payment: OVERPAID }   # 품목 없음, 받은 14,000 → 전액 환불 필요
    "sms:s1@2026-10-18": { subtotal: 10000, shipping: 4000, total: 14000, payment: UNPAID }
  pendingEffects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
  effectCounts: { VOID_LABEL: 0 }
---
id: G-ENG-116
title: 직접 배정한 1등은 늦게 온 선순위 문자찜이 자동으로 밀어내지 않는다(잠금 전이어도 충돌), 유지를 고르면 순위대로 대기
refs: [ORD-09, ORD-10, ORD-12, R-6, R-7, R-9, D-053]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번 살게요" }   # 주문 아님(언급). A는 구매자로 기록
  - { at: "20:00:20", type: host.assign, b: b1, no: 15, buyer: UC_A, reason: 채팅 확인 }          # 배정 찜, 순위 재료 = 이 조치의 at 20:00:20 → 확정(1)
  - { at: "20:00:30", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }              # t 30 → 대기 [B]
  # s1 t 10 < A(20). A는 배정 찜 → R-7에서 늘 잠금 후 → 충돌 (출력·게시·확인·입금 보고는 없다)
  - { at: "20:00:40", type: sms, b: b1, ref: s1, no: 15, received: "20:00:10" }
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: [UC_B], conflict: true } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFLICT }] } }
  # 유지: s1을 대기 자리에. 대기 [B(30)] 중 s1(10)보다 앞서는 대기자 없음 → 1순위 → [s1, B]
  - { at: "20:01:00", type: host.resolveConflict, b: b1, no: 15, decision: KEEP }
expect:
  products:
