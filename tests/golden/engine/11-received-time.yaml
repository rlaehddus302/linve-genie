    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_C, UC_B, "sms:s2"], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_A, status: CANCELLED }
    - { product: b1/15, buyer: UC_C, status: WAITLISTED }
  pendingEffects:                                  # A(1)·C(2)의 미실행 효과는 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", confirmVersion: 3 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s1", confirmVersion: 3 }
