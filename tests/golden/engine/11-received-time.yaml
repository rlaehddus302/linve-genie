id: G-ENG-119
title: 유지를 골랐는데 대기가 차 있으면 맨 끝 대기자가 품절, 충돌 찜도 활성 찜(같은 구매자 다시 입력은 찜 없음), 충돌 없는 상품의 결정은 아무 일도 없다
refs: [ORD-10, R-4, R-7, INV-2, D-039, D-053]
settings: { contention.policy: RECEIVED_TIME, waitlist.max: 1 }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }        # A 확정 (찜 1)
  - { at: "20:00:11", type: effect.labelPrinted, b: b1, no: 15, buyer: UC_A }                 # A 잠금
  - { at: "20:00:20", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15" }        # 대기 [B] (찜 2)
  - { at: "20:00:30", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }              # t 05 < A, 잠금 후 → 충돌 (찜 3)
  - { at: "20:00:35", type: sms, b: b1, ref: s2, no: 15, received: "20:00:06", buyer: "sms:s1" }   # 지정 = s1의 구매자. 충돌 찜이 활성 → 새 찜 없음
  # 유지: s1(05)을 대기 자리에 → B(20)보다 앞섬 → 1순위 [s1, B] → 한도 1 초과 → 맨 끝 B 품절
  - { at: "20:01:00", type: host.resolveConflict, b: b1, no: 15, decision: KEEP }
  - { at: "20:01:10", type: host.resolveConflict, b: b1, no: 15, decision: SWITCH }          # 충돌 없음 → 아무 일도 없음
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: ["sms:s1"], conflict: false }
  claims:
    - { product: b1/15, buyer: UC_B, status: REJECTED, reason: SOLD_OUT }
    - { product: b1/15, buyer: "sms:s1", status: WAITLISTED }
  sameBuyer: [["sms:s1", "sms:s2"]]
  claimCount: 3
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1, VOID_LABEL: 0 }
