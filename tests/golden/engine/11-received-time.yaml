id: G-ENG-118
title: 공개 순간 보류 찜은 실제 시각순으로 정렬해 하나씩 판정 — 게시 시각이 빠른 늦은 도착이 1등, HOST 동률이 1등 자리를 다투면 공개 순간에도 충돌
refs: [ORD-06, ORD-09, ORD-10, R-5, R-6, R-7, D-052]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000, status: READY }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }                              # 보류. 키 (20:00:10, 1)
  - { at: "20:00:12", type: sms, b: b1, ref: s1, no: 15, received: "20:00" }                                       # 보류. HOST → 키 (20:01:00, 0)
  - { at: "20:00:15", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "15", publishedAt: "20:00:02" }     # 보류. 키 (20:00:02, 1)
  - { at: "20:00:20", type: sms, b: b1, ref: s2, no: 15, received: "20:00:40" }                                    # 보류. 키 (20:00:40, 1) (같은 날, 20초 뒤)
  - { type: assert, expect: { pending: { b1/15: [UC_B, UC_A, "sms:s2", "sms:s1"] } } }
  # 공개 T=20:00:30 → 유효 구간 시작 20:00:00. 모든 at(10·12·15·20) ≥ 시작 → 전부 판정. 정렬 순서대로:
  # B 확정(1) → A: B보다 뒤 → 대기 [A] → s2: 뒤 → A(10) 뒤 → [A, s2]
  # → s1: 1등 B(20:00:02)가 s1 구간 [20:00, 20:01) 안 → 동률 → HOST → 충돌
  - { at: "20:00:30", type: product.open, b: b1, no: 15 }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_B, waitlist: [UC_A, "sms:s2"], conflict: true }
  claims:
    - { product: b1/15, buyer: "sms:s1", status: CONFLICT }
  pending: { b1/15: [] }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_B, text: "15번 핑크프릴 10,000원 김철수님 구매 감사합니다", confirmVersion: 1 }
  effectCounts: { POST_THANKS: 1, PRINT_PRODUCT_LABEL: 1 }
