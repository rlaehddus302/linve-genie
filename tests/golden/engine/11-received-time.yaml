id: G-ENG-123
title: HOST 동률은 초까지 입력한 문자와 분 단위 문자 사이에도 있고, 늦게 온 쪽이 정확한 시각이어도 1등 자리를 다투면 잠금과 상관없이 충돌
refs: [ORD-09, ORD-10, R-6, R-7, D-052]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
