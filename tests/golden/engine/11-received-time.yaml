id: G-ENG-120
title: 메시지 변환 — 방송자 메시지·이미 그 번호의 찜을 만든 메시지(그 찜이 취소됐어도)·두 번 누름은 아무 일도 없고, 원래 순위로 대기 자리·충돌(접수순에서도), 다른 번호로는 다시 변환, 상품이 없으면 원래 시각으로 보류
refs: [ORD-01, ORD-10, ORD-12, R-5, R-7, D-054]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }    # seq 1
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }         # seq 2
  - { at: "20:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15번이용ㅎ" }  # seq 3. STRICT에서 주문 아님(언급)
  - { at: "20:00:06", type: chat, b: b1, id: m2, ch: UC_O, nick: 방송자, text: "15", owner: true }   # seq 4. 무시하는 방송자 메시지
  - { at: "20:00:07", type: chat, b: b1, id: m3, ch: UC_B, nick: 김철수, text: "15" }          # seq 5. B 15번 확정(1) (찜 1)
  - { at: "20:00:08", type: chat, b: b1, id: m4, ch: UC_C, nick: 이영희, text: "15" }          # seq 6. 대기 [C] (찜 2)
  - { at: "20:00:09", type: chat, b: b1, id: m5, ch: UC_D, nick: 박민수, text: "16" }          # seq 7. D 16번 확정(1) (찜 3)
  - { at: "20:00:10", type: chat, b: b1, id: m6, ch: UC_E, nick: 최영수, text: "십육번 주세요" }   # seq 8. 한글 수사는 번호 아님 → 아무 찜 없음
  - { at: "20:00:30", type: host.convertMessage, b: b1, msg: m2, no: 15 }                     # 무시한 방송자 메시지 → 아무 일도 없음
  - { at: "20:00:31", type: host.convertMessage, b: b1, msg: m3, no: 15 }                     # m3은 이미 15번 찜을 만들었다 → 아무 일도 없음
  # m6 → E의 16번 찜, 순위 seq 8 > D(7) → 1등을 밀어내지 않음 → 대기 자리 [E] (찜 4)
  - { at: "20:00:32", type: host.convertMessage, b: b1, msg: m6, no: 16 }
  # m1 → A의 15번 찜, 순위 seq 3 < B(5) → 1등을 밀어내야 함 → 변환은 잠금과 상관없이 늘 충돌 (찜 5)
  - { at: "20:00:33", type: host.convertMessage, b: b1, msg: m1, no: 15, reason: 놓친 주문 }
  - { type: assert, expect: { products: { b1/15: { winner: UC_B, waitlist: [UC_C], conflict: true }, b1/16: { winner: UC_D, waitlist: [UC_E] } }, claims: [{ product: b1/15, buyer: UC_A, status: CONFLICT }] } }
  - { at: "20:00:34", type: host.convertMessage, b: b1, msg: m1, no: 15 }                     # 두 번 누름: m1은 이미 15번 찜을 만들었다 → 아무 일도 없음
  # 유지: A(seq 3)를 대기 자리에 → C(6)보다 앞섬 → [A, C]
  - { at: "20:00:40", type: host.resolveConflict, b: b1, no: 15, decision: KEEP }
  # B 취소 → 자동 승계: A 확정(2), 이름은 A의 닉네임 → 대기 [C]
  - { at: "20:00:50", type: host.cancel, b: b1, no: 15, buyer: UC_B, reason: 구매자 변심 }
  # m3이 만든 15번 찜(B)은 방금 취소됐다 — 지금 상태와 상관없이 m3은 이미 15번 찜을 만들었으므로 아무 일도 없다(옛 순위 seq 5로 되살아나 C 앞에 끼지 않는다)
  - { at: "20:00:55", type: host.convertMessage, b: b1, msg: m3, no: 15 }
  # m1은 16번 찜을 만든 적 없음 → A의 16번 찜(순위 seq 3) < D(7) → 충돌 (찜 6)
  - { at: "20:01:00", type: host.convertMessage, b: b1, msg: m1, no: 16 }
  # 17번 없음 → 보류. 유효 시간은 원래 메시지의 at(20:00:10)으로 잰다 (찜 7)
  - { at: "20:01:10", type: host.convertMessage, b: b1, msg: m6, no: 17 }
  # 17번 공개 T=20:01:20 → 시작 20:00:50. E의 보류 찜 at 20:00:10 < 20:00:50 → 만료
  - { at: "20:01:20", type: product.register, b: b1, no: 17, name: 미니마, price: 3000 }
expect:
  products:
    b1/15: { status: SOLD, winner: UC_A, waitlist: [UC_C], conflict: false }
    b1/16: { status: SOLD, winner: UC_D, waitlist: [UC_E], conflict: true }
    b1/17: { status: OPEN, winner: null }
  claims:
    - { product: b1/15, buyer: UC_B, status: CANCELLED }
    - { product: b1/16, buyer: UC_A, status: CONFLICT }
    - { product: b1/17, buyer: UC_E, status: REJECTED, reason: EXPIRED }
  pending: { b1/17: [] }
  claimCount: 7
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: UC_A, text: "15번 핑크프릴 10,000원 홍길동님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 3, PRINT_PRODUCT_LABEL: 3 }      # B(1)·D(1)·A(2)
