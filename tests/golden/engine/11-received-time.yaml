id: G-ENG-121
title: 충돌 찜이 끝나는 길 — 시청자 자동 취소(충돌 찜은 잠금 없음), 차단. 끝나면 충돌 표시가 사라지고 다음 충돌을 받는다
refs: [ORD-07, ORD-10, ORD-12, R-7, R-8, R-9, D-053]
settings: { contention.policy: RECEIVED_TIME, cancel.buyerChat: AUTO }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }
  - { at: "20:00:11", type: host.confirm, b: b1, no: 15, buyer: UC_A }                                          # A 잠금
  - { at: "20:00:12", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16" }
  - { at: "20:00:13", type: host.confirm, b: b1, no: 16, buyer: UC_B }                                          # B 잠금
  - { at: "20:00:20", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "15", publishedAt: "20:00:05" }  # t 05 < A(10) → 충돌
  - { at: "20:00:21", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "16", publishedAt: "20:00:06" }  # t 06 < B(12) → 충돌
  - { type: assert, expect: { products: { b1/15: { conflict: true }, b1/16: { conflict: true } }, claims: [{ product: b1/15, buyer: UC_C, status: CONFLICT }, { product: b1/16, buyer: UC_D, status: CONFLICT }] } }
  - { at: "20:00:30", type: chat, b: b1, id: m5, ch: UC_C, nick: 이영희, text: "15 취소" }                        # AUTO, 충돌 찜엔 잠금 없음 → 바로 취소
  - { at: "20:00:31", type: host.blockBuyer, buyer: UC_D, reason: 장난 }                                         # D의 충돌 찜 → REJECTED(BLOCKED)
  - { at: "20:00:40", type: chat, b: b1, id: m6, ch: UC_E, nick: 최영수, text: "15", publishedAt: "20:00:07" }  # 충돌이 풀렸으므로 새 충돌
expect:
