# S03 보강 — 실제 시각순 정렬 키·역전·충돌·메시지 변환 (ORD-09, ORD-10, ORD-12, R-4 "대기에 넣는 자리", R-6, R-7, D-052~D-054).
# 정렬 키 (T, r, seq): 정확한 시각 t → (t, 1). 분 단위 문자 [m, m+1분) → SMS면 (m, 0), YOUTUBE·HOST면 (m+1분, 0).
# 채팅의 실제 시각 = publishedAt(적지 않으면 at). 문자 = received(날짜는 입력 시각에 가장 가까운 날, D-023).
# 기본 설정: 대기 한도 5, 자동 승계, 확정마다 라벨 1 + 감사 1. 기대값 계산은 각 줄 주석.
id: G-ENG-110
title: 같은 분 동률 YOUTUBE — 구간 끝 정각의 유튜브보다는 분 단위 문자가 앞서고, 구간 안이면 유튜브, 구간 시작 전이면 유튜브
refs: [ORD-09, R-6, R-7, D-052]
settings: { contention.policy: RECEIVED_TIME, contention.sameMinuteTieBreaker: YOUTUBE }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: 성미인, price: 8000 }
  - { at: "20:01:00", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }                              # t = 20:01:00.000 → 15번 확정(1)
  - { at: "20:01:01", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16", publishedAt: "20:00:59.999" }   # t = 20:00:59.999 → 16번 확정(1)
  - { at: "20:01:02", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "17", publishedAt: "19:59:59.999" }   # t = 19:59:59.999 → 17번 확정(1)
  # "20:00" = [20:00:00, 20:01:00) → 키 (20:01:00, 0) < UC_A (20:01:00, 1) → 문자가 앞섬(t ≥ 구간 끝). A 잠금 전 → 자동 역전: s1 확정(2), A 대기 1순위
  - { at: "20:01:30", type: sms, b: b1, ref: s1, no: 15, received: "20:00" }
  # 키 (20:01:00, 0) > UC_B (20:00:59.999, 1) → 구간 안 = 동률 → YOUTUBE → B가 앞섬 → s2는 대기
  - { at: "20:01:31", type: sms, b: b1, ref: s2, no: 16, received: "20:00" }
  # UC_C 19:59:59.999 < 구간 시작 → C가 앞섬 → s3는 대기
  - { at: "20:01:32", type: sms, b: b1, ref: s3, no: 17, received: "20:00" }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_A], conflict: false }
    b1/16: { status: SOLD, winner: UC_B, waitlist: ["sms:s2"], conflict: false }
    b1/17: { status: SOLD, winner: UC_C, waitlist: ["sms:s3"], conflict: false }
  effectCounts: { POST_THANKS: 4, PRINT_PRODUCT_LABEL: 4, VOID_LABEL: 0 }
  pendingEffects:                                  # A의 미실행 효과(확정버전 1)는 역전으로 취소
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s1", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/16, buyer: UC_B, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/16, buyer: UC_B, confirmVersion: 1 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/17, buyer: UC_C, confirmVersion: 1 }
    - { kind: PRINT_PRODUCT_LABEL, product: b1/17, buyer: UC_C, confirmVersion: 1 }
---
id: G-ENG-111
title: 같은 분 동률 SMS — 구간 시작 정각의 유튜브와 같으면 분 단위 문자가 앞서고, 초까지 입력한 문자와의 동률에서도 분 단위 문자가 앞선다
refs: [ORD-08, ORD-09, R-6, R-7, D-052]
settings: { contention.policy: RECEIVED_TIME, contention.sameMinuteTieBreaker: SMS }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:02", type: product.register, b: b1, no: 17, name: 성미인, price: 8000 }
  - { at: "20:00:30", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15", publishedAt: "20:00:00" }        # t = 20:00:00.000 → 15번 확정(1)
  - { at: "20:00:31", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "16", publishedAt: "19:59:59.999" }    # 16번 확정(1)
  # SMS → "20:00" 키 (20:00:00, 0) < UC_A (20:00:00, 1) → 문자가 앞섬 → A 잠금 전 → 역전: s1 확정(2), A 대기
  - { at: "20:00:40", type: sms, b: b1, ref: s1, no: 15, received: "20:00" }
  # 키 (20:00:00, 0) > UC_B (19:59:59.999, 1) → B가 앞섬(구간 시작 전) → s2 대기
  - { at: "20:00:41", type: sms, b: b1, ref: s2, no: 16, received: "20:00" }
  - { at: "20:00:42", type: sms, b: b1, ref: s3, no: 17, received: "20:00:30" }   # 초까지 → 정확한 시각 20:00:30 → 17번 확정(1)
  # "20:00" 키 (20:00:00, 0) < s3 (20:00:30, 1) → 동률(정확한 시각 쪽이 문자여도 같다) → SMS → 분 단위 쪽이 앞섬 → 역전: s4 확정(2), s3 대기
  - { at: "20:00:43", type: sms, b: b1, ref: s4, no: 17, received: "20:00" }
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s1", waitlist: [UC_A], conflict: false }
    b1/16: { status: SOLD, winner: UC_B, waitlist: ["sms:s2"], conflict: false }
    b1/17: { status: SOLD, winner: "sms:s4", waitlist: ["sms:s3"], conflict: false }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s1", text: "15번 핑크프릴 10,000원 문자찜님 구매 감사합니다", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/17, buyer: "sms:s4", text: "17번 성미인 8,000원 문자찜님 구매 감사합니다", confirmVersion: 2 }
  effectCounts: { POST_THANKS: 5, PRINT_PRODUCT_LABEL: 5, VOID_LABEL: 0 }      # A·B·s1·s3·s4
