    - { product: b1/16, buyer: UC_D, status: REJECTED, reason: BLOCKED }
    - { product: b1/15, buyer: UC_E, status: CONFLICT }
  cancelRequests: []
  effectCounts: { POST_THANKS: 2, PRINT_PRODUCT_LABEL: 2 }
