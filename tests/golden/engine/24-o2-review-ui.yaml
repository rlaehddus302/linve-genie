# O2 — 서버·화면이 기대는 옵션 방송 엔진 동작 (새 엔진 규칙 없음 — 지금 코어로 통과해야 한다)
# - 확인 필요 목록 화면의 "여러 줄 한 번에"는 원래 순위(출처 seq) 순서로 바로잡기·지우기를 보낸다(D-O2-07). 줄마다 결과가 다를 수 있다.
# - 방송 시작 화면의 판매 방식은 그 방송의 설정 스냅샷에만 들어간다(D-O2-02). 같은 날 다육 방송과 옵션 방송이 따로 판정된다.
# - 변형을 정하지 않은 시청자 취소 요청은 판매자가 변형을 골라 승인하고, "취소 안 함"은 아무 변형으로나 보내도 요청 전체가 사라진다(D-O2-09).
# 근거: R-19, R-20 7·8, D-O-10·D-O-13, D-O1-04·D-O1-10, D-O2-02·D-O2-07·D-O2-09
---
id: G-ENG-O2-01
title: 확인 필요 여러 줄을 원래 순서로 한 번에 — 바로잡은 주문은 원래 순위로 대기 자리에 들어가고, 수량이 모자란 줄은 남으며, 고친 수량으로 다시 보내면 확정
refs: [CMT-04, R-20, R-19, R-4]
settings: { claim.parseMode: OPTIONS, waitlist.max: 3 }
broadcasts: [{ id: b1, date: 2026-10-26, title: 의류 5부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 21, name: 반바지, price: 10000, stocks: { L: 2 }, options: [{ name: 사이즈, choices: [{ label: S }, { label: M }, { label: L }] }] }   # 지금 상품 21(20:00:00). 재고 S 1 · M 1 · L 2
  - { at: "20:00:20", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "반바지" }        # 이름 → 21, 사이즈 없음 → 확인 필요 OPTION_MISSING
  - { at: "20:00:21", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "반바지 XL" }     # 21, 남은 말 한 덩어리 → UNKNOWN_WORD
  - { at: "20:00:22", type: chat, b: b1, id: m3, ch: UC_C, nick: 이영희, text: "반바지 M" }      # M 확정(C). M 남은 0
  - { at: "20:00:23", type: chat, b: b1, id: m4, ch: UC_D, nick: 박민수, text: "반바지 M" }      # M 대기 1(D)
  - { at: "20:00:24", type: chat, b: b1, id: m5, ch: UC_E, nick: 최지우, text: "반바지 L 3개" }  # q 3, L 남은 2 (0 < 2 < 3) → STOCK_SHORT, 찜 없음
  - { at: "20:00:25", type: chat, b: b1, id: m6, ch: UC_F, nick: 정하나, text: "반바지 XXL" }    # UNKNOWN_WORD
  - type: assert
    expect:
      reviews:                                                     # 원래 순위(m1 < m2 < m5 < m6)
        - { item: m1, reason: OPTION_MISSING, buyer: UC_A, product: b1/21 }
        - { item: m2, reason: UNKNOWN_WORD, buyer: UC_B, product: b1/21 }
        - { item: m5, reason: STOCK_SHORT, buyer: UC_E, product: b1/21, options: { 사이즈: L }, qty: 3 }
        - { item: m6, reason: UNKNOWN_WORD, buyer: UC_F, product: b1/21 }
      variants:
        "b1/21#M": { winner: UC_C, waitlist: [UC_D] }
  # 판매자가 네 줄을 골라 한 번에 보냄 — 화면은 원래 순위 순서로 보낸다(D-O2-07)
  - { at: "20:01:00", type: host.resolveReview, b: b1, item: m1, no: 21, qty: 1, options: { 사이즈: M } }   # M 남은 0, 수량 1 → 대기. m1이 m4(D)보다 앞 → 대기 1순위 A, D는 2(R-4 "대기에 넣는 자리"). 1등 C는 그대로
  - { at: "20:01:00", type: host.resolveReview, b: b1, item: m2, no: 21, qty: 1, options: { 사이즈: S } }   # S 남은 1, 앞선 대기 없음 → B 확정
  - { at: "20:01:00", type: host.resolveReview, b: b1, item: m5, no: 21, qty: 3, options: { 사이즈: L } }   # 3 > 남은 2 → 아무 일도 없다, 항목이 남는다(R-20 7)
  - { at: "20:01:00", type: host.dismissReview, b: b1, item: m6, reason: 없는 사이즈 }                   # 주문 아님 → 항목 지움
  - type: assert
    expect:
      reviews:
        - { item: m5, reason: STOCK_SHORT, buyer: UC_E, product: b1/21, options: { 사이즈: L }, qty: 3 }
      variants:
        "b1/21#M": { status: SOLD, winner: UC_C, waitlist: [UC_A, UC_D] }
        "b1/21#S": { status: SOLD, winner: UC_B }
        "b1/21#L": { status: OPEN, winners: [], confirmedUnits: 0 }
  # 판매자가 구매자와 이야기해 2개로 고쳐 다시 보냄
  - { at: "20:01:30", type: host.resolveReview, b: b1, item: m5, no: 21, qty: 2, options: { 사이즈: L } }   # 2 ≤ 남은 2, 앞선 대기 없음 → E 확정 L × 2, 금액 10000 × 2 = 20000
  - { at: "20:02:00", type: host.cancel, b: b1, no: 21, buyer: UC_C, options: { 사이즈: M }, reason: 구매자 요청 }   # C 취소 → 승계 AUTO: 대기 1순위 A 확정, D 대기 1
expect:
  products:
    b1/21: { status: SOLD, confirmedUnits: 4 }                     # S 1 + M 1 + L 2 = 재고 합 4
  variants:
    "b1/21#M": { status: SOLD, winner: UC_A, waitlist: [UC_D] }
    "b1/21#S": { status: SOLD, winner: UC_B }
    "b1/21#L": { status: SOLD, winner: UC_E, confirmedUnits: 2 }
  claims:
    - { product: "b1/21#M", buyer: UC_C, status: CANCELLED }
    - { product: "b1/21#L", buyer: UC_E, status: CONFIRMED, qty: 2 }
  claimCount: 5                                                    # C, D, A(바로잡기), B(바로잡기), E(바로잡기). m6·첫 m5 바로잡기는 찜 없음
  reviews: []
  buyers:
    UC_E: { items: ["b1/21#L"], subtotal: 20000 }                  # 10000 × 2
    UC_A: { items: ["b1/21#M"], subtotal: 10000 }
---
id: G-ENG-O2-02
title: 방송마다의 판매 방식 — 같은 날 다육 방송은 번호로만, 옵션 방송은 옵션 댓글을 받는다. 변형을 정하지 않은 취소 요청은 고른 변형만 승인, "취소 안 함"은 요청 전체를 지운다
refs: [OPT-04, CMT-07, R-19, R-20, D-O-13]
settings: { cancel.buyerChat: AUTO }                               # 시나리오 설정은 b1에만(방송 b2는 시작 때 스냅샷)
broadcasts: [{ id: b1, date: 2026-10-26, title: 다육 1부 }]
events:
  - { at: "19:00:00", type: product.register, b: b1, no: 21, name: 반바지, price: 10000 }   # b1은 STRICT — 옵션 없는 상품
  - { at: "19:00:05", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "반바지 M" }    # STRICT: 번호 문법 아님 → 주문 아님(CMT-07)
  - { at: "19:00:06", type: chat, b: b1, id: m2, ch: UC_B, nick: 김철수, text: "21" }          # B 확정
  - { at: "20:00:00", type: broadcast.start, b: b2, date: 2026-10-26, title: 의류 1부, settings: { claim.parseMode: OPTIONS, cancel.buyerChat: AUTO } }
  - { at: "20:00:01", type: product.register, b: b2, no: 21, name: 반바지, price: 10000, options: [{ name: 사이즈, choices: [{ label: S }, { label: M }, { label: L }] }] }   # 지금 상품 b2/21
  - { at: "20:00:20", type: chat, b: b2, id: m3, ch: UC_A, nick: 홍길동, text: "반바지 M" }    # A M 확정
  - { at: "20:00:21", type: chat, b: b2, id: m4, ch: UC_A, nick: 홍길동, text: "반바지 L" }    # A L 확정(변형이 다르면 같은 사람도 된다)
  - { at: "20:00:22", type: chat, b: b2, id: m5, ch: UC_B, nick: 김철수, text: "반바지 L" }    # L 대기 1(B)
  - { at: "20:00:30", type: chat, b: b2, id: m6, ch: UC_A, nick: 홍길동, text: "21 취소" }     # A의 활성 찜 둘 → AUTO여도 요청(R-20 8)
  - type: assert
    expect:
      cancelRequests:
        - { product: b2/21, buyer: UC_A }
  - { at: "20:00:40", type: host.approveCancel, b: b2, no: 21, buyer: UC_A, options: { 사이즈: L } }   # 판매자가 L을 고름 → A의 L 취소, 승계 AUTO → B 확정. 요청 사라짐, A의 M은 그대로
  - { at: "20:00:45", type: chat, b: b2, id: m7, ch: UC_C, nick: 이영희, text: "반바지 S" }    # C S 확정
  - { at: "20:00:46", type: chat, b: b2, id: m8, ch: UC_C, nick: 이영희, text: "반바지 M" }    # M은 A가 1등 → C 대기 1
  - { at: "20:00:50", type: chat, b: b2, id: m9, ch: UC_C, nick: 이영희, text: "21 취소" }     # C의 활성 찜 둘(S 확정·M 대기) → 요청
  - { at: "20:00:55", type: host.dismissCancel, b: b2, no: 21, buyer: UC_C, options: { 사이즈: S } }   # "취소 안 함" → 요청 전체가 사라지고 아무 찜도 취소되지 않는다
expect:
  products:
    b1/21: { status: SOLD, winner: UC_B }
  variants:
    "b2/21#M": { status: SOLD, winner: UC_A, waitlist: [UC_C] }
    "b2/21#L": { status: SOLD, winner: UC_B, waitlist: [] }
    "b2/21#S": { status: SOLD, winner: UC_C }
  claims:
    - { product: "b2/21#L", buyer: UC_A, status: CANCELLED }
    - { product: "b2/21#S", buyer: UC_C, status: CONFIRMED }
  claimCount: 6                                                    # b1: B(1) / b2: A M, A L, B L, C S, C M(5). m1은 찜 없음
  cancelRequests: []
  reviews: []
