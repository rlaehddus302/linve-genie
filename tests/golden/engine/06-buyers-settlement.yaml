id: G-ENG-054
title: 문자찜 구매자를 유튜브 구매자와 합치기 → 배송비 한 번, 되돌리기 가능
refs: [BUY-03, R-11, R-12]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:01", type: product.register, b: b1, no: 16, name: 라울, price: 5000 }
  - { at: "20:00:05", type: sms, b: b1, ref: s1, no: 15, received: "20:00:03", memo: 길동 }
  - { at: "20:00:06", type: chat, b: b1, id: m1, ch: UC_H, nick: 홍길동, text: "16" }
  - { at: "21:00:00", type: buyer.merge, from: "sms:s1", into: UC_H, reason: 같은 사람 확인 }
  - { type: assert, expect: { buyers: { UC_H: { items: [b1/15, b1/16], subtotal: 15000 } }, settlements: { UC_H@2026-10-18: { shipping: 4000, total: 19000 } } } }
  - { at: "21:05:00", type: buyer.unmerge, from: "sms:s1", reason: 잘못 합침 }
expect:
