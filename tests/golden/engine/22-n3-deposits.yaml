# N3 보강 — 입금 확인(PAY-01)이 기대는 엔진 동작 (STL-07, STL-09, R-7 3, R-12, DEPOSIT_RULES DP-6, D-N3-05).
# 새 엔진 규칙은 없다(N3는 dev-core가 없다 — 지금 코어로 통과한다). 입금 확인은 손으로 적는 입금과 같은 settlement.payment를,
# 되돌리기는 같은 금액의 settlement.refund를 적는다. 그때 서버가 기대는 것을 고정한다:
#   - 입금 확인으로 적은 입금도 입금 기록이라 1등이 잠긴다(R-7 3). 되돌려 받은 금액이 0이 되면 잠금도 풀린다.
#   - 메모·사유에는 입금 번호만 적는다(입금자명 없음 — DP-0 3). 글 칸 휴대폰 번호 검사(R-1)를 지나는 글이다.
#   - 남은 금액 = 최종 − 받은 금액. 같은 날 두 방송은 한 묶음, 되돌리기는 그 입금만큼 받은 금액을 줄인다, 1등이 취소되면 남은 금액이 음수(과입금).
# ID는 병렬 트랙 번호(G-ENG-<스프린트>-<두 자리>, D-N3-01)다.
id: G-ENG-N3-01
title: 입금 확인으로 적은 입금도 1등을 잠근다 — 늦게 입력한 더 빠른 문자찜은 충돌. 되돌리기(같은 금액 환불)로 받은 금액이 0이 되면 잠금이 풀려, 그 뒤의 더 빠른 문자찜은 자동 역전
refs: [PAY-01, STL-07, STL-09, ORD-09, R-7, R-12, D-N3-05]
settings: { contention.policy: RECEIVED_TIME }
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 다육이맘, text: "15" }                                          # A 확정(1). 묶음 10,000 + 배송비 4,000 = 14,000
  - { at: "21:00:00", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 14000, memo: "자동 입금 확인 · 입금 #1" }   # 자동 확인: 받은 14,000 = 최종 → 입금 완료, A 잠금
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { total: 14000, refundDue: 0, payment: PAID } } } }
  - { at: "21:05:00", type: sms, b: b1, ref: s1, no: 15, received: "20:00:05" }                                                   # 수신 05초 < A(10초)지만 A 잠금 후 → 충돌
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, conflict: true } }, claims: [{ product: b1/15, buyer: "sms:s1", status: CONFLICT }] } }
  - { at: "21:06:00", type: host.resolveConflict, b: b1, no: 15, decision: KEEP, reason: 이미 입금함 }                             # 유지: s1은 순위대로 대기(대기가 비어 1순위)
  - { type: assert, expect: { products: { b1/15: { status: SOLD, winner: UC_A, waitlist: ["sms:s1"], conflict: false } } } }
  - { at: "21:10:00", type: settlement.refund, buyer: UC_A, date: 2026-10-18, amount: 14000, reason: "입금 확인 되돌림 · 입금 #1" } # 되돌리기: 받은 14,000 − 14,000 = 0 → 미입금. 판정은 그대로(INV-8)
  - { type: assert, expect: { products: { b1/15: { winner: UC_A, waitlist: ["sms:s1"] } }, settlements: { UC_A@2026-10-18: { total: 14000, refundDue: 0, payment: UNPAID } } } }
  # 받은 금액 0 → A의 지금 확정에 출력·게시 보고·host.confirm·입금 기록이 없다 → 잠금 전
  - { at: "21:15:00", type: sms, b: b1, ref: s2, no: 15, received: "20:00:03" }                                                   # 수신 03초 < A(10초), A 잠금 전 → 자동 역전: s2 확정(2), A는 대기 1순위
expect:
  products:
    b1/15: { status: SOLD, winner: "sms:s2", waitlist: [UC_A, "sms:s1"], conflict: false }                                         # 밀려난 1등은 대기 1순위(R-4 "대기에 넣는 자리"), s1은 그 뒤
  claims:
    - { product: b1/15, buyer: UC_A, status: WAITLISTED }
    - { product: b1/15, buyer: "sms:s1", status: WAITLISTED }
    - { product: b1/15, buyer: "sms:s2", status: CONFIRMED }
  settlements:
    UC_A@2026-10-18: { subtotal: 0, shipping: 0, adjustments: 0, total: 0, refundDue: 0, payment: UNPAID }                        # 품목 없음, 받은 0(입금 14,000 − 환불 14,000)
    "sms:s2@2026-10-18": { subtotal: 10000, shipping: 4000, total: 14000, refundDue: 0, payment: UNPAID }
  effects:
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s2", text: "15번 핑크프릴 10,000원 문자찜님 구매 감사합니다" }
  pendingEffects:                                                                                                                 # A의 확정(1) 효과는 실행 전에 확정이 풀려 취소됨
    - { kind: PRINT_PRODUCT_LABEL, product: b1/15, buyer: "sms:s2", confirmVersion: 2 }
    - { kind: POST_THANKS, target: LIVE_CHAT, product: b1/15, buyer: "sms:s2", confirmVersion: 2 }
  effectCounts: { PRINT_PRODUCT_LABEL: 2, POST_THANKS: 2, VOID_LABEL: 0 }                                                         # A(1)·s2(2)마다 라벨·감사 하나씩, 출력 전이라 폐기 없음
  claimCount: 3
---
id: G-ENG-N3-02
title: 입금 확인이 비교하는 남은 금액(최종 − 받은 금액) — 같은 날 두 방송은 한 묶음, 부분 입금 뒤 남은 금액만큼의 입금으로 입금 완료, 앞의 입금을 되돌리면 다시 부분 입금, 1등이 모두 취소되면 과입금(환불 필요)
refs: [PAY-01, STL-01, STL-07, STL-09, R-12, D-N3-05]
broadcasts:
  - { id: b1, date: 2026-10-18, title: 1부 }
  - { id: b2, date: 2026-10-18, title: 2부 }
events:
  - { at: "20:00:00", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }
  - { at: "20:00:10", type: chat, b: b1, id: m1, ch: UC_A, nick: 다육이맘, text: "15" }                                          # A 확정
  - { at: "21:00:00", type: product.register, b: b2, no: 3, name: 방울복랑, price: 5000 }
  - { at: "21:00:10", type: chat, b: b2, id: m2, ch: UC_A, nick: 다육이맘, text: "3" }                                           # A 확정. 같은 날 → 한 묶음
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { subtotal: 15000, shipping: 4000, total: 19000, payment: UNPAID } } } }   # 10,000 + 5,000 + 배송비 4,000(한 번)
  - { at: "22:00:00", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 10000, memo: "입금 내역으로 확인 · 입금 #1" } # 판매자가 확인 필요 목록에서 확정(금액 불일치였던 입금): 받은 10,000
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { total: 19000, refundDue: 0, payment: PARTIAL } } } }                    # 남은 금액 19,000 − 10,000 = 9,000
  - { at: "22:05:00", type: settlement.payment, buyer: UC_A, date: 2026-10-18, amount: 9000, memo: "자동 입금 확인 · 입금 #2" }      # 남은 9,000과 같은 입금 → 자동 확인: 받은 19,000
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { total: 19000, refundDue: 0, payment: PAID } } } }
  - { at: "22:10:00", type: settlement.refund, buyer: UC_A, date: 2026-10-18, amount: 10000, reason: "입금 확인 되돌림 · 입금 #1" }  # #1 되돌리기: 받은 19,000 − 10,000 = 9,000
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { total: 19000, refundDue: 0, payment: PARTIAL } } } }                    # 남은 금액 10,000
  - { at: "22:20:00", type: host.cancel, b: b1, no: 15, buyer: UC_A, reason: 구매자 요청 }                                       # 잠긴 1등도 방송자 취소는 된다. 대기 없음 → 다시 판매 중
  - { type: assert, expect: { settlements: { UC_A@2026-10-18: { subtotal: 5000, shipping: 4000, total: 9000, refundDue: 0, payment: PAID } } } }   # 5,000 + 4,000 = 9,000 = 받은 9,000
  - { at: "22:30:00", type: host.cancel, b: b2, no: 3, buyer: UC_A, reason: 구매자 요청 }
expect:
  products:
    b1/15: { status: OPEN, winner: null }
    b2/3: { status: OPEN, winner: null }
  buyers:
    UC_A: { items: [], subtotal: 0 }
  settlements:
    UC_A@2026-10-18: { subtotal: 0, shipping: 0, adjustments: 0, total: 0, refundDue: 9000, payment: OVERPAID }                  # 품목 없음 → 최종 0, 받은 9,000 → 환불 필요 9,000(남은 금액 −9,000)
