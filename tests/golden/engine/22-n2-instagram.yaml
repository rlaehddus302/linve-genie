id: G-ENG-N2-03
title: 같은 날 유튜브 1부(실제 시각순)·인스타 2부(접수순)가 한 범위 — 방송마다 판정 기준이 따로이고, 같은 닉네임이어도 플랫폼이 다르면 다른 구매자, 합치면 정산 묶음 하나(배송비 한 번)
refs: [PLT-01, PLT-03, ORD-09, BUY-01, BUY-03, STL-01, STL-02, R-0, R-6, R-7, R-11, R-12, D-052, D-057, D-069, D-070, D-N2-02, D-N2-05]
broadcasts: []
events:
  # 1부(유튜브): 실제 시각순. 서버처럼 broadcast.start로 선언 — 스냅샷 = 기본값 위에 contention.policy만
  - { at: "19:00:00", type: broadcast.start, b: b1, date: 2026-10-20, title: 유튜브 1부, settings: { contention.policy: RECEIVED_TIME } }   # seq 1
  - { at: "19:00:10", type: product.register, b: b1, no: 15, name: 핑크프릴, price: 10000 }                                   # seq 2
  - { at: "19:00:20", type: chat, b: b1, id: m1, ch: UC_A, nick: 홍길동, text: "15" }                                         # seq 3. A 확정(1), publishedAt = 19:00:20 (찜 1)
  # 늦게 입력한 선순위 문자찜: 수신 19:00:15(초까지 — 정확한 시각) < A의 19:00:20 → 앞선다. A는 잠금 전 → 자동 역전(R-7):
  # s1 확정(2), A는 대기 1순위. A의 미실행 라벨·감사(1)는 취소(출력 전 → 폐기 없음). s1 라벨·감사(2) (찜 2)
  - { at: "19:00:40", type: sms, b: b1, ref: s1, no: 15, received: "19:00:15" }                                              # seq 4
  # 2부(인스타그램): 설정을 덮어쓰지 않음 → 접수순(ARRIVAL, 기본). 인스타 방송은 이 값만 쓸 수 있다(서버가 막는다 — D-N2-05)
  - { at: "20:00:00", type: broadcast.start, b: b2, date: 2026-10-20, title: 인스타 2부 }                                       # seq 5
  - { at: "20:00:10", type: product.register, b: b2, no: 15, name: 라울, price: 5000 }                                        # seq 6. 번호는 방송 안에서만 유일
