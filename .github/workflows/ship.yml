# main에 올라오면 맥 미니가 알아서 내보낸다 (D-CI-01, 사용자 지시 2026-11-12
# "내 맥미니, 내 맥북, 홍재 맥북 각 기기의 클로드한테 일을 시키고 작업 완료되면 자동으로 깃헙 메인 푸시, 운영 서버에 배포, 내 아이폰, 홍재 아이폰 각 앱을 최신 버전으로 업데이트").
# 각 맥의 Claude는 main에 푸시까지만 한다. 비밀(운영 배포 AWS 역할·안드로이드 서명·App Store Connect 키)은 맥 미니에만 있다.
# 순서: 빠른 시험 → 운영 서버(앱 화면만 바뀌었으면 건너뜀) → 앱 화면 새 버전(D-OTA-01, 휴대폰이 켤 때 받는다 — 몇 분)
#       → 아이폰 네이티브 부품이 바뀌었을 때 TestFlight. 안드로이드 화면·APK는 명시적으로 요청한 수동 실행에서만.
#       → 화면 일꾼 갱신(packages/screen-worker 가 바뀌었을 때만, 늘 서버 배포 다음 — D-RETRO-33).
# 한 번에 하나씩(밀린 것은 가장 새 것 하나만 남는다 — 새 것이 앞 것을 다 품는다). 문서만 바뀐 푸시는 돌지 않는다.
# 손으로 돌릴 때(workflow_dispatch) native=yes면 지문이 같아도 선택한 플랫폼의 앱을 다시 만든다.
#
# 방송 중 문지기 (D-RETRO-30·31·34, 2026-11-12 방송 복기 E6·E12·E15 — docs/DEPLOY.md 6-1절):
#   진행 중인 방송이 있으면 운영 서버 배포·그 판에 맞춘 앱 화면 갱신·화면 일꾼 갱신·APK·TestFlight 빌드를 **미루고 성공으로 끝낸다**(실행 요약에 남긴다).
#   방송이 끝나고 10분쯤 조용하면 따라잡기(catchup.yml)가 이 워크플로를 main에서 다시 부른다.
#   급한 고침은 수동 실행에서 force_server=yes(서버 9~10초 끊김) · force_native=yes(빌드 동안 화면 일꾼이 느려짐).
#   방송 여부를 못 읽으면(서버가 죽었거나 맥 미니에 토큰 파일이 없음) 방송 중이 아닌 것으로 보고 배포한다 — 서버가 죽었을 때 고침을 막으면 안 된다.
name: 내보내기

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      native:
        description: '지문이 같아도 선택한 플랫폼의 앱을 다시 만든다 (yes/no)'
        default: 'no'
      testflight:
        description: '네이티브 변경 시 TestFlight에도 업로드 (USB 설치만 할 때 끔)'
        type: boolean
        default: true
      android:
        description: '안드로이드 화면 갱신과 APK 배포도 진행'
        type: boolean
        default: false
      force_server:
        description: '방송 중에도 운영 서버를 배포한다 — 급한 고침만. 서버가 9~10초 끊긴다 (yes/no)'
        default: 'no'
      force_native:
        description: '방송 중에도 APK·TestFlight 빌드를 돌린다 — 빌드 동안 화면 일꾼이 느려진다 (yes/no)'
        default: 'no'

concurrency:
  group: ship
  cancel-in-progress: false

jobs:
  ship:
    runs-on: [self-hosted, macOS, livegenie-mini]
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 의존성
        run: |
          pnpm install --frozen-lockfile
          cd apps/mobile/ios && pod install > /tmp/lg-pod.log 2>&1 || { tail -30 /tmp/lg-pod.log; exit 1; }

      - name: 빠른 시험 (타입·앱 시험)
        run: |
          pnpm typecheck
          bash scripts/deploy/test.sh
          cd apps/mobile && TZ=Pacific/Honolulu npx vitest run --maxWorkers=2

      - name: 앱 버전 지문
        working-directory: apps/mobile
        env:
          FORCE: ${{ inputs.native }}
          INCLUDE_ANDROID: ${{ github.event_name == 'workflow_dispatch' && inputs.android && 'yes' || 'no' }}
        run: |
          mkdir -p "$HOME/.livegenie-ci"
          fp() { npx expo-updates fingerprint:generate --platform "$1" | python3 -c 'import json,sys;print(json.load(sys.stdin)["hash"])'; }
          IOS=$(fp ios)
          echo "FP_IOS=$IOS" >> "$GITHUB_ENV"
          [ "$FORCE" = yes ] || [ "$IOS" != "$(cat "$HOME/.livegenie-ci/built-ios" 2>/dev/null)" ] && echo "NATIVE_IOS=yes" >> "$GITHUB_ENV" || true
          echo "아이폰 지문 $IOS (지난 빌드 $(cat "$HOME/.livegenie-ci/built-ios" 2>/dev/null || echo 없음))"
          if [ "$INCLUDE_ANDROID" = yes ]; then
            ANDROID=$(LIVEGENIE_NOTICE=on LIVEGENIE_SMS=on fp android)
            echo "FP_ANDROID=$ANDROID" >> "$GITHUB_ENV"
            if [ "$FORCE" = yes ] || [ "$ANDROID" != "$(cat "$HOME/.livegenie-ci/built-android" 2>/dev/null)" ]; then
              echo "NATIVE_ANDROID=yes" >> "$GITHUB_ENV"
            fi
          fi

      - name: 방송 중 문지기
        # 화면 일꾼 관리자가 30초마다 묻는 것과 같은 입구(GET /internal/screen/live)를 같은 일꾼 토큰으로 묻는다(scripts/deploy/live-gate.sh).
        # 토큰 파일 경로는 맥 미니의 ~/.livegenie-ci/gate.env(LG_SCREEN_TOKEN_FILE — 일꾼 launchd 설정의 --token-file 과 같은 경로)에서 읽는다. 값은 찍지 않는다.
        # LIVE = live | idle | unknown. unknown(서버가 죽었거나 토큰 없음)은 방송 중이 아닌 것으로 본다 — 서버가 죽었을 때 고침을 막으면 살릴 길이 없다.
        run: |
          . scripts/deploy/ship-lib.sh
          # 따라잡기(catchup.yml)가 저장소를 내려받지 않고 쓰는 사본 — 매번 새로 깐다
          mkdir -p "$LG_CI_DIR/bin"
          install -m 0755 scripts/deploy/live-gate.sh scripts/deploy/mini-catchup.sh "$LG_CI_DIR/bin/"
          LIVE=$(bash scripts/deploy/live-gate.sh || true)
          echo "LIVE=$LIVE" >> "$GITHUB_ENV"
          case "$LIVE" in
            live) note "지금 방송 중이에요 — 운영 서버·화면 일꾼·앱 빌드는 방송이 끝난 뒤로 미뤄요" ;;
            idle) echo "진행 중인 방송이 없어요" ;;
            *) echo "::warning::방송 중인지 확인하지 못했어요(위 문지기 기록) — 방송 중이 아닌 것으로 보고 진행해요. 맥 미니의 ~/.livegenie-ci/gate.env 와 토큰 파일을 확인해 주세요" ;;
          esac

      - name: 운영 서버 배포
        env:
          FORCE_SERVER: ${{ inputs.force_server }}
        run: |
          . scripts/deploy/ship-lib.sh
          LAST=$(cat "$LG_CI_DIR/deployed-sha" 2>/dev/null || true)
          # 서버가 바뀌었나: 앱·문서·워크플로·화면 일꾼·내보내기 스크립트만 바뀐 것은 서버 변경이 아니다(scripts/deploy/ship-changed.sh, D-RETRO-33)
          if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" HEAD 2>/dev/null && ! git diff --name-only "$LAST" HEAD | bash scripts/deploy/ship-changed.sh server > /dev/null; then
            echo "서버 변경이 없어 배포를 건너뜀 (지난 배포 $LAST)"
            undefer server
            echo "SERVER_READY=yes" >> "$GITHUB_ENV"
            exit 0
          fi
          FULL=$(git rev-parse HEAD)
          SHA=${FULL:0:8}
          if [ "$LIVE" = live ] && [ "$FORCE_SERVER" != yes ]; then
            # 실패로 끝내지 않는다 — 빨간 실행은 다음 사람이 "고쳐서 다시 푸시"할 일로 읽는다. 미룸 표시를 남기면 따라잡기가 방송 뒤에 다시 부른다
            defer server "$FULL"
            echo "SERVER_DEFERRED=yes" >> "$GITHUB_ENV"
            note "방송 중이라 서버 배포를 미뤘어요 — 방송이 끝난 뒤 다시 내보내 주세요(커밋 $SHA). 방송이 끝나고 10분쯤 조용하면 따라잡기가 저절로 다시 내보내요. 급한 고침은 수동 실행에서 force_server=yes"
            note "서버가 옛 판이라 이 커밋의 앱 화면 갱신과 화면 일꾼 갱신도 같이 미뤘어요(서버가 먼저, 나머지가 나중)"
            exit 0
          fi
          if [ "$LIVE" = live ]; then note "방송 중이지만 force_server=yes라 운영 서버를 배포해요(9~10초 끊겨요)"; fi
          undefer server
          MSG=$(git log -1 --format=%s | tr -d "'" | cut -c1-80)
          git archive "$FULL" -- . ':!harness' ':!tests/e2e' ':!tests/adversarial' | gzip > /tmp/lg-src.tgz
          bash scripts/deploy/mini-deploy.sh "$FULL" "$MSG"
          curl -fsS https://livegenie.kr/health
          echo "$FULL" > "$LG_CI_DIR/deployed-sha"
          echo "SERVER_READY=yes" >> "$GITHUB_ENV"
          # 서버가 정말 그 판이라고 답하는지(GET /internal/screen/capabilities). 어긋나도 배포는 끝났으므로 경고만
          NOW=$(bash scripts/deploy/live-gate.sh commit || true)
          if [ "$NOW" = "$FULL" ]; then echo "운영 서버 판 확인: $SHA"; else echo "::warning::운영 서버가 알려 준 판(${NOW:-모름})이 방금 배포한 $SHA 와 달라요"; fi

      - name: 아이폰 화면 갱신
        # 서버 배포를 미뤘으면 화면도 미룬다 — 화면이 서버보다 새 판이면 서버에 아직 없는 요청을 보낸다(늘 서버가 먼저, D-RETRO-30)
        if: env.SERVER_DEFERRED != 'yes'
        # 그 휴대폰 앱을 빌드할 때와 같은 값이어야 한다(앱 설정·서버 주소가 화면 코드에 들어간다)
        env:
          EXPO_PUBLIC_SERVER_URL: https://livegenie.kr
          NODE_ENV: production
        run: |
          bash scripts/deploy/mini-ota.sh ios "$FP_IOS"

      - name: 아이폰 → TestFlight (네이티브가 바뀌었을 때만)
        if: env.NATIVE_IOS == 'yes' && (github.event_name != 'workflow_dispatch' || inputs.testflight)
        env:
          FORCE_NATIVE: ${{ inputs.force_native }}
        run: |
          # 방송 중에는 빌드하지 않는다(D-RETRO-34) — 지난 빌드 지문을 그대로 두므로 다음 실행이 다시 만든다
          . scripts/deploy/ship-lib.sh
          if native_blocked ios "아이폰 TestFlight"; then exit 0; fi
          if [ -f "$HOME/.livegenie-ci/asc.env" ]; then set -a; . "$HOME/.livegenie-ci/asc.env"; set +a; fi
          # 화면 없이 도는 실행기는 로그인 키체인을 못 연다 — 전용 키체인을 연다(scripts/deploy/mini-ios-keychain.sh)
          KC=$HOME/Library/Keychains/livegenie-ci.keychain-db
          if [ -f "$KC" ]; then security unlock-keychain -p "$(cat "$HOME/.livegenie-ci/keychain.pass")" "$KC"; fi
          cd apps/mobile && EXPO_UPDATES_FINGERPRINT_OVERRIDE="$FP_IOS" ./scripts/ios-testflight.sh
          BUILT=$(cat ios/build/testflight/app.xcarchive/Products/Applications/*.app/EXUpdates.bundle/fingerprint 2>/dev/null || true)
          [ "$BUILT" = "$FP_IOS" ] || echo "::warning::아이폰 빌드 안 지문($BUILT)이 계산한 지문($FP_IOS)과 달라요 — 이 빌드는 화면 새 버전을 못 받아요"
          echo "$FP_IOS" > "$HOME/.livegenie-ci/built-ios"

      - name: 안드로이드 화면 갱신 (요청 시)
        if: github.event_name == 'workflow_dispatch' && inputs.android && env.SERVER_DEFERRED != 'yes'
        env:
          EXPO_PUBLIC_SERVER_URL: https://livegenie.kr
          NODE_ENV: production
          LIVEGENIE_NOTICE: 'on'
          LIVEGENIE_SMS: 'on'
        run: bash scripts/deploy/mini-ota.sh android "$FP_ANDROID"

      - name: 안드로이드 APK → 친구 링크 (네이티브가 바뀌었을 때만)
        if: env.NATIVE_ANDROID == 'yes'
        env:
          FORCE_NATIVE: ${{ inputs.force_native }}
        run: |
          # 방송 중에는 빌드하지 않는다(D-RETRO-34). 미룸 표시가 남아 따라잡기가 android=true로 다시 부른다
          . scripts/deploy/ship-lib.sh
          if native_blocked android "안드로이드 APK"; then exit 0; fi
          export ANDROID_HOME=$HOME/Library/Android/sdk
          cd apps/mobile/android
          # 빌드 안 지문은 위에서 계산한 값으로 못 박는다 — 빌드 도중 다시 계산하면 다른 값이 나온 적이 있다(2026-11-12 실측, D-OTA-01)
          LIVEGENIE_NOTICE=on LIVEGENIE_SMS=on LIVEJJIM_UPLOAD_PROPERTIES=$HOME/.livejjim-practice/upload.properties \
            EXPO_PUBLIC_SERVER_URL=https://livegenie.kr NODE_ENV=production EXPO_UPDATES_FINGERPRINT_OVERRIDE="$FP_ANDROID" ./gradlew assembleRelease -q
          APK=app/build/outputs/apk/release/app-release.apk
          BUILT=$(unzip -p "$APK" assets/fingerprint 2>/dev/null || true)
          [ "$BUILT" = "$FP_ANDROID" ] || { echo "APK 안 지문($BUILT)이 계산한 지문($FP_ANDROID)과 달라요 — 이 APK는 화면 새 버전을 못 받아요"; exit 1; }
          aws s3 cp "$APK" s3://livegenie-backup-445363794351/share/livegenie.apk --quiet
          cp "$APK" /tmp/livegenie.apk
          rm -f "$HOME/Desktop/livegenie-android.zip" && (cd /tmp && zip -q -j "$HOME/Desktop/livegenie-android.zip" livegenie.apk)
          echo "$FP_ANDROID" > "$HOME/.livegenie-ci/built-android"

      - name: 화면 일꾼 갱신 (서버 배포 다음에만)
        # 맨 뒤에 둔다: 실패해도(일꾼 작업 폴더에 손으로 고친 변경 등) 앞의 서버·앱 내보내기를 막지 않고, 실행은 빨갛게 남아 알린다.
        # 앞의 앱 단계가 실패해도 서버가 그 판이면 일꾼은 갱신한다. 서버 단계가 실패했으면 돌지 않는다(일꾼이 서버보다 새 판이 되면 안 된다).
        if: ${{ !cancelled() && (env.SERVER_READY == 'yes' || env.SERVER_DEFERRED == 'yes') }}
        run: |
          . scripts/deploy/ship-lib.sh
          FULL=$(git rev-parse HEAD)
          LAST=$(cat "$LG_CI_DIR/worker-sha" 2>/dev/null || true)
          if [ -n "$LAST" ] && git merge-base --is-ancestor "$LAST" HEAD 2>/dev/null && ! git diff --name-only "$LAST" HEAD | bash scripts/deploy/ship-changed.sh worker > /dev/null; then
            echo "화면 일꾼 변경이 없어 건너뜀 (지난 갱신 $LAST)"
            undefer worker
            exit 0
          fi
          if [ "${SERVER_DEFERRED:-}" = yes ]; then
            defer worker "$FULL"
            echo "서버 배포가 미뤄져 화면 일꾼 갱신도 미룸"
            exit 0
          fi
          rc=0
          bash scripts/deploy/mini-worker-update.sh "$FULL" || rc=$?
          case "$rc" in
            0) echo "$FULL" > "$LG_CI_DIR/worker-sha"; undefer worker; note "화면 일꾼을 ${FULL:0:8} 판으로 갱신하고 다시 켰어요" ;;
            10) defer worker "$FULL"; note "방송 중이라(또는 방송 여부를 확인하지 못해) 화면 일꾼 갱신을 미뤘어요 — 방송이 끝나면 따라잡기가 다시 내보내요" ;;
            11) undefer worker; note "화면 일꾼 작업 폴더가 이미 더 새 판이라 다시 켜지 않았어요 — 그 판의 내보내기가 갱신해요" ;;
            *) undefer worker; echo "::error::화면 일꾼을 갱신하지 못했어요 — 위 기록의 까닭을 고친 뒤 다시 내보내 주세요(docs/DEPLOY.md 6-1절)"; exit "$rc" ;;
          esac
