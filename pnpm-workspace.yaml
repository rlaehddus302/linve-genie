packages:
  - packages/*
  - apps/*

# Node 24 미만이면 설치부터 실패시킨다 (D-025)
engineStrict: true
# 새 의존성은 정확한 버전으로 저장한다 (AC-S00-02)
saveExact: true
# 의존성의 설치 스크립트는 돌리지 않는다 (N2b-1, AC-N2b-1-01). protobufjs(틱톡 연결기 tiktok-live-connector@2.1.0의 하위 의존성)의
# postinstall은 cli/node_modules 폴더를 만들고 판 표기 경고를 내는 일뿐이라 실행에 필요 없다. 거절을 적어 두어야 설치가 실패하지 않는다.
allowBuilds:
  protobufjs: false
# pnpm 12의 "갓 나온 판 기다리기" 예외 — 앱 모듈(APP2)의 expo-modules-core 58.0.28(Expo SDK 55)이 아직 새 판이라 설치 때 pnpm이 적었다.
# 앱(apps/mobile)의 expo 판과 같은 줄이면 된다.
minimumReleaseAgeExclude:
  - '@expo/modules-macros-linux-arm64@0.27.1'
  - '@expo/modules-macros-linux-x64@0.27.1'
  - '@expo/modules-macros-win32-arm64@0.27.1'
  - '@expo/modules-macros-win32-x64@0.27.1'
  - expo-modules-core@58.0.28
  - expo-modules-jsi@58.0.21
  - expo-modules-macros@0.27.1
