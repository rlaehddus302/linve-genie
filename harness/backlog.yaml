techDebt:
  - "RA-S00-001: 골든 러너가 엔진의 입력 state 제자리 수정을 잡지 못함"
  - "RA-S00-002: golden 어댑터 observe가 항상 미구현이라 S02에서 G-ENG-* 허용으로 조용히 통과 가능"
  - "RA-S00-003: 코어 순수성 린트가 외부 패키지 import와 WeakRef·FinalizationRegistry·Atomics·import.meta를 막지 않음"
  - "RA-S00-004: 서버 기본 오류 기록이 예외 객체 전체를 stderr에 남김"
  - "TD-S00-007: Expect 헤더 오류(417)와 CONNECT 요청이 JSON 오류로 답하지 않음"
  - "TD-S00-008: Host 헤더 두 개·absolute-form 요청을 200으로 처리"
  - "TD-S00-009: 결정성 검사가 시작 상태의 관찰 스냅샷을 비교하지 않음"
  - "TD-S00-010: 관찰 스냅샷 형식·열거값 미검사로 pendingEffects·effectCounts 부정 검사가 조용히 통과 가능"
  - "TD-S00-011: 코어 순수성 린트 정적 우회(Math 별칭, Function 생성자, .jsx, src 밖 import)"
  - "TD-S00-012: 골든 파일 탐색이 심볼릭 링크와 대문자 확장자를 조용히 건너뜀"
