      자동 출력, 끊김 복구, 재출력·이력, 프린트 스테이션. 프린터 어댑터 인터페이스 + 가짜 프린터로 테스트.
      B1 마지막 줄 미출력 버그 대응(높이 +1행).
    specIds: [LBL-06, LBL-08, LBL-09, LBL-10, LBL-11, LBL-12]
    humanGate: HG-2
    status: todo

  - id: S09
    phase: 2
    title: 명세서 PDF + 엑셀 판매대장 + 포장 모드 + 백업·복구
    goal: 구매 내역 확인서 PDF(법정 증빙 아님 고지), 엑셀 판매대장, 포장 모드(체크리스트→포장 라벨→완료), 일일 백업·복구·전체 내보내기.
    specIds: [STL-04, STL-05, STL-06, STL-08, STL-10, DAT-03, DAT-04, BUY-05, PRD-05]
