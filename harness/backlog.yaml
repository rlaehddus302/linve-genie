      긴 품종명 자동 축소/줄바꿈, 상품·포장 라벨, PNG 저장, 라벨 크기 PDF, A4 모아찍기 PDF.
    specIds: [LBL-01, LBL-02, LBL-03, LBL-04, LBL-05, LBL-07]
