  - id: S00
    phase: 1
    title: 부트스트랩 — 저장소 골격과 검증 파이프라인
    devs: [core, server, web]
    tests: [domain]
    goal: >
      pnpm 모노레포(packages/core, packages/label, apps/server, apps/web), TypeScript strict, ESLint, Vitest,
      fast-check, 골든 러너 골격(tests/golden 의 YAML을 읽어 엔진에 넣고 expect 비교, 아직 엔진 없으면 "미구현"으로 실패),
      `pnpm verify` 스크립트(typecheck → lint → test → golden → adversarial → coverage), CI용 단일 명령.
      서버 헬스체크, 웹 빈 화면. 골든 러너는 파서 3종과 엔진 시나리오를 모두 로드할 수 있어야 한다.
    specIds: [NFR-02]
    acceptanceHints:
      - pnpm verify 한 번으로 전체 검사가 돈다
      - 골든 러너가 tests/golden/**/*.yaml 전부를 읽고, 미구현 항목은 "미구현"으로 표시된다 (S00에서는 golden 단계를 '알려진 실패'로 허용하는 플래그 제공, S01부터 끔)
    status: done
    note: 워크플로 결과는 FAIL(게이트 우회 5건 남음) → 오케스트레이터가 직접 수정해 pnpm verify 6단계 통과 (D-027)

