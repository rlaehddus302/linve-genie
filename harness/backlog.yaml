      입력 = 틱톡 아이디(또는 방송 주소), 출력 = 공통 댓글 레코드 {플랫폼 'TIKTOK', 댓글 ID, 숫자 사용자 ID 문자열, 닉네임, 본문, 서버 도착 시각}.
      연결·재연결(지수 백오프)·차단/서명 실패 오류를 쉬운 한국어 상태로 알리고, 같은 댓글 ID 중복 제거, 판매자 세션 쿠키는 받지도 저장하지도 않으며 글 올리기 기능은 없다.
      운영자 전체 끄기(환경 변수)와 판매자별 동의 상태를 확인하는 자리(인터페이스)만 둔다. 방송 연결 모델·화면·판정 연결은 N2(인스타, 플랫폼 공통 모델)가 끝난 뒤 N2b-2에서.
