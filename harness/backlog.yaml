  - id: L1
    phase: 6
    title: 간편 로그인 — 구글·카카오·네이버 (가짜 OAuth 서버로 시험, 실제 키는 사용자)
    dependsOn: []
    devs: [server, web]
    tests: [domain, e2e]
    uxReview: true
    goal: >
      판매자가 구글·카카오·네이버 계정으로 로그인할 수 있게 한다(사용자 요청 2026-10-22). 지금 로그인(D-074: 운영자가 만든 아이디·비밀번호, 세션 쿠키)은 그대로 두고 간편 로그인을 더한다.
      판매자에게 가장 안전한 쪽으로 spec-keeper가 정한다: 처음 가입을 간편 로그인으로 받을지(가입 화면·약관 동의·사업자 정보 없이 판매 시작 가능 여부), 기존 판매자는 설정에서 연결·해제(마지막 로그인 수단은 못 끔),
      같은 이메일이어도 자동으로 합치지 않음(계정 탈취 방지), 공급자 계정 ID(sub/id)로만 묶음, 보조자 계정은 간편 로그인 없음.
      OAuth 2.0 인가 코드 + state(+ PKCE 가능하면, 네이버는 state 필수), 돌아오는 주소 정확히 일치, 토큰은 로그인 뒤 버리거나 암호화 보관(로그 금지), 공급자 오류·취소·이메일 미동의의 쉬운 한국어 문장.
      구글 로그인과 유튜브 연결(D-019·D-Y02)은 서로 다른 동의로 둔다(로그인에는 유튜브 권한을 묻지 않음). 서버는 공급자마다 어댑터 + 127.0.0.1 가짜 OAuth 서버(시험·연습 모드), 실제 클라이언트 ID·비밀값은 환경 변수(.env.example·DEPLOY.md)로만.
      로그인 화면에 "구글로 계속하기·카카오로 계속하기·네이버로 계속하기"(각 공급자 디자인 지침의 버튼 모양·문구 — 상표 이미지 대신 글자·색은 지침 범위 안에서), 휴대폰 폭·44px. 연습 모드(pnpm try)에서도 가짜 공급자로 눌러 볼 수 있게.
    acceptanceHints:
