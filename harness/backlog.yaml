      384점·203dpi, 20~50mm 라벨. (2) Marklife P11·P12·P15·L13(국내 LP90·LP15) — L11 방식(10 FF F1 02…45 틀 안에 GS v 0 래스터,
      GATT ff00/ff02/ff01·ff03 크레딧 흐름 제어, 이름 앞자리로 고르기), 96점(12mm) 테이프 12~15mm. (3) BAUATO 스티코팝(PPA2L, Luck Jingle OEM, 384점,
      전용 롤 50×15·50×30·50×50) — L11 계열로 추정되는 "실험적" 프로필(이름 앞자리 PPA2, ff00), 실기기 확인(HG-5) 전까지는 실험 표시 + PNG를
