    devs: [server, web]
    tests: [domain, e2e]
    goal: >
      요금제 두 종류(SYS-03). 정액제: 30일 이용권(단건 결제, 갱신 알림) → 이후 빌링키 자동 갱신으로 바꿀 수 있는 구조. 정량제: 방송 N일권·주문 N건권·라벨 N장권을
      단건 결제로 사고 쓸 때 차감(entitlements + 멱등 키를 가진 append-only usage_events 원장). 결제는 포트원 V2 + 토스페이먼츠 어댑터(테스트 키·가짜 결제 서버로 시험),
      웹훅은 알림으로만 쓰고 결제 조회 API로 다시 확인·금액 대조. 이용권이 없거나 다 쓰면 무엇이 막히는지(새 방송 시작·주문 처리) 판매 중 사고가 나지 않게 정한다
      (방송 중 소진 시 그 방송은 끝까지 진행). 현금 환불·양도·출금되는 충전금은 만들지 않는다(선불업 위험). 가격 숫자는 운영 설정(기본값은 자리 표시).
      가입 시 사업자번호 수집, 계좌이체 건 세금계산서·현금영수증은 팝빌 어댑터 자리. 약관 7일 전액 환불 조항 초안.
