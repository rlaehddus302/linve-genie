    goal: 휴대폰 문자찜 입력, 구매자 목록·상세·합치기, 정산 묶음 목록, 입금·배송비 예외 입력. PWA 설치.
    specIds: [ORD-08, BUY-03, BUY-04, STL-01, STL-07, UX-04, UX-07]
