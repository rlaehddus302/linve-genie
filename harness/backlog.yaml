  - id: N2
    phase: 5
    title: 인스타그램 라이브 댓글 수집·감사 DM + 플랫폼 공통 연결 (서버, 병렬 트랙)
    devs: [server]
    tests: [domain]
    goal: >
      방송 연결을 플랫폼 공통 모델로 넓힌다(platform: YOUTUBE | INSTAGRAM | TIKTOK). 인스타그램은 공식 Instagram Platform API만 쓴다:
      판매자 계정 연결(비즈니스/크리에이터, Instagram Login 또는 Facebook Login — 둘 다 어댑터 뒤, 기본은 Facebook Login), live_media로 진행 중 라이브 찾기,
      live_comments 웹훅 수신(서명 검증, 중복 배달 제거 = 댓글 ID), 댓글 → chat 이벤트(collector 경로). 구매자 키 = IGSID(문자열), 닉네임 = username.
      댓글별 시각이 없으므로 판정 순위는 서버 도착순(ARRIVAL)만 — 인스타 방송은 실제 시각순 정책을 쓸 수 없다고 막고 화면 안내.
      감사 메시지는 공개 댓글 불가 → 라이브 중 1회 개인 답장(DM, recipient = 댓글 ID) 어댑터, 자동 게시 사전 동의·멱등·재시도는 유튜브 발송함과 같은 규칙.
      방송이 끝나면 댓글을 다시 가져올 수 없으므로 받는 즉시 기록. 메타 앱 심사(Advanced Access·비즈니스 인증)는 사용자 몫 — 가짜 메타 서버로 모든 시험.
      틱톡은 사용자 결정(D-904) 전까지 어댑터 자리만 둔다.
    specIds: [PLT-01, PLT-03, YT-04, YT-06]
    status: done
    note: >
      메인에 합침(2026-10-21, 3342f10). 인스타그램 라이브 댓글 웹훅 수집·감사 DM·플랫폼 공통 연결(live-links)·새 라이브로 옮기기(D-N2-16~18: 60분 간격, 잇거나 옮긴 뒤 1분은 옮기지 않음, LIVE_NOT_MOVED 알림).
      합친 뒤 pnpm verify 7단계 모두 통과(부하 아래 한 번에).
    carryOver:
