  # ─────────── 3단계: 유튜브 연동 ───────────
  - id: S10
    phase: 3
    title: 유튜브 계정 연결 + 방송 선택 + 채팅 수집(streamList)
    goal: >
      구글 OAuth(최소 권한), 내 라이브 목록에서 선택/URL 붙여넣기, liveChatMessages.streamList(gRPC) 수집,
      끊김 시 nextPageToken 이어받기, 폴링 대체 경로, 할당량 계산·표시. 수집기는 어댑터 + 가짜 채팅 서버로 테스트.
