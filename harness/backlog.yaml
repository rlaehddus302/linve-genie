# 라이브찜 스프린트 백로그
# status: todo | doing | done | fail | blocked
# humanGate: 이 스프린트가 끝나면 사람 확인이 필요 (SPEC §9) — 자율 진행 중엔 모의 검증으로 대신하고 최종 보고에 모은다
# devs: 개발 영역(core/device/server/web, 의존 순서로 실행) · tests: 테스트 종류(domain/e2e)
# 순서대로 진행한다. 오케스트레이터가 리포트를 보고 순서·범위를 조정한다.

sprints:
  # ─────────── 1단계: 기본 판매 관리 ───────────
  - id: S00
    phase: 1
    title: 부트스트랩 — 저장소 골격과 검증 파이프라인
    devs: [core, server, web]
    tests: [domain]
    goal: >
      pnpm 모노레포(packages/core, packages/label, apps/server, apps/web), TypeScript strict, ESLint, Vitest,
      fast-check, 골든 러너 골격(tests/golden 의 YAML을 읽어 엔진에 넣고 expect 비교, 아직 엔진 없으면 "미구현"으로 실패),
      `pnpm verify` 스크립트(typecheck → lint → test → golden → adversarial → coverage), CI용 단일 명령.
      서버 헬스체크, 웹 빈 화면. 골든 러너는 파서 3종과 엔진 시나리오를 모두 로드할 수 있어야 한다.
    specIds: [NFR-02]
    acceptanceHints:
      - pnpm verify 한 번으로 전체 검사가 돈다
      - 골든 러너가 tests/golden/**/*.yaml 전부를 읽고, 미구현 항목은 "미구현"으로 표시된다 (S00에서는 golden 단계를 '알려진 실패'로 허용하는 플래그 제공, S01부터 끔)
    status: done
    note: 워크플로 결과는 FAIL(게이트 우회 5건 남음) → 오케스트레이터가 직접 수정해 pnpm verify 6단계 통과 (D-027)

  - id: S01
    phase: 1
    title: 코어 I — 파서 (채팅·금액·빠른 입력)
    devs: [core]
    tests: [domain]
    goal: 채팅 주문 인식(R-3), 한글 금액·수사 파서, 빠른 입력 파서. 골든 parser/* 전부 통과.
    specIds: [ORD-01, PRD-01]
    status: done
    note: 워크플로 결과 FAIL(마지막 판정 D-035 미구현) → 코어 개발자 추가 패스로 구현, pnpm verify 6단계 통과 (오케스트레이터 확인)

  - id: S02
    phase: 1
    title: 코어 II — 판정 엔진 (선착순·대기·보류·취소·승계·수동 조치)
    devs: [core]
    tests: [domain]
    goal: >
      순수 리듀서 apply(state, event) → { state, effects }. R-0~R-5, R-8, R-9, R-13.
      골든 engine/01~03, 07 통과. INV-1~12 속성 테스트.
    specIds: [ORD-02, ORD-03, ORD-04, ORD-05, ORD-06, ORD-07, ORD-11, ORD-12, PRD-03, PRD-04]
    status: done

  - id: S03
    phase: 1
    title: 코어 III — 문자찜·경합·충돌, 상품 수정, 구매자·정산 계산
    devs: [core]
    tests: [domain]
    goal: R-6, R-7, R-10, R-11, R-12. 골든 engine/04~06 통과.
    carryOver:
      - 모르는 이벤트 종류는 조용히 무시하지 말고 오류로 알린다. R-1 표기(chat.message·sms.claim)와 README 표기 통일 (SA-S02-002)
      - Draft의 배열 통째 복사 제거(보류 찜·구매자 찜이 많아도 이벤트당 비용 일정), checkInvariants를 한 번 순회로 (TD-S02-002, RA-S02-001)
      - 처리 시간 테스트는 최댓값 대신 p99·준비 구간 제외로 (RA-S02-006)
    specIds: [ORD-08, ORD-09, ORD-10, PRD-02, BUY-01, BUY-02, BUY-03, BUY-04, STL-01, STL-02, STL-03, STL-07, STL-09]
    status: done

  - id: S03b
    phase: 1
    title: 코어 정리 — 전화번호 평문 제거, S03 미결 규칙 정리
    devs: [core]
    tests: [domain]
    goal: >
      S04가 엔진 상태를 저장하기 전에 개인정보 구조를 고치고, S03 감사에서 남은 방송자 조작 규칙 빈틈을
      단순·보수 원칙(D-036)으로 닫는다.
    carryOver:
      - "RA-S03-001: 엔진 상태에 휴대폰 번호 평문을 두지 않는다. sms 이벤트는 서버가 정규화·HMAC한 불투명 phoneKey와 phoneLast4만 받는다(normalizePhone은 core에 유지). 문자찜 ref는 서버가 만든 무작위·일련 ID라는 문장을 R-1/DAT-06에 넣는다"
      - "SA-S03-001: 주문이었던 메시지(4번 줄로 찜을 만들지 않은 경우 포함)는 변환하지 못하게 한다 (R-7 4 괄호 문장대로)"
      - "SA-S03-002: 시청자 채팅 취소의 대상 찾기 규칙을 R-8에 명시한다 (지금 동작 유지 여부를 spec-keeper가 결정)"
      - "SA-S03-003 / RA-S03-002: 충돌 중인 상품에 교체 배정(host.assign + replace)은 맞지 않는 명령으로 무시한다 (방송자는 충돌부터 해결)"
      - "SA-S03-004: host.assign의 replace·replaceTo 한쪽만 있으면 입력 오류 (README 계약과 일치)"
      - "SA-S03-005: 재고를 늘려 여럿이 확정될 때 확정버전 순서를 R-13·R-10 중 하나로 통일해 명시"
      - "TD-S03-001: 모르는 지정 구매자의 문자찜 사본 재수신 시 결과가 같도록 (INV-3·INV-12 우선)"
      - "TD-S03-002: 대기가 가득 찬 상태에서 충돌이 자동으로 풀릴 때 대기 맨 끝 사람이 이유 없이 품절되지 않도록 규칙을 정한다"
    specIds: [DAT-06, ORD-10, ORD-12, BUY-02]
    status: done

  - id: S04
    phase: 1
    title: 저장소·API·실시간 동기화
    devs: [core, server]
    tests: [domain]
    goal: >
      PostgreSQL(Drizzle) 스키마, 이벤트 저장(입력 우선 기록, 외부 ID 유일 제약), 방송별 직렬 처리,
      프로젝션, 재생 무결성 검사 명령, REST API, 실시간 푸시(SSE 또는 WebSocket), 판매자 로그인(단일 판매자부터).
      테스트는 PGlite로 도커 없이.
    carryOver:
      - outbox·효과 중복 제거 키 = (판매자, 방송/엔진 범위, 효과 ID) — 효과 ID는 엔진 상태 안에서만 유일 (RA-S02-003)
      - 엔진이 지원하지 않는 이벤트 종류는 로그에 쓰지 않고, 재생 중 오류를 만나면 경보 후 마지막 정상 상태로 (RA-S02-005)
      - "SA-S03b-002 / RA-S03b-002: 서버는 sms 엔진 이벤트를 허용 필드(b, ref, no, received, memo, phoneKey, phoneLast4, buyer)만으로 새로 만들어 기록하고 받은 원본 요청은 로그에 쓰지 않는다. 코어 checkEvent도 sms는 허용 목록으로(모르는 필드 = 입력 오류), 숫자로만 된 휴대폰 번호 모양 ref는 입력 오류"
      - "RA-S03b-001: apps/**/src(테스트 제외)에서 @livejjim/core/golden import 금지 린트 + 서버 코드에 TEST_PHONE_SECRET 금지. 서버 phoneKey는 판매자별 비밀 키로 서버에서 HMAC (D-061)"
      - "RA-S03b-004: applyEvent·checkEvent 입구에서 state.format 확인, 다르면 명확한 오류. 스냅샷 읽기 때 형식 확인"
      - "RA-S03b-003: 승계=ASK + 대기 한도 0에서 자리가 비어 풀린 충돌 찜이 품절되고 묻지 않는 문제 — spec-keeper가 단순 규칙으로 결정"
      - "SA-S03b-001: 취소만 있는 메시지('15 취소')는 찜으로 변환하지 않는다 (D-062 취지), 테스트로 고정"
    specIds: [DAT-01, DAT-02, DAT-05, DAT-06, SYS-01, SYS-02, NFR-01, NFR-03, NFR-06, NFR-07]
    status: done
    note: 워크플로 FAIL(전화번호 검사 범위) → D-079로 단순화 후 수정 패스(spec→test→core→server), verify 6단계 통과·실서버 스모크(로그인→방송→상품→문자찜→정산, DB에 번호 평문 없음) 오케스트레이터 확인

  - id: S05
    phase: 1
    title: 라이브 콘솔 + 리허설(시뮬레이터) 모드
    devs: [server, web]
    tests: [domain, e2e]
    goal: >
      방송 만들기, 빠른 입력, 상품 보드, 채팅 패널(주문 강조·메시지→찜 변환), 알림 띠(충돌·보류·취소 요청),
      되돌리기, 단축키. 가짜 채팅 생성기로 방송 리허설.
    carryOver:
      - "RA-S04-007·RA-S04-008: 화면 반영 1초를 알림 도착이 아니라 화면 갱신까지로 재고, 알림마다 전체 조회·판매자 전체 집계를 다시 하지 않도록(증분 조회)"
      - "RA-S04-006: 차단 이어받기가 코어 내부 구조를 직접 훑지 않도록 코어에 조회 함수 제공"
      - "채팅 입력은 수집기 경로(actor collector)로만 들어온다 — 리허설 시뮬레이터가 이 경로를 쓴다"
    specIds: [YT-09, UX-01, UX-03, UX-05, UX-06, ORD-10, ORD-12]
    uxReview: true
    status: done
    note: PASS(2라운드). 오케스트레이터가 E2E를 verify 정식 단계로 편입(RA-S05-005) — 7단계 통과, E2E 67개(리허설 1,000건·상품 30개 끝까지 = 코어 재생, 1만 건 규모 반영 p99 107ms)

  - id: S06
    phase: 1
    title: 문자찜 입력(휴대폰) + 구매자·정산 화면
    devs: [server, web]
    tests: [e2e]
    goal: 휴대폰 문자찜 입력, 구매자 목록·상세·합치기, 정산 묶음 목록, 입금·배송비 예외 입력. PWA 설치.
    carryOver:
      - "S05 UX 지적 정리: UX-S05-003(사유 창 보내기 버튼을 '찜 취소하기'처럼 동사로), UX-S05-004(휴대폰 고정 영역 59% → 줄이기), UX-S05-005(채팅 '찜으로 바꾸기' 버튼 밀도), UX-S05-006(끊김 안내를 고정 영역 안으로), UX-S05-007(자주 쓰는 사유에 숫자 키), UX-S05-008(잠긴 버튼 hover 명암), UX-S05-009(번호 빠진 빠른 입력 고치기 칸 채우기), UX-S05-010~013(nit)"
      - "RA-S05-004: 410 뒤 전체 다시 받기 실패 시 재시도·'lost' 표시"
      - "RA-S05-003: 리허설 생성기 판매자당 1개, 끝난 실행 정리"
      - "RA-S05-001: 보기 인덱스 캐시를 범위 실행 상태에 묶고 판매자 간 공유 제거"
      - "RA-S05-006: E2E 서버는 127.0.0.1에서만 연다"
      - "TD-S05-004: 번호 변경 뒤 같은 번호 새 상품의 조치 기록 — 상품 ID 기준으로 거를지 spec-keeper 결정"
      - "SA-S05-006: 번호가 바뀐 상품의 '고칠까요?' 항목 문장"
    specIds: [ORD-08, BUY-03, BUY-04, STL-01, STL-07, UX-04, UX-07]
    uxReview: true
    humanGate: HG-1
    status: done

