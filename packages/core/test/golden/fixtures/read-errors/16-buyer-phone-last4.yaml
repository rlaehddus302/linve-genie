# 따옴표 없이 적어 정수가 되면(5678, 0000 → 0) 읽기 오류다
id: G-ENG-901
title: 뒤 4자리를 정수로
refs: [R-11]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: sms, b: b1, ref: s1, no: 15, received: "20:00", phone: "010-1234-5678" }
  - { type: assert, expect: { buyers: { "sms:s1": { phoneLast4: 5678 } } } }
