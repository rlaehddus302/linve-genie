refs: [R-11]
broadcasts: [{ id: b1, date: 2026-10-18, title: 1부 }]
events:
  - { at: "20:00:00", type: sms, b: b1, ref: s1, no: 15, received: "20:00", phone: "010-9999-0000" }
  - { at: "20:00:01", type: sms, b: b1, ref: s2, no: 15, received: "20:00", phone: "010-1234-5678" }
  - { at: "20:00:02", type: sms, b: b1, ref: s3, no: 15, received: "20:00", phone: "010-1234-5678" }
expect:
  buyers:
    "sms:s1": { phoneLast4: 0000 }
    "sms:s2": { phoneLast4: "567" }
